name: Copilot Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot reviewer (GraphQL)
        # `secrets.GH_TOKEN` must be a fine-grained PAT with
        # `Pull requests: write`. The default `GITHUB_TOKEN` and classic
        # PATs are silently rejected by GitHub for bot reviewer
        # assignment since the late-April 2026 Copilot platform
        # tightening, so no fallback is provided.
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          # Copilot pull-request-reviewer bot node id (stable, GitHub-assigned).
          COPILOT_BOT_ID: BOT_kgDOCnlnWA
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=GH_TOKEN missing::Set a fine-grained PAT (Pull requests: write) as the GH_TOKEN repo secret to enable Copilot review."
            exit 0
          fi
          gh api graphql \
            -f query='mutation($prId: ID!, $botId: ID!) {
              requestReviews(input: { pullRequestId: $prId, botIds: [$botId], union: true }) {
                pullRequest { id }
              }
            }' \
            -f prId="$PR_NODE_ID" \
            -f botId="$COPILOT_BOT_ID"
          # Self-diagnose silent no-op: GitHub may accept the mutation
          # while server-side disabling Copilot review for the repo or
          # account (see GitHub Community Discussion #171474). Re-query
          # reviewRequests and warn if the bot did not actually land.
          ADDED=$(gh api graphql \
            -f query='query($prId: ID!) {
              node(id: $prId) {
                ... on PullRequest {
                  reviewRequests(first: 100) {
                    nodes {
                      requestedReviewer {
                        ... on Bot { databaseId }
                      }
                    }
                  }
                }
              }
            }' \
            -f prId="$PR_NODE_ID" \
            --jq '[.data.node.reviewRequests.nodes[].requestedReviewer.databaseId] | map(select(. == 175728472)) | length')
          if [ "${ADDED:-0}" -eq 0 ]; then
            echo "::warning title=Copilot reviewer assignment silently ignored::GraphQL requestReviews accepted the mutation but the Copilot bot is not in reviewRequests. The repository or account may have Copilot code review disabled (Settings -> Copilot -> Code review) or the account may be over its weekly Copilot usage cap."
          fi
