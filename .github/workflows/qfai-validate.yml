# QFAI validate CI workflow
#
# Generated by `qfai init`. Runs `qfai validate --profile
# full --fail-on error` on every push to main/master and every pull request.
#
# The `full` profile includes the QFAI-TEST-001 test-todo stub gate, so any
# `it.todo` / `test.todo` / `describe.todo` in your test suite will fail CI
# (you can opt out via `validation.testStrategy.forbidTestTodoStubs: false`
# in qfai.config.yaml).
#
# If your project uses pnpm / yarn instead of npm, replace the `npm ci` step
# with your package manager's install command (e.g. `pnpm install
# --frozen-lockfile` + corepack-activated pnpm). `npx qfai` works with any
# Node package manager.

name: qfai validate

on:
  push:
    branches: [main, master]
  pull_request:

# Least-privilege default. This workflow only reads the tree and runs a
# validator; nothing it does needs write access.
permissions:
  contents: read

jobs:
  validate:
    name: qfai validate (full profile, fail on error)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: "Enable corepack (provides pnpm for setup-node cache: pnpm)"
        run: corepack enable
        shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Match the QFAI repo's CI baseline (Node 20 LTS) and the package
          # `engines: ">=18.0.0"`. Bump deliberately when QFAI raises its
          # supported floor.
          node-version: "20"
          cache: pnpm
      - name: Re-shim pnpm against toolcache Node
        run: corepack prepare pnpm@9.12.3 --activate
        shell: bash
      - run: pnpm install --frozen-lockfile
      - name: build qfai
        run: pnpm -C packages/qfai build
      - name: qfai validate
        run: node packages/qfai/dist/cli/index.mjs validate --profile full --fail-on error
