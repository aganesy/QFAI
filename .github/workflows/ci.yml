name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies (Node 18)
        run: pnpm install --frozen-lockfile

      - name: Run CI gate (Node 18)
        run: pnpm ci:local

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (Node 20)
        run: pnpm install --frozen-lockfile

      - name: Run CI gate (Node 20)
        run: pnpm ci:local

      - name: Run future TypeScript compatibility check
        # NOTE:
        # - This step runs a "future" TypeScript type-check (e.g. with stricter or upcoming TS settings)
        #   using the configuration defined in the repository (see the pnpm script `check-types:future`
        #   and related tsconfig/TypeScript settings).
        # - If this step fails on a PR, fix the reported type errors before merging instead of ignoring them.
        run: pnpm check-types:future

      - name: Run qfai validate gate (fail on error)
        shell: bash
        run: |
          set -euo pipefail
          node packages/qfai/dist/cli/index.mjs validate --root tmp/pack/sandbox/out --fail-on error --format github | tee tmp/pack/sandbox/out/.qfai/report/validate.log

      - name: Run qfai report (optional)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node packages/qfai/dist/cli/index.mjs report --root tmp/pack/sandbox/out --run-validate || true

      - name: Upload qfai artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qfai-report
          retention-days: 14
          path: |
            tmp/pack/sandbox/out/.qfai/report/validate.json
            tmp/pack/sandbox/out/.qfai/report/validate.log
            tmp/pack/sandbox/out/.qfai/report/report.md
            tmp/pack/sandbox/out/.qfai/report/run-*/
            tmp/pack/sandbox/out/.qfai/report/specs-coverage/spec-*.md
