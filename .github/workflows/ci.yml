name: CI

on:
  pull_request:
  push:
    branches:
      - main

# ── Node version configuration ──────────────────────────────────────
# Change these values to add/remove Node versions across all jobs.
# - NODE_LTS: used by lint, check-types, check-types-future, build-verify
# - NODE_TEST_VERSIONS: JSON array used by the test matrix
env:
  NODE_LTS: "20"
  NODE_TEST_VERSIONS: '["18", "20"]'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs (parallel) ─────────────────────────────────────────────────
jobs:
  # ── 1. Lint & format checks ──────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run lint gate
        run: pnpm ci:lint

  # ── 2. Type checking (current TypeScript) ────────────────────────
  check-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run type check
        run: pnpm check-types

  # ── 3. Type checking (future TypeScript) ─────────────────────────
  check-types-future:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run future TypeScript compatibility check
        run: pnpm check-types:future

  # ── 4. Tests (matrix: multiple Node versions) ────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(env.NODE_TEST_VERSIONS) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests (Node ${{ matrix.node-version }})
        run: pnpm -C packages/qfai test

  # ── 5. Build, pack verification & qfai validate ─────────────────
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run build & pack verification
        run: pnpm ci:build-verify

      - name: Run qfai validate gate (fail on error)
        shell: bash
        run: |
          set -euo pipefail
          node packages/qfai/dist/cli/index.mjs validate --root tmp/pack/sandbox/out --fail-on error --format github | tee tmp/pack/sandbox/out/.qfai/report/validate.log

      - name: Run qfai report (optional)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node packages/qfai/dist/cli/index.mjs report --root tmp/pack/sandbox/out --run-validate || true

      - name: Upload qfai artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qfai-report
          retention-days: 14
          path: |
            tmp/pack/sandbox/out/.qfai/report/validate.json
            tmp/pack/sandbox/out/.qfai/report/validate.log
            tmp/pack/sandbox/out/.qfai/report/report.md
            tmp/pack/sandbox/out/.qfai/report/run-*/
            tmp/pack/sandbox/out/.qfai/report/specs-coverage/spec-*.md

  # ── 6. Aggregate gate (for branch protection) ────────────────────
  ci-pass:
    if: always()
    needs: [lint, check-types, check-types-future, test, build-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs passed
        run: |
          echo "lint:                ${{ needs.lint.result }}"
          echo "check-types:         ${{ needs.check-types.result }}"
          echo "check-types-future:  ${{ needs.check-types-future.result }}"
          echo "test:                ${{ needs.test.result }}"
          echo "build-verify:        ${{ needs.build-verify.result }}"
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.check-types.result }}" != "success" ||
                "${{ needs.check-types-future.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.build-verify.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
