name: CI

on:
  pull_request:
  push:
    branches:
      - main

# ── Node version configuration ──────────────────────────────────────
# Change these values to update the shared Node version for non-matrix jobs.
# - NODE_LTS: used by lint, check-types, check-types-future, build
env:
  NODE_LTS: "20.19"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs (parallel) ─────────────────────────────────────────────────
jobs:
  # ── 1. Lint & format checks ──────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run lint gate
        run: pnpm ci:lint
      - name: Sanity grep — no internal spec IDs or version markers leak
        run: bash packages/qfai/scripts/check-no-internal-version-leakage.sh
      - name: Verify branch name version pin matches package.json#version
        run: bash packages/qfai/scripts/check-branch-version-pin.sh
        shell: bash

  # ── 2. Type checking (current TypeScript) ────────────────────────
  check-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run type check
        run: pnpm check-types

  # ── 3. Type checking (future TypeScript) ─────────────────────────
  check-types-future:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run future TypeScript compatibility check
        run: pnpm check-types:future

  # ── 4. Tests (matrix: test slices) ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        slice: [core, validators, integration, e2e, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests (${{ matrix.slice }})
        run: pnpm -C packages/qfai test -- --project ${{ matrix.slice }}

  # ── 5. Build, pack verification & qfai validate ─────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run build & pack verification
        run: pnpm ci:build-verify

      - name: Sanity grep — no internal spec IDs or version markers leak (post-build)
        run: bash packages/qfai/scripts/check-no-internal-version-leakage.sh

      - name: QFAI self-validate this repo (dogfooding)
        shell: bash
        run: |
          set -euo pipefail
          # `tdd` profile includes QFAI-TEST-001 (forbidden it.todo/test.todo
          # stubs) and the TDD list / SC traceability gates. Running it against
          # the repo root (`--root .`) means QFAI ships nothing to downstream
          # users that its own repo wouldn't pass.
          node packages/qfai/dist/cli/index.mjs validate \
            --profile tdd \
            --fail-on error \
            --format github \
            --root .

      - name: Run qfai validate gate (fail on error)
        shell: bash
        run: |
          set -euo pipefail
          node packages/qfai/dist/cli/index.mjs validate --root tmp/pack/sandbox/out --fail-on error --format github | tee tmp/pack/sandbox/out/.qfai/report/validate.log

      - name: Run qfai report (optional)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node packages/qfai/dist/cli/index.mjs report --root tmp/pack/sandbox/out --run-validate || true

      - name: Upload qfai artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qfai-report
          retention-days: 14
          path: |
            tmp/pack/sandbox/out/.qfai/report/validate.json
            tmp/pack/sandbox/out/.qfai/report/validate.log
            tmp/pack/sandbox/out/.qfai/report/report.md
            tmp/pack/sandbox/out/.qfai/report/run-*/
            tmp/pack/sandbox/out/.qfai/report/specs-coverage/spec-*.md

  # ── 6. Aggregate gate (for branch protection) ────────────────────
  ci-pass:
    if: always()
    needs: [lint, check-types, check-types-future, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs passed
        run: |
          echo "lint:                ${{ needs.lint.result }}"
          echo "check-types:         ${{ needs['check-types'].result }}"
          echo "check-types-future:  ${{ needs['check-types-future'].result }}"
          echo "test:                ${{ needs.test.result }}"
          echo "build:               ${{ needs.build.result }}"
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs['check-types'].result }}" != "success" ||
                "${{ needs['check-types-future'].result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
