name: CI

on:
  pull_request:
  push:
    branches:
      - main

# ── Least-privilege default for every job in this workflow ──────────
# `contents: read` is the minimal scope. A job needing more declares its
# own block; a job needing none declares an empty one, which is explicit
# rather than missing. Reachability is what the requirement is written
# against: a job with no block of its own is still governed by this one.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs (parallel) ─────────────────────────────────────────────────
jobs:
  # ── 0. Change detection ──────────────────────────────────────────
  # The classifier is a program rather than a path filter so the rule can be
  # EXECUTED by a test. The heredoc is quoted, so the bytes GitHub runs are the
  # bytes the test extracts and runs.
  detect:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the diff is against the base commit, and a shallow clone is
          # one of the two failures BR-0017-0008 requires to fail open with an
          # annotation rather than silently narrow the lane set.
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change against the enumerated directory lists
        id: classify
        env:
          # Both event shapes. On a pull request the base commit; on a push the
          # previous head. Empty on neither, which matters because an empty base
          # makes the diff fail and the classifier fail open — correct, but it
          # would put a warning annotation on every push to the default branch,
          # and an annotation that is always present is one nobody reads.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # The diff is ATTEMPTED here and decided by the program. `|| true` is
          # deliberate: a shallow clone or an unreachable base ref must reach the
          # classifier as "no path list was produced", so that failing open and naming
          # the reason live in the one place a test can execute.
          # `--no-renames` is load-bearing. With rename detection ON git reports only the
          # DESTINATION of a move, so `git mv src/x.ts docs/x.md` arrives here as a single
          # documentation path and the source change skips every test lane. Turning
          # detection off makes both halves visible, and the source half classifies as
          # source. Measured: the default reports one path, `--no-renames` reports two.
          git diff --name-only --no-renames "${BASE_SHA}" "${HEAD_SHA}" \
            > "${RUNNER_TEMP}/changed.txt" 2> "${RUNNER_TEMP}/diff-err.txt" || true
          cat > "${RUNNER_TEMP}/detect.mjs" <<'NODE'
          // Change detection: classify the pull request's changed paths against two
          // ENUMERATED lists and select either the full lane set or the
          // documentation-only minimum.
          //
          // The whole decision lives here, failure included. BR-0017-0008 requires a
          // failed diff to emit an annotation naming the reason AND to select the full
          // set; if that branch lived in the shell it would be the one part of the rule
          // no test could execute. The workflow only attempts the diff.
          import { appendFileSync, readFileSync } from "node:fs";
          import process from "node:process";

          // Directories this classifier knows how to reason about (BR-0017-0009). The
          // list is CLOSED: a path outside every entry selects the full set and says so,
          // because an unclassified path is never "nothing to run".
          const RECOGNIZED_DIRS = [
            ".agents/",
            ".claude/",
            ".codex/",
            ".github/",
            ".instruction/",
            ".qfai/",
            "packages/",
            "scripts/",
            "tests/",
          ];

          // The same closed-list rule at file granularity, for the repository root.
          const RECOGNIZED_FILES = [
            "AGENTS.md",
            "CHANGELOG.md",
            "CLAUDE.md",
            "DESIGN.md",
            "LICENSE",
            "README.md",
            "RELEASE.md",
            "REVIEW.md",
            "eslint.config.js",
            "package.json",
            "pnpm-lock.yaml",
            "pnpm-workspace.yaml",
            "qfai.config.yaml",
            "tsconfig.base.json",
            "tsconfig.json",
          ];

          // Paths that may NEVER be read as documentation, checked before the
          // documentation set (BR-0017-0010). The assistant tree is named here rather
          // than merely left out, so the exclusion is enforced instead of incidental:
          // what lives there changes validate output, which is why the catalog is
          // loaded and not merely shipped.
          const NEVER_DOCUMENTATION = [".qfai/assistant/"];

          // The documentation-only set (BR-0017-0010). Small, and measured rather than
          // guessed: every other candidate is read by at least one test file, so
          // classifying it as documentation would skip the lane that guards it. The
          // agent-integration mirrors are here because the rule names them.
          const DOCUMENTATION_DIRS = [
            ".agents/",
            ".claude/",
            ".codex/",
            ".instruction/",
            "packages/qfai/docs/",
          ];
          const DOCUMENTATION_FILES = ["LICENSE", "REVIEW.md"];

          const under = (dirs, file) => dirs.some((dir) => file.startsWith(dir));
          const oneLine = (text) => text.replace(/[\r\n]+/g, " ").trim();

          function read(file) {
            if (typeof file !== "string" || file.length === 0) return null;
            try {
              return readFileSync(file, "utf-8");
            } catch {
              return null;
            }
          }

          function emit(full, reason) {
            const line = "full=" + (full ? "true" : "false") + "\n" + "reason=" + oneLine(reason) + "\n";
            const target = process.env.GITHUB_OUTPUT;
            if (typeof target === "string" && target.length > 0) appendFileSync(target, line);
            else process.stdout.write(line);
          }

          function classify(paths) {
            for (const file of paths) {
              if (!under(RECOGNIZED_DIRS, file) && !RECOGNIZED_FILES.includes(file)) {
                return { full: true, reason: "unrecognized path, outside every recognized directory: " + file };
              }
              if (under(NEVER_DOCUMENTATION, file)) {
                return { full: true, reason: "alters validate output: " + file };
              }
              if (!under(DOCUMENTATION_DIRS, file) && !DOCUMENTATION_FILES.includes(file)) {
                return { full: true, reason: "source path: " + file };
              }
            }
            return { full: false, reason: "documentation-only: " + paths.length + " path(s)" };
          }

          function main() {
            const [, , pathsFile, diffErrorFile] = process.argv;
            const paths = (read(pathsFile) ?? "")
              .split("\n")
              .map((line) => line.trim())
              .filter((line) => line.length > 0);

            // An EMPTY list is a failure to compute, never "nothing changed". A pull
            // request always changes something, so an empty diff means the diff did not
            // run — a shallow clone or an unreachable base ref, the two cases
            // AC-0017-0004 names.
            if (paths.length === 0) {
              const why = oneLine(read(diffErrorFile) ?? "") || "git produced no output and no error text";
              process.stdout.write(
                "::warning title=change detection failed open::could not compute the changed-path list, so the full lane set is selected: " +
                  why +
                  "\n",
              );
              emit(true, "diff unavailable: " + why);
              return;
            }

            const verdict = classify(paths);
            emit(verdict.full, verdict.reason);
          }

          main();
          NODE
          node "${RUNNER_TEMP}/detect.mjs" "${RUNNER_TEMP}/changed.txt" "${RUNNER_TEMP}/diff-err.txt"

  # ── 1. Lint & format checks ──────────────────────────────────────
  # TODO(QFAI-PR206-followup): add a windows-latest matrix entry that runs
  # at minimum the agentsRulesSurface integration test, to catch the
  # symlink-vs-text-file divergence that affects .claude/rules/*.md on
  # Windows without core.symlinks=true. Deferred from #33 because the
  # accompanying test fix (#11) needs to land alongside the matrix
  # expansion to avoid an instantly-red Windows job.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # pair-changed CI lane (check-prompt-scanner-pair.mjs) needs
          # `origin/main` reachable for `git diff --name-only
          # origin/main...HEAD`. Default shallow checkout doesn't fetch
          # base ref refs, so fetch full history here.
          fetch-depth: 0
      - name: Ensure base ref is fetched (for pair-changed CI lane)
        run: |
          # PR runs already have origin/main as a remote-tracking ref
          # after fetch-depth: 0, but be defensive in case the workflow
          # is invoked from a fork or a non-PR event.
          git fetch --no-tags --depth=1 origin main || true
        shell: bash
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup
      - name: Run lint gate
        run: pnpm ci:lint
      - name: Sanity grep — no internal spec IDs or version markers leak
        run: bash packages/qfai/scripts/check-no-internal-version-leakage.sh
      - name: Verify branch name version pin matches package.json#version
        run: bash packages/qfai/scripts/check-branch-version-pin.sh
        shell: bash

  # ── 2. Type checking (current TypeScript) ────────────────────────
  check-types:
    needs: [detect]
    # Derived from the detection output, never hand-written. A leg stays
    # DECLARED and reports skipped, so its check name persists and branch
    # protection needs no repository setting change (BR-0017-0006, BR-0017-0013).
    if: ${{ needs.detect.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup
      - name: Run type check
        run: pnpm check-types

  # ── 3. Type checking (future TypeScript) ─────────────────────────
  check-types-future:
    needs: [detect]
    # Derived from the detection output, never hand-written. A leg stays
    # DECLARED and reports skipped, so its check name persists and branch
    # protection needs no repository setting change (BR-0017-0006, BR-0017-0013).
    if: ${{ needs.detect.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup
      - name: Run future TypeScript compatibility check
        run: pnpm check-types:future

  # ── 4. Tests (matrix: test slices) ──────────────────────────────
  test:
    needs: [detect]
    # Derived from the detection output, never hand-written. A leg stays
    # DECLARED and reports skipped, so its check name persists and branch
    # protection needs no repository setting change (BR-0017-0006, BR-0017-0013).
    if: ${{ needs.detect.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        slice: [core, validators, integration, e2e, cli, unit, scripts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup
      # The e2e AND integration slices contain tests that exec the built
      # CLI at `packages/qfai/dist/cli/index.{cjs,mjs}` (e.g.
      # spec0010DiscussionMockAndPointerE2E, spec0008AtddScaffold,
      # spec0014SaasPackageCertify, spec0006DoctorRemediation,
      # spec0004SaasPackageAndPackLocation). In a clean GitHub Actions
      # checkout `dist/` is not committed, so both slices need a build
      # step before the test step. Other slices run pure TS via vitest's
      # loader and do not need dist on disk. Codex r3338425862.
      - name: Build qfai (e2e + integration slices)
        if: matrix.slice == 'e2e' || matrix.slice == 'integration'
        run: pnpm -C packages/qfai build
      - name: Run tests (${{ matrix.slice }})
        # The per-slice script, not the generic runner with a project name.
        # While this read `test -- --project <slice>` a slice with no script of
        # its own still ran, so nothing ever demanded the script exist and the
        # three slice surfaces could drift silently.
        run: pnpm -C packages/qfai test:${{ matrix.slice }}

  # ── 4b. Scanner module statement-coverage gate ───────────────────
  # Asserts that `packages/qfai/src/core/prototyping/designMdViolations.ts`
  # (the DESIGN.md compliance scanner) retains >= 90% statement coverage.
  # Paired with the in-process test-count floor (>= 30 unit tests on
  # the scanner suite); together they pin both breadth and depth of
  # the scanner test surface.
  scanner-coverage:
    needs: [detect]
    # Derived from the detection output, never hand-written. A leg stays
    # DECLARED and reports skipped, so its check name persists and branch
    # protection needs no repository setting change (BR-0017-0006, BR-0017-0013).
    if: ${{ needs.detect.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup
      - name: Run scanner coverage gate
        run: pnpm ci:coverage

  # ── 5. Build, pack verification & qfai validate ─────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup

      - name: Run build & pack verification
        run: pnpm ci:build-verify

      - name: Sanity grep — no internal spec IDs or version markers leak (post-build)
        run: bash packages/qfai/scripts/check-no-internal-version-leakage.sh

      - name: QFAI self-validate this repo (dogfooding — TDD gates)
        shell: bash
        run: |
          set -euo pipefail
          # `tdd` profile includes QFAI-TEST-001 (forbidden it.todo/test.todo
          # stubs) and the TDD list / SC traceability gates. Running it against
          # the repo root (`--root .`) means QFAI ships nothing to downstream
          # users that its own repo wouldn't pass.
          node packages/qfai/dist/cli/index.mjs validate \
            --profile tdd \
            --fail-on error \
            --format github \
            --root .

      - name: QFAI self-validate this repo (dogfooding — SDD gates)
        shell: bash
        run: |
          set -euo pipefail
          # The `sdd` profile runs validateSpecPacks (QFAI-STATUS-001..006,
          # QFAI-TRIAGE-001..006) and validateStatusInSpecs against the
          # repo root. This catches drift introduced by the very PR that
          # adds those validators (PR #206 review LW-G): without this
          # step, a future regression in sddTriage / specPack validators
          # would still let CI go green because `tdd` does not exercise
          # those code paths. `sdd` is on the CI allow-list because it is
          # paired here with `--profile tdd` above and the broader
          # default-profile sandbox validate below; broad coverage is
          # preserved (see packages/qfai/src/core/phasePolicy.ts).
          node packages/qfai/dist/cli/index.mjs validate \
            --profile sdd \
            --fail-on error \
            --format github \
            --root .

      - name: QFAI self-validate this repo (dogfooding — full profile)
        shell: bash
        run: |
          set -euo pipefail
          # Folded in from the repository's own copy of the shipped validate
          # workflow, which this change deletes. That copy was never a mirror of
          # this job: it ran the `full` profile while the steps above run `tdd`
          # and `sdd`, so deleting it without this step would have dropped
          # coverage rather than removed a duplicate.
          #
          # The LOCAL binary, not a resolver. The root manifest declares no
          # dependency on the package and provides no local binary, so `npx qfai`
          # from here resolves to the PUBLISHED release — CI would validate a
          # version nobody is reviewing. That is why the run was folded in rather
          # than repointed at the shipped workflow file.
          node packages/qfai/dist/cli/index.mjs validate \
            --profile full \
            --fail-on error \
            --format github \
            --root .

      - name: Run qfai validate gate (fail on error)
        shell: bash
        run: |
          set -euo pipefail
          # validate writes .qfai/report/validate.log itself; no tee redirect needed.
          node packages/qfai/dist/cli/index.mjs validate --root tmp/pack/sandbox/out --fail-on error --format github

      - name: Run qfai report (optional)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node packages/qfai/dist/cli/index.mjs report --root tmp/pack/sandbox/out --run-validate || true

      - name: Upload qfai artifacts
        # `!cancelled()` and not `always()`. The difference is a cancelled run: the
        # upload is most useful when the job FAILED, and worth nothing when nobody
        # waited for the result. `always()` spends runner minutes on both.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qfai-report
          # Seven days, not the action's default of ninety. These are diagnostic
          # artifacts for a pull request under review; nothing reads them a week later.
          retention-days: 7
          # The report step above ends in `|| true`, so its files may legitimately be
          # absent. Without this the upload fails the job for something that is not a
          # verification failure — and the job it would fail is the one carrying the
          # required status context.
          if-no-files-found: warn
          path: |
            tmp/pack/sandbox/out/.qfai/report/validate.json
            tmp/pack/sandbox/out/.qfai/report/validate.log
            tmp/pack/sandbox/out/.qfai/report/report.md
            tmp/pack/sandbox/out/.qfai/report/run-*/
            tmp/pack/sandbox/out/.qfai/report/specs-coverage/spec-*.md

  # ── 6. Aggregate gate (for branch protection) ────────────────────
  ci-pass:
    # An EMPTY map, not an omission. The verdict reads `needs` from the
    # workflow context and touches no repository content, so it needs no
    # scope — and declaring that explicitly is what makes the absence
    # auditable instead of indistinguishable from an oversight.
    permissions: {}
    if: always()
    # `detect` is in this list, and it is the one entry that is not a lane.
    # Without it a CRASHED detection would skip every job that needs it, the verdict
    # would read those as `skipped`, and `skipped` is accepting — a green run with
    # nothing verified. Failing OPEN is a decision the classifier makes and records;
    # failing HARD must reach the gate.
    needs: [detect, lint, check-types, check-types-future, test, scanner-coverage, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The verdict is DERIVED from the serialized needs map and never from a
      # hand-written list of job names. The body this replaced compared six names
      # in a shell condition, so a seventh job could be wired into `needs:` above
      # and this gate would pass while ignoring it — adding a lane cost two edits
      # and one of them was silent to omit.
      #
      # Node rather than jq: the runner image ships both, but the accepting-set
      # rule below is ALSO executed as a test over synthetic needs maps, and Node
      # is the one interpreter guaranteed to exist wherever this repository's
      # tests run. The rule is measured, not read.
      #
      # The heredoc is QUOTED (`<<'NODE'`), which is load-bearing twice over: bash
      # performs no expansion inside it, so the bytes GitHub executes are the
      # bytes the test extracts and runs, and no `$` or backtick in the program
      # can be rewritten by the shell on the way in. An unquoted heredoc would
      # make the executed text and the tested text differ silently.
      - name: Derive the verdict from the serialized needs map
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          cat > "${RUNNER_TEMP}/ci-verdict.mjs" <<'NODE'
          // The accepting set is CLOSED: a state token absent from this set fails
          // the verdict, so an unrecognized state never degrades to success.
          // `skipped` accepts because change detection produces an all-skipped run
          // on a documentation-only pull request, and "nothing needed running" is
          // not the same claim as "nothing was verified" — it is the second that
          // must never pass, and an empty needs map is how it would arrive.
          const ACCEPTING = new Set(["success", "skipped"]);

          const needs = JSON.parse(process.env.NEEDS_JSON ?? "{}");
          const entries = Object.entries(needs);

          // An empty map is REJECTED. Unreachable while `needs:` is non-empty, but
          // the direction still has to be chosen, and accepting "no evidence" is
          // exactly the degradation this job exists to prevent.
          if (entries.length === 0) {
            console.log("::error::The verdict received an empty needs map, so no job result was observed.");
            process.exit(1);
          }

          let rejected = 0;
          for (const [name, need] of entries) {
            // A need with no `result` reads as the literal below rather than as
            // `undefined`, so the log line stays legible and the accepting-set
            // test rejects it for the same reason any other unknown token is
            // rejected: it is not in the set.
            const result = need?.result ?? "(no result)";
            console.log(`${name}: ${result}`);
            if (!ACCEPTING.has(result)) {
              console.log(`::error::CI job ${name} concluded ${result}.`);
              rejected += 1;
            }
          }

          process.exit(rejected === 0 ? 0 : 1);
          NODE
          node "${RUNNER_TEMP}/ci-verdict.mjs"
