name: CI

on:
  pull_request:
  push:
    branches:
      - main

# ── Least-privilege default for every job in this workflow ──────────
# `contents: read` is the minimal scope. A job needing more declares its
# own block; a job needing none declares an empty one, which is explicit
# rather than missing. Reachability is what the requirement is written
# against: a job with no block of its own is still governed by this one.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs (parallel) ─────────────────────────────────────────────────
jobs:
  # ── 0. Change detection ──────────────────────────────────────────
  # The classifier is a program rather than a path filter so the rule can be
  # EXECUTED by a test. The heredoc is quoted, so the bytes GitHub runs are the
  # bytes the test extracts and runs.
  detect:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the diff is against the base commit, and a shallow clone is
          # one of the two failures BR-0015-0008 requires to fail open with an
          # annotation rather than silently narrow the lane set.
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change against the enumerated directory lists
        id: classify
        env:
          # Both event shapes. On a pull request the base commit; on a push the
          # previous head. Empty on neither, which matters because an empty base
          # makes the diff fail and the classifier fail open — correct, but it
          # would put a warning annotation on every push to the default branch,
          # and an annotation that is always present is one nobody reads.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # Which of the two diff forms to take. They are not interchangeable, and each is the
          # wrong answer for the other event.
          #
          # Review finding [21] measured the pull-request half: a two-dot diff compares the two
          # TREES, so a source file changed on base after this branch forked lands in the changed
          # list although the pull request never touched it — and a documentation-only pull
          # request then runs the whole matrix, which is the saving this lane exists for. Three-dot
          # asks the merge base instead, which is the set the pull request is responsible for.
          #
          # On a push there is no merge base worth asking about: `github.event.before` IS the
          # previous head, and three-dot would silently drop everything the old head carried that
          # the new one does not — the force-push case the shipped detection lane records.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # The diff is ATTEMPTED here and decided by the program. `|| true` is
          # deliberate: a shallow clone or an unreachable base ref must reach the
          # classifier as "no path list was produced", so that failing open and naming
          # the reason live in the one place a test can execute.
          # `--no-renames` is load-bearing. With rename detection ON git reports only the
          # DESTINATION of a move, so `git mv src/x.ts docs/x.md` arrives here as a single
          # documentation path and the source change skips every test lane. Turning
          # detection off makes both halves visible, and the source half classifies as
          # source. Measured: the default reports one path, `--no-renames` reports two.
          # The STATUS is captured and handed on, not just the output. Git can
          # write part of the list and then fail — a missing object, an I/O
          # error — and a partial list that happens to hold only documentation
          # paths would otherwise be classified as a complete, docs-only change.
          # A non-zero status is "no path list was produced", whatever landed on
          # stdout, and the classifier fails open on it.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            diff_range=("${BASE_SHA}...${HEAD_SHA}")
          else
            diff_range=("${BASE_SHA}" "${HEAD_SHA}")
          fi
          git diff --name-only --no-renames "${diff_range[@]}" \
            > "${RUNNER_TEMP}/changed.txt" 2> "${RUNNER_TEMP}/diff-err.txt" \
            && diff_status=0 || diff_status=$?
          printf '%s\n' "${diff_status}" > "${RUNNER_TEMP}/diff-status.txt"
          cat > "${RUNNER_TEMP}/detect.mjs" <<'NODE'
          // Change detection: classify the pull request's changed paths against two
          // ENUMERATED lists and select either the full lane set or the
          // documentation-only minimum.
          //
          // The whole decision lives here, failure included. BR-0015-0008 requires a
          // failed diff to emit an annotation naming the reason AND to select the full
          // set; if that branch lived in the shell it would be the one part of the rule
          // no test could execute. The workflow only attempts the diff.
          import { appendFileSync, readFileSync } from "node:fs";
          import process from "node:process";

          // Directories this classifier knows how to reason about (BR-0015-0009). The
          // list is CLOSED: a path outside every entry selects the full set and says so,
          // because an unclassified path is never "nothing to run".
          const RECOGNIZED_DIRS = [
            ".agents/",
            ".claude/",
            ".codex/",
            ".github/",
            ".instruction/",
            ".qfai/",
            "packages/",
            "scripts/",
            "tests/",
          ];

          // The same closed-list rule at file granularity, for the repository root.
          const RECOGNIZED_FILES = [
            "AGENTS.md",
            "CHANGELOG.md",
            "CLAUDE.md",
            "DESIGN.md",
            "LICENSE",
            "README.md",
            "RELEASE.md",
            "REVIEW.md",
            "eslint.config.js",
            "package.json",
            "pnpm-lock.yaml",
            "pnpm-workspace.yaml",
            "qfai.config.yaml",
            "tsconfig.base.json",
            "tsconfig.json",
          ];

          // Paths that may NEVER be read as documentation, checked before the
          // documentation set (BR-0015-0010). The assistant tree is named here rather
          // than merely left out, so the exclusion is enforced instead of incidental:
          // what lives there changes validate output, which is why the catalog is
          // loaded and not merely shipped.
          //
          // The agent-integration mirrors are NOT here, and that is a recorded hazard
          // rather than an oversight: BR-0015-0010 requires them in the
          // documentation-only set with an explicit MUST, while
          // `packages/qfai/tests/codex/agents.test.ts` and
          // `.../tests/integration/agentsRulesSurface.test.ts` guard those same paths
          // from inside the `test` job a documentation-only classification skips.
          // CR-20260820-0004 carries that measurement and is open on which side moves.
          // Adding a member here would decide it against the rule's own wording.
          const NEVER_DOCUMENTATION = [".qfai/assistant/"];

          // The documentation-only set (BR-0015-0010). Small, and measured rather than
          // guessed: every other candidate is read by at least one test file, so
          // classifying it as documentation would skip the lane that guards it.
          //
          // Mirror changes are documentation-only because `lint:mirror-surface`
          // runs the tests that read the root integration trees on every pull request.
          //
          // `packages/qfai/docs/` stays. Its single literal is a FIXTURE in this classifier's
          // own tests (`packages/qfai/docs/anything.md`, a path that does not exist), not a file
          // any test reads.
          const DOCUMENTATION_DIRS = [
            "packages/qfai/docs/",
            ".agents/",
            ".claude/",
            ".codex/",
            ".instruction/",
          ];
          const DOCUMENTATION_FILES = ["LICENSE", "REVIEW.md"];

          const under = (dirs, file) => dirs.some((dir) => file.startsWith(dir));
          const oneLine = (text) => text.replace(/[\r\n]+/g, " ").trim();

          function read(file) {
            if (typeof file !== "string" || file.length === 0) return null;
            try {
              return readFileSync(file, "utf-8");
            } catch {
              return null;
            }
          }

          function emit(full, reason) {
            const line = "full=" + (full ? "true" : "false") + "\n" + "reason=" + oneLine(reason) + "\n";
            const target = process.env.GITHUB_OUTPUT;
            if (typeof target === "string" && target.length > 0) appendFileSync(target, line);
            else process.stdout.write(line);
          }

          // Executable files inside a documentation directory still select full CI.
          const EXECUTABLE_SUFFIXES = [".ps1", ".sh", ".mjs", ".cjs", ".js", ".ts", ".py", ".bat", ".cmd"];
          const executable = (file) => EXECUTABLE_SUFFIXES.some((ext) => file.endsWith(ext));

          function classify(paths) {
            for (const file of paths) {
              if (!under(RECOGNIZED_DIRS, file) && !RECOGNIZED_FILES.includes(file)) {
                return { full: true, reason: "unrecognized path, outside every recognized directory: " + file };
              }
              if (under(NEVER_DOCUMENTATION, file)) {
                return { full: true, reason: "alters validate output: " + file };
              }
              const documentary =
                under(DOCUMENTATION_DIRS, file) || DOCUMENTATION_FILES.includes(file);
              // The executable test applies ONLY to a path the documentation rule would otherwise
              // admit. Checked before the documentation test it also fired for `src/**.ts`, which
              // selected the right lane set for the wrong stated reason — an operator reading
              // `reason=executable ...` for a source file is being told something false about why
              // their build ran. Same verdict, honest diagnosis.
              if (documentary && executable(file)) {
                return { full: true, reason: "executable inside a documentation directory: " + file };
              }
              if (!documentary) {
                return { full: true, reason: "source path: " + file };
              }
            }
            return { full: false, reason: "documentation-only: " + paths.length + " path(s)" };
          }

          function main() {
            const [, , pathsFile, diffErrorFile, diffStatusFile] = process.argv;
            const paths = (read(pathsFile) ?? "")
              .split("\n")
              .map((line) => line.trim())
              .filter((line) => line.length > 0);

            // A non-zero diff status is decisive on its own, BEFORE the list is
            // read. Git writes to stdout as it walks, so a run that dies partway
            // leaves a list that is syntactically fine and semantically short —
            // and a short list holding only documentation paths selects no lane.
            // An absent status file means the caller did not report one, which is
            // the pre-existing shape and is treated as success.
            const diffStatus = (read(diffStatusFile) ?? "0").trim();
            if (diffStatus !== "" && diffStatus !== "0") {
              const why = oneLine(read(diffErrorFile) ?? "") || "git exited " + diffStatus;
              process.stdout.write(
                "::warning title=change detection failed open::the changed-path list is incomplete (git exited " +
                  diffStatus +
                  "), so the full lane set is selected: " +
                  why +
                  "\n",
              );
              emit(true, "diff failed: " + why);
              return;
            }

            // An EMPTY list is a failure to compute, never "nothing changed". A pull
            // request always changes something, so an empty diff means the diff did not
            // run — a shallow clone or an unreachable base ref, the two cases
            // AC-0017-0004 names.
            if (paths.length === 0) {
              const why = oneLine(read(diffErrorFile) ?? "") || "git produced no output and no error text";
              process.stdout.write(
                "::warning title=change detection failed open::could not compute the changed-path list, so the full lane set is selected: " +
                  why +
                  "\n",
              );
              emit(true, "diff unavailable: " + why);
              return;
            }

            const verdict = classify(paths);
            emit(verdict.full, verdict.reason);
          }

          main();
          NODE
          node "${RUNNER_TEMP}/detect.mjs" "${RUNNER_TEMP}/changed.txt" "${RUNNER_TEMP}/diff-err.txt" "${RUNNER_TEMP}/diff-status.txt"

  # ── 1. Lint & format checks ──────────────────────────────────────
  # TODO(QFAI-PR206-followup): add a windows-latest matrix entry that runs
  # at minimum the agentsRulesSurface integration test, to catch the
  # symlink-vs-text-file divergence that affects .claude/rules/*.md on
  # Windows without core.symlinks=true. Deferred from #33 because the
  # accompanying test fix (#11) needs to land alongside the matrix
  # expansion to avoid an instantly-red Windows job.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff-based lint lanes need `origin/main` reachable for
          # `git diff origin/main...HEAD`. Default shallow checkout doesn't
          # fetch base ref refs, so fetch full history here.
          # SHIPPED-CI: not-applicable
          # Because: the prompt-scanner pair guard and the scanner coverage job checked
          # files only this repository had, and the shipped workflows ran neither.
          fetch-depth: 0
      # FIRST, before anything else in this job does any work.
      #
      # Review finding [82]: this job runs `./.github/actions/setup` — an action a pull request
      # can edit — before it runs any guard. A step at the top of that action appending
      # `BASH_ENV=<a script that exits 0>` to the environment file makes every later
      # `shell: bash` step source that script and exit 0 without running its body, guards
      # included. The hygiene lane reports that write, and cannot report it here: the lane is one
      # of the steps that never really runs. A check the attack disables is not a check.
      #
      # So this one runs with only `actions/checkout` ahead of it, which sets no environment
      # file, and needs nothing the setup action provides — `bash` and `grep`, both on the image.
      - name: Verify the toolchain action before running it
        run: |
          set -euo pipefail
          # The refusal's OWN bytes first, against a digest held HERE rather than in the file it
          # checks. Review finding [101]: everything this step runs comes out of the pull
          # request's checkout, so a pull request could rewrite `check-toolchain-action.sh` to
          # `exit 0` and then poison the composite action freely — the digest agreement between
          # the action list and the declaration is verified by the hygiene lane, and the lane runs
          # after the action it was supposed to protect.
          #
          # This does not make the checkout trustworthy, and nothing in a repository can: on a
          # `pull_request` event GitHub runs the workflow from the pull request's own tree. What
          # it does is make each weakening a SEPARATE, VISIBLE edit — the script, this digest, and
          # (through `verificationBodies`) this step's body — instead of one line in a shell
          # script nobody re-reads. That is the property this whole declaration is built on.
          #
          # Its INPUTS are pinned here too, and that is review findings [117] and [119]. The
          # script's own bytes were pinned while the three files it reads its expectations out of
          # were not, and all three ship in the same checkout: a pull request could add a hostile
          # manifest's path to `lifecycle-manifests.txt`, or rewrite `setup/action.yml` and record
          # the new digest in `pinned-bytes.txt`, and the pre-flight would verify the pull
          # request's own expectations and pass. The composite action then runs — and it runs
          # BEFORE the hygiene lane that would have caught the disagreement, so a `prepare` hook
          # appending `BASH_ENV` to the environment file a step may write turns every later guard
          # shell in this job into a no-op that exits 0. (Spelled the long way round on purpose:
          # this job refuses any step whose body names that file, and the refusal does not read
          # comments differently from code, which is what keeps it simple enough to trust.)
          #
          # So the root of trust for everything that runs before the hygiene lane is this step's
          # body, which `verificationBodies` pins and a reviewer reads in the diff.
          # A conflict block in one of these inputs is an unresolved merge, not an edit, and the
          # digest check below would stop this step before the script's own marker scan could say so.
          # Read the way `markersIn` reads it. That scanner splits its input on the line
          # separator, so a marker in a CRLF file is `=======` to it and `=======` plus a
          # carriage return to grep — whose `$` then sits past the return and matches
          # nothing. The digest check below would fail first, reporting a changed file
          # where the tree holds an unresolved merge. The return is optional in the
          # pattern, written as a real byte by `$'…'`.
          #
          # One process per file, and no pipe: `grep -q` exits at its first match, and a
          # producer still writing takes SIGPIPE and returns 141, which `pipefail` then
          # makes the pipeline's status — so a marker near the start of a file larger than
          # the pipe buffer read as no marker at all, which is this scan's whole subject.
          for pinned in scripts/check-toolchain-action.sh .github/pinned-bytes.txt .github/lifecycle-manifests.txt .github/command-files.txt; do
            if grep -qE $'^(<{7}|={7}|>{7}|\\|{7})( |\r?$)' "$pinned"; then
              echo "::error::$pinned carries merge conflict markers. Resolve the merge; do not reseal."
              exit 1
            fi
          done
          sha256sum -c --quiet <<'PINNED_INPUTS'
          2118bc0d10c060bbe25fd4d34785ec024ed46a57e7840252d42519f5bc3b44c9  scripts/check-toolchain-action.sh
          1f0ac1b73ca4c9b9aa12f43eef78afc439b69d96f2ffbaef3d9e56064ba5da74  .github/pinned-bytes.txt
          bb649cb2684f9db02bdbe3872f029571a8e52c4c6e2ab95e8c8fcf804370af41  .github/lifecycle-manifests.txt
          43d2586975550f5062b4af23112223068cc5676f0906c04fce2bc231df471a9e  .github/command-files.txt
          PINNED_INPUTS
          bash ./scripts/check-toolchain-action.sh
        shell: bash
      - name: Ensure base ref is fetched (for pair-changed CI lane)
        run: |
          # PR runs already have origin/main as a remote-tracking ref
          # after fetch-depth: 0, but be defensive in case the workflow
          # is invoked from a fork or a non-PR event.
          # No `--depth`: the checkout above uses `fetch-depth: 0`, and a depth-limited fetch
          # RE-SHALLOWS the repository at the fetched tip. Review finding [15]: on a pull request
          # against a branch that has diverged from main, that removes the merge base and a
          # diff-based lane fails on `origin/main...HEAD`, failing lint for a reason nothing in
          # the diff explains. The fetch itself stays — `fetch-depth: 0` does not create the
          # `origin/main` remote-tracking ref those lanes resolve.
          git fetch --no-tags origin main || true
        shell: bash
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup
      - name: Run lint gate
        run: pnpm ci:lint
      - name: Sanity grep — no internal spec IDs or version markers leak
        run: bash packages/qfai/scripts/check-no-internal-version-leakage.sh
      - name: Verify branch name version pin matches package.json#version
        run: bash packages/qfai/scripts/check-branch-version-pin.sh
        shell: bash

  # ── 1b. The mirror-surface lane, in a runner of its own ──────────
  #
  # This lane runs the mirror tests on every pull request, including changes
  # selected as documentation-only.
  #
  # It carries NO condition and appears in no `dependencyConditions` entry, which is
  # what `BR-0015-0011` requires of a lane moved into a job of its own: the surface
  # it checks — the rule mirror, the skill links, the reviewer vocabulary — is what a
  # documentation-only change is most likely to break.
  #
  # SHIPPED-CI: not-applicable
  # Because: the surface this lane checks is this repository's own rule mirror, which
  # an adopter's project does not have, so the shipped templates declare no such job.
  mirror-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`.
      - uses: ./.github/actions/setup
      - name: Run the mirror-surface lane
        run: pnpm -C packages/qfai lint:mirror-surface

  # ── 2. Type checking (current TypeScript) ────────────────────────
  check-types:
    needs: [detect]
    # Derived from the detection output, never hand-written. A leg stays
    # DECLARED and reports skipped, so its check name persists and branch
    # protection needs no repository setting change (BR-0015-0006, BR-0015-0013).
    if: ${{ needs.detect.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup
      - name: Run type check
        run: pnpm check-types

  # ── 3. Type checking (future TypeScript) ─────────────────────────
  check-types-future:
    needs: [detect]
    # Derived from the detection output, never hand-written. A leg stays
    # DECLARED and reports skipped, so its check name persists and branch
    # protection needs no repository setting change (BR-0015-0006, BR-0015-0013).
    if: ${{ needs.detect.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup
      - name: Run future TypeScript compatibility check
        run: pnpm check-types:future

  # ── 3b. The supported floor ──────────────────────────────────────
  # Every other toolchain job resolves `package.json#engines` — `>=20.19.0` with no
  # ceiling — so `setup-node` gives all of them the newest satisfying release and
  # nothing ever runs on the floor the package promises. Review finding [13]: an API
  # or syntax that exists in Node 24 and not in Node 20.19 passes every gate,
  # including the release gate, and breaks exactly the supported users the range was
  # written for.
  #
  # The floor is pinned exactly, through the shared action's `node-version` input rather
  # than a second inline preamble (`BR-0015-0027`). It runs the package test suite,
  # because a runtime floor is a claim about running code and a type check would not
  # notice a missing runtime API.
  #
  # Over the SAME slice matrix the `test` job declares, and for the same reason it is
  # sliced there: one process pool over the whole suite is the longest job in the run and
  # sets the wall clock for every other lane. The slices partition the suite — the runner
  # workspace declares exactly these seven projects and every test file lives under one of
  # them — so the legs together carry the whole floor claim. Each leg asserts the floor for
  # itself, because a leg running the wrong Node is what that assertion is for and a single
  # leg checking it would leave the other six unverified.
  #
  # Conditional on the same detection output as its neighbours, and DECLARED either
  # way, so its check names persist for branch protection.
  node-floor:
    needs: [detect]
    if: ${{ needs.detect.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # SHIPPED-CI: not-applicable
      # Because: the shipped test lanes are declared per adopter test layer and run no test
      # of this repository's, so there is no leg on that side for a slice of ours to join.
      matrix:
        slice: [core, validators, integration, e2e, cli, unit, scripts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the tested commit and its parent available to every slice.
          fetch-depth: 2
          persist-credentials: false
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup
        with:
          # The floor is DERIVED from `engines.node` by the action, not written here.
          # A literal would be a second answer to the same question, and raising
          # `engines` would leave this lane certifying a floor nobody supports.
          pin-engines-floor: "true"
          # From the PACKAGE's manifest, which is where the promise to adopters lives — this
          # lane runs the package's own suite. In this tree it agrees with the root's; the two
          # are separate manifests and need not.
          engines-manifest: "./packages/qfai/package.json"
      - name: Confirm the pinned floor is what is running
        shell: bash
        run: |
          set -euo pipefail
          # Asserted, not assumed. `setup-node` silently ignores an empty
          # `node-version`, so a wiring mistake in the shared action would leave this
          # lane running the newest release while still reporting as the floor lane —
          # a green check for a claim nothing tested.
          #
          # The expected value is READ from `engines.node`, the same place the action
          # derives it from. Writing `v20.19.0` here would be the second literal the
          # repository's one-Node-literal rule exists to prevent, and it would go stale
          # in the direction that passes.
          range="$(node -p "require('./packages/qfai/package.json').engines.node")"
          expected="v${range#>=}"
          actual="$(node --version)"
          echo "node-floor: engines floor ${expected}, running ${actual}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::node-floor expected ${expected} but is running ${actual}; pin-engines-floor did not take effect"
            exit 1
          fi
      # `dist/` is not committed, and the `e2e` and `integration` slices read it —
      # `tests/integration/cliStartupCost.test.ts` fails with "no shipped bundle was readable" and
      # `tests/e2e/spec0010DiscussionMockAndPointerE2E.test.ts` spawns `dist/cli/index.cjs`. Without
      # this those legs are structurally ALWAYS RED, and an always-red leg of a required lane
      # conveys no differential signal: a genuine Node 20 break and a missing bundle look identical,
      # so the lane gets un-required or "fixed" by dropping the pin. Same step, same condition, same
      # reason, as the `test` job's — the other five legs run pure TS through vitest's loader and
      # would pay for a build nothing in them reads.
      - name: Build qfai (the floor legs that read dist/)
        if: matrix.slice == 'e2e' || matrix.slice == 'integration'
        run: pnpm -C packages/qfai build
      # The fork count is taken from the runner, not inherited from the declaration.
      #
      # Forks that outnumber the runner's cores make this lane exit 1 with every test
      # passing: each fork reports progress to the single main process over an RPC call with
      # a sixty-second budget, and a main process too contended to answer in time turns a
      # healthy run red. The budget is not reachable — `ForksOptions` carries no timeout,
      # `createForksRpcOptions` sets none, and the default lives in the RPC library — so the
      # contention is the only lever.
      #
      # The measurement, whole suite on four cores:
      #
      #   ten forks    299 s wall   collect 343 s   tests 1972 s
      #   four forks   269 s wall   collect 113 s   tests  743 s
      #
      # The collect and test figures are summed across forks, so their collapse is the
      # oversubscription: at ten forks most of each fork's measured time goes to waiting for
      # a core. That is the declared ceiling measured against the runner's core count, not a
      # property of how many tests are in the pool, so it holds per leg: each leg gets its
      # own runner with the same four cores, and the declared ten forks oversubscribe every
      # one of them the same way.
      #
      # `QFAI_TEST_MAX_WORKERS` is the override `vitest.knobs.ts` declares for exactly this.
      # The declared starting value is untouched: this lane states its own.
      - name: Run the package test suite on the floor (${{ matrix.slice }})
        # The per-slice script, not the generic runner with a project name — the
        # reason the `test` job's step gives, and the reason surface 3 of
        # `sliceSurfaceAlignment` is load-bearing.
        # SHIPPED-CI: not-applicable
        # Because: this profiles the repository's validation corpus, which
        # the shipped adopter test placeholders do not run.
        env:
          QFAI_VALIDATION_PROFILE_ARTIFACT_DIR: ${{ matrix.slice == 'integration' && format('{0}/qfai-validation-profile/{1}/{2}', runner.temp, github.job, matrix.slice) || '' }}
        run: QFAI_TEST_MAX_WORKERS="$(nproc)" pnpm -C packages/qfai test:${{ matrix.slice }}
      - name: Upload validation profile
        if: ${{ !cancelled() && matrix.slice == 'integration' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qfai-validation-profile-${{ runner.os }}-node-floor-${{ github.job }}-${{ matrix.slice }}-attempt-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/qfai-validation-profile/${{ github.job }}/${{ matrix.slice }}/*.json

  # ── 4. Tests (matrix: test slices) ──────────────────────────────
  test:
    needs: [detect]
    # Derived from the detection output, never hand-written. A leg stays
    # DECLARED and reports skipped, so its check name persists and branch
    # protection needs no repository setting change (BR-0015-0006, BR-0015-0013).
    if: ${{ needs.detect.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # SHIPPED-CI: not-applicable
        # Because: the shipped test lanes use adopter test layers, not this repository's suites.
        slice: [core, validators, integration, e2e, cli, unit, scripts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the tested merge commit and its parents available to every slice.
          fetch-depth: 2
          persist-credentials: false
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup
      # The e2e AND integration slices contain tests that exec the built
      # CLI at `packages/qfai/dist/cli/index.{cjs,mjs}` (e.g.
      # spec0010DiscussionMockAndPointerE2E, spec0008AtddScaffold,
      # spec0014SaasPackageCertify, spec0006DoctorRemediation,
      # spec0004SaasPackageAndPackLocation). In a clean GitHub Actions
      # checkout `dist/` is not committed, so both slices need a build
      # step before the test step. Other slices run pure TS via vitest's
      # loader and do not need dist on disk. Codex r3338425862.
      - name: Build qfai (e2e + integration slices)
        if: matrix.slice == 'e2e' || matrix.slice == 'integration'
        run: pnpm -C packages/qfai build
      - name: Run tests (${{ matrix.slice }})
        # The per-slice script, not the generic runner with a project name.
        # While this read `test -- --project <slice>` a slice with no script of
        # its own still ran, so nothing ever demanded the script exist and the
        # three slice surfaces could drift silently.
        #
        # `QFAI_TEST_MAX_WORKERS` for the reason the floor lane above states at
        # length: the declared fork count oversubscribes a four-core runner, and
        # a leg gets the same four cores whichever lane declares it. This lane
        # ran without the override while the floor lane had it, so the same
        # suites were measured under two different pool sizes.
        # SHIPPED-CI: not-applicable
        # Because: the shipped test lanes are placeholders that run no test, so
        # there is no invocation on that side for a worker cap to bound.
        # SHIPPED-CI: not-applicable
        # Because: this profiles the repository's validation corpus, which
        # the shipped adopter test placeholders do not run.
        env:
          QFAI_VALIDATION_PROFILE_ARTIFACT_DIR: ${{ matrix.slice == 'integration' && format('{0}/qfai-validation-profile/{1}/{2}', runner.temp, github.job, matrix.slice) || '' }}
        run: QFAI_TEST_MAX_WORKERS="$(nproc)" pnpm -C packages/qfai test:${{ matrix.slice }}
      - name: Upload validation profile
        if: ${{ !cancelled() && matrix.slice == 'integration' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qfai-validation-profile-${{ runner.os }}-node-current-${{ github.job }}-${{ matrix.slice }}-attempt-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/qfai-validation-profile/${{ github.job }}/${{ matrix.slice }}/*.json

  # ── 4a. Windows parity ───────────────────────────────────────────
  # Init and upgrade must behave on Windows as on Linux: CRLF checkouts and paths
  # with spaces. This job runs the package's
  # `test:windows-parity` list on a Windows runner, the list a developer runs
  # locally. It builds the package itself, because the integration suites spawn
  # the built CLI and `dist/` has to be made here.
  #
  # SHIPPED-CI: not-applicable
  # Because: the shipped test lanes run the adopter's own scripts on the runner the adopter names, so the shipped set has no QFAI suite or fixed platform to add.
  windows-parity:
    needs: [detect]
    # Derived from the detection output, never hand-written. A leg stays
    # DECLARED and reports skipped, so its check name persists and branch
    # protection needs no repository setting change.
    if: ${{ needs.detect.outputs.full == 'true' }}
    permissions:
      contents: read
    runs-on: windows-latest
    # Twice the slowest of twenty measured runs (582 s), rounded up to the next
    # five minutes. The runs are recorded in DEC-1010 of .qfai/spec/decisions.md.
    # SHIPPED-CI: not-applicable
    # Because: the shipped set has no Windows job, so there is no ceiling there for this measurement to set.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The suites read their temp root through `os.tmpdir()`, so pointing TEMP
      # and TMP at a directory whose name has a space reaches every case without
      # editing one. A workflow command file cannot carry the value to a later
      # step inside the verdict's closure, so the test step sets it itself.
      - name: Create a temp root whose name has a space
        shell: pwsh
        env:
          QFAI_TEMP_ROOT: ${{ runner.temp }}\qfai tmp
        run: New-Item -ItemType Directory -Force -Path $env:QFAI_TEMP_ROOT | Out-Null
      - uses: ./.github/actions/setup
      - name: Build qfai on the Windows runner
        run: pnpm -C packages/qfai build
      # SHIPPED-CI: not-applicable
      # Because: the repository mirror points to package assets; adopters use
      # their installed assistant tree.
      - name: Prepare repository assistant mirror
        env:
          TEMP: ${{ runner.temp }}\qfai tmp
          TMP: ${{ runner.temp }}\qfai tmp
        run: node scripts/link-assistant-tree.mjs
      - name: Run the Windows parity suites
        # SHIPPED-CI: not-applicable
        # Because: this profiles the repository's validation corpus, which
        # the shipped adopter test placeholders do not run.
        env:
          TEMP: ${{ runner.temp }}\qfai tmp
          TMP: ${{ runner.temp }}\qfai tmp
          QFAI_VALIDATION_PROFILE_ARTIFACT_DIR: ${{ runner.temp }}/qfai-validation-profile/${{ github.job }}/parity
        run: pnpm -C packages/qfai test:windows-parity
      - name: Upload validation profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qfai-validation-profile-${{ runner.os }}-node-current-${{ github.job }}-parity-attempt-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/qfai-validation-profile/${{ github.job }}/parity/*.json

  # ── 5. Build, pack verification & qfai validate ─────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The TDD drift check needs full history to reach the merge base on origin/main.
          # SHIPPED-CI: not-applicable
          # Because: the shipped `qfai-validate.yml` already fetches the full
          # history on a pull request, so the lane an adopter runs `validate`
          # in can reach the merge base today.
          fetch-depth: 0
      # The four-step toolchain preamble, defined once in
      # `.github/actions/setup/action.yml`. It stood inline here six times.
      - uses: ./.github/actions/setup

      - name: Run build & pack verification
        run: pnpm ci:build-verify

      - name: Sanity grep — no internal spec IDs or version markers leak (post-build)
        run: bash packages/qfai/scripts/check-no-internal-version-leakage.sh

      # SHIPPED-CI: not-applicable
      # Because: the steps removed here wrote lint findings for a reviewer-report check that
      # only this repository's validate ran; the shipped workflows never carried them.
      - name: QFAI self-validate this repo (dogfooding — TDD gates)
        shell: bash
        run: |
          set -euo pipefail
          # `tdd` checks story test obligations, drift, test stubs, and
          # contracts against the repository root.
          #
          # A clean gate: this profile reports no `error` on the repository's
          # own story tree, so any error fails the build.
          # SHIPPED-CI: not-applicable
          # Because: this lane validates this repository's own story tree, and
          # the shipped validate workflow already fails on any error.
          node packages/qfai/dist/cli/index.mjs validate --profile tdd --fail-on error --format github --root .

      - name: QFAI self-validate this repo (dogfooding — SDD gates)
        shell: bash
        run: |
          set -euo pipefail
          # `sdd` checks story tree structure, contract references, policy placeholders,
          # and review artifacts against the repository root. It is paired
          # with `tdd` and the full sandbox validate below.
          #
          # A clean gate: this profile reports no `error` on the repository's
          # own story tree, so any error fails the build.
          # SHIPPED-CI: not-applicable
          # Because: this lane validates this repository's own story tree, and
          # the shipped validate workflow already fails on any error.
          node packages/qfai/dist/cli/index.mjs validate --profile sdd --fail-on error --format github --root .

      - name: QFAI self-validate this repo (dogfooding — full profile)
        shell: bash
        run: |
          set -euo pipefail
          # Folded in from the repository's own copy of the shipped validate
          # workflow, which this change deletes. That copy was never a mirror of
          # this job: it ran the `full` profile while the steps above run `tdd`
          # and `sdd`, so deleting it without this step would have dropped
          # coverage rather than removed a duplicate.
          #
          # The LOCAL binary, not a resolver. This job installs before it
          # builds, so the root's workspace link to the package has no
          # `node_modules/.bin/qfai`, and `npx qfai` from here resolves to the
          # PUBLISHED release — CI would validate a version nobody is reviewing.
          # That is why the run was folded in rather than repointed at the
          # shipped workflow file.
          # A clean gate: this profile reports no `error` on the repository's
          # own story tree, so any error fails the build.
          # SHIPPED-CI: not-applicable
          # Because: this lane validates this repository's own story tree, and
          # the shipped validate workflow already fails on any error.
          node packages/qfai/dist/cli/index.mjs validate --profile full --fail-on error --format github --root .

      - name: Run qfai validate gate (fail on error)
        shell: bash
        run: |
          set -euo pipefail
          # validate writes .qfai/report/validate.log itself; no tee redirect needed.
          node packages/qfai/dist/cli/index.mjs validate --root tmp/pack/sandbox/out --fail-on error --format github

      - name: Run qfai report (optional)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node packages/qfai/dist/cli/index.mjs report --root tmp/pack/sandbox/out --run-validate || true

      - name: Upload qfai artifacts
        # `!cancelled()` and not `always()`. The difference is a cancelled run: the
        # upload is most useful when the job FAILED, and worth nothing when nobody
        # waited for the result. `always()` spends runner minutes on both.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qfai-report
          # Seven days, not the action's default of ninety. These are diagnostic
          # artifacts for a pull request under review; nothing reads them a week later.
          retention-days: 7
          # The report step above ends in `|| true`, so its files may legitimately be
          # absent. Without this the upload fails the job for something that is not a
          # verification failure — and the job it would fail is the one carrying the
          # required status context.
          if-no-files-found: warn
          path: |
            tmp/pack/sandbox/out/.qfai/report/validate.json
            tmp/pack/sandbox/out/.qfai/report/validate.log
            tmp/pack/sandbox/out/.qfai/report/report.md
            tmp/pack/sandbox/out/.qfai/report/run-*/
            tmp/pack/sandbox/out/.qfai/report/specs-coverage/spec-*.md

  # SHIPPED-CI: not-applicable
  # Because: this temporary experiment measures this repository's full native test corpus.
  temporary-worker-benchmark:
    needs: [detect]
    if: ${{ needs.detect.outputs.full == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Restore the temporary benchmark controller
        id: benchmark-restore
        shell: bash
        env:
          BENCHMARK_ROOT: ${{ runner.temp }}/qfai-worker-benchmark
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const root = process.env.BENCHMARK_ROOT;
          if (fs.existsSync(root)) throw new Error('Temporary benchmark root already exists');
          fs.mkdirSync(root);
          const payload = [{"name":"controller.mjs","bytes":29577,"sha256":"56daa47573c7a89c3feccf5719c51f03309708aa0d4164aa198adfbc10d3e13f","base64":""},{"name":"collect.mjs","bytes":4933,"sha256":"c1a06671b8c0741a1243ee3405912c40ddec70b87faaf4ca2c6d83498ddfaecd","base64":""},{"name":"identity-reporter.mjs","bytes":2164,"sha256":"ecb474f8326f8aed3482fe5547caf84cdeec2a00cd1594a8e6e4c88a0401ccf2","base64":""}];
          if (payload.length !== 3) throw new Error('Unexpected controller inventory');
          const expected = ['controller.mjs', 'collect.mjs', 'identity-reporter.mjs'];
          for (let index = 0; index < payload.length; index++) {
            const entry = payload[index];
            if (entry.name !== expected[index]) throw new Error('Unexpected controller path');
            const bytes = Buffer.from(entry.base64, 'base64');
            if (bytes.length !== entry.bytes || bytes.toString('base64') !== entry.base64 ||
                createHash('sha256').update(bytes).digest('hex') !== entry.sha256) throw new Error('Controller bytes differ');
            fs.writeFileSync(path.join(root, entry.name), bytes, { flag: 'wx' });
          }
          fs.writeFileSync(path.join(root, 'transport-inputs.json'), JSON.stringify(
            payload.map(({ name, bytes, sha256 }) => ({ name, bytes, sha256 })), null, 2) + '\n', { flag: 'wx' });
          NODE
      - name: Build the fixed checkout once
        id: benchmark-build
        shell: bash
        env:
          BENCHMARK_ROOT: ${{ runner.temp }}/qfai-worker-benchmark
        run: |
          set -uo pipefail
          set +e
          {
            pnpm -C packages/qfai build
            actual_exit=$?
          } > "${BENCHMARK_ROOT}/build-stdout.log" 2> "${BENCHMARK_ROOT}/build-stderr.log"
          printf '%s\n' "$actual_exit" > "${BENCHMARK_ROOT}/build-exit.txt"
          exit "$actual_exit"
      - name: Run nine complete native worker trials without retries
        id: benchmark-trials
        shell: bash
        env:
          BENCHMARK_ROOT: ${{ runner.temp }}/qfai-worker-benchmark
          BENCHMARK_OUTPUT: ${{ runner.temp }}/qfai-worker-benchmark/evidence
          BENCHMARK_COLLECTOR: ${{ runner.temp }}/qfai-worker-benchmark/collect.mjs
          BENCHMARK_IDENTITY_REPORTER: ${{ runner.temp }}/qfai-worker-benchmark/identity-reporter.mjs
          CI_EVENT_SHA: ${{ github.sha }}
          CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          if node "${BENCHMARK_ROOT}/controller.mjs" > "${BENCHMARK_ROOT}/controller-stdout.log" 2> "${BENCHMARK_ROOT}/controller-stderr.log"; then
            actual_exit=0
          else
            actual_exit=$?
          fi
          printf '%s\n' "$actual_exit" > "${BENCHMARK_ROOT}/controller-exit.txt"
          exit "$actual_exit"
      - name: Check required raw benchmark upload inputs
        id: benchmark-upload-preflight
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BENCHMARK_ROOT: ${{ runner.temp }}/qfai-worker-benchmark
          RESTORE_OUTCOME: ${{ steps.benchmark-restore.outcome }}
          BUILD_OUTCOME: ${{ steps.benchmark-build.outcome }}
          TRIAL_OUTCOME: ${{ steps.benchmark-trials.outcome }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const root = process.env.BENCHMARK_ROOT;
          const metadata = { restoreOutcome: process.env.RESTORE_OUTCOME, buildOutcome: process.env.BUILD_OUTCOME,
            trialOutcome: process.env.TRIAL_OUTCOME, actualEventSha: process.env.CI_EVENT_SHA,
            requestedSourceHead: process.env.CI_SOURCE_HEAD, eventName: process.env.CI_EVENT_NAME,
            runUrl: process.env.CI_RUN_URL, capturedAt: new Date().toISOString(),
            scope: 'Temporary measurements only; failed or incomplete trials cannot support adoption.' };
          const info = fs.lstatSync(root);
          if (!info.isDirectory() || info.isSymbolicLink()) throw new Error('Required benchmark evidence root unavailable');
          const manifest = [];
          let total = 0;
          function visit(directory) {
            for (const name of fs.readdirSync(directory).sort()) {
              const file = path.join(directory, name);
              const stat = fs.lstatSync(file);
              if (stat.isSymbolicLink()) throw new Error('Unsafe required evidence link');
              if (stat.isDirectory()) { visit(file); continue; }
              if (!stat.isFile() || stat.nlink !== 1 || stat.size > 128 * 1024 ** 2) throw new Error('Unsafe or oversized required evidence');
              total += stat.size;
              if (total > 2 * 1024 ** 3 || manifest.length >= 5000) throw new Error('Required evidence ceiling exceeded');
              const bytes = fs.readFileSync(file);
              if (bytes.length !== stat.size) throw new Error('Required evidence changed');
              manifest.push({ path: path.relative(root, file), bytes: bytes.length,
                sha256: createHash('sha256').update(bytes).digest('hex') });
            }
          }
          visit(root);
          if (!manifest.length) throw new Error('Required benchmark raw input inventory is empty');
          if (metadata.trialOutcome === 'success') {
            const summary = JSON.parse(fs.readFileSync(path.join(root, 'evidence', 'summary.json'), 'utf8'));
            if (summary.state !== 'COMPLETE' || summary.trials.length !== 9 ||
                summary.trials.some(trial => trial.state !== 'COMPLETE') ||
                fs.readFileSync(path.join(root, 'controller-exit.txt'), 'utf8').trim() !== '0') {
              throw new Error('Successful trial step has no complete native receipt');
            }
          }
          fs.writeFileSync(path.join(root, 'retention-inputs.json'), JSON.stringify({ metadata, totalBytes: total,
            files: manifest }, null, 2) + '\n', { flag: 'wx' });
          console.log('Checked ' + manifest.length + ' raw benchmark inputs, ' + total + ' bytes.');
          NODE
      - name: Retain complete or failed benchmark evidence
        id: benchmark-upload
        if: ${{ !cancelled() && steps.benchmark-upload-preflight.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: temporary-worker-benchmark-evidence
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: ${{ runner.temp }}/qfai-worker-benchmark/
      - name: Require the retained benchmark artifact identity
        if: ${{ !cancelled() }}
        shell: bash
        env:
          RETAINED_ARTIFACT_ID: ${{ steps.benchmark-upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          if (!/^[1-9]\d*$/.test(process.env.RETAINED_ARTIFACT_ID ?? '')) {
            throw new Error('Required raw benchmark artifact was not retained; measurement remains incomplete.');
          }
          console.log('Retained benchmark artifact ' + process.env.RETAINED_ARTIFACT_ID);
          NODE
      # Remove only this temporary job after its native proof is checked.

  # ── 6. Aggregate gate (for branch protection) ────────────────────
  ci-pass:
    # An EMPTY map, not an omission. The verdict reads `needs` from the
    # workflow context and touches no repository content, so it needs no
    # scope — and declaring that explicitly is what makes the absence
    # auditable instead of indistinguishable from an oversight.
    permissions: {}
    if: always()
    # `detect` is in this list, and it is the one entry that is not a lane.
    # Without it a CRASHED detection would skip every job that needs it, the verdict
    # would read those as `skipped`, and `skipped` is accepting — a green run with
    # nothing verified. Failing OPEN is a decision the classifier makes and records;
    # failing HARD must reach the gate.
    needs:
      [
        detect,
        lint,
        mirror-surface,
        check-types,
        check-types-future,
        node-floor,
        test,
        windows-parity,
        build,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The verdict is DERIVED from the serialized needs map and never from a
      # hand-written list of job names. The body this replaced compared six names
      # in a shell condition, so a seventh job could be wired into `needs:` above
      # and this gate would pass while ignoring it — adding a lane cost two edits
      # and one of them was silent to omit.
      #
      # Node rather than jq: the runner image ships both, but the accepting-set
      # rule below is ALSO executed as a test over synthetic needs maps, and Node
      # is the one interpreter guaranteed to exist wherever this repository's
      # tests run. The rule is measured, not read.
      #
      # The heredoc is QUOTED (`<<'NODE'`), which is load-bearing twice over: bash
      # performs no expansion inside it, so the bytes GitHub executes are the
      # bytes the test extracts and runs, and no `$` or backtick in the program
      # can be rewritten by the shell on the way in. An unquoted heredoc would
      # make the executed text and the tested text differ silently.
      - name: Derive the verdict from the serialized needs map
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          cat > "${RUNNER_TEMP}/ci-verdict.mjs" <<'NODE'
          // The accepting set is CLOSED: a state token absent from this set fails
          // the verdict, so an unrecognized state never degrades to success.
          // `skipped` accepts because change detection produces an all-skipped run
          // on a documentation-only pull request, and "nothing needed running" is
          // not the same claim as "nothing was verified" — it is the second that
          // must never pass, and an empty needs map is how it would arrive.
          const ACCEPTING = new Set(["success", "skipped"]);

          const needs = JSON.parse(process.env.NEEDS_JSON ?? "{}");
          const entries = Object.entries(needs);

          // An empty map is REJECTED. Unreachable while `needs:` is non-empty, but
          // the direction still has to be chosen, and accepting "no evidence" is
          // exactly the degradation this job exists to prevent.
          if (entries.length === 0) {
            console.log("::error::The verdict received an empty needs map, so no job result was observed.");
            process.exit(1);
          }

          let rejected = 0;
          for (const [name, need] of entries) {
            // A need with no `result` reads as the literal below rather than as
            // `undefined`, so the log line stays legible and the accepting-set
            // test rejects it for the same reason any other unknown token is
            // rejected: it is not in the set.
            const result = need?.result ?? "(no result)";
            console.log(`${name}: ${result}`);
            if (!ACCEPTING.has(result)) {
              console.log(`::error::CI job ${name} concluded ${result}.`);
              rejected += 1;
            }
          }

          process.exit(rejected === 0 ? 0 : 1);
          NODE
          node "${RUNNER_TEMP}/ci-verdict.mjs"
