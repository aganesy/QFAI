            const state = command(label + '-state', git, ['status', '--porcelain=v1', '--untracked-files=all']);
            const indexName = command(label + '-index', git, ['rev-parse', '--git-path', 'index']).trim();
            const indexPath = path.resolve(repositoryRoot, indexName);
            if (!fs.existsSync(indexPath)) fail('Source index identity is unavailable.');
            return { head, branch, state, indexPath, indexSHA: digest(fs.readFileSync(indexPath)),
              workflowSHA: digest(fs.readFileSync(path.join(repositoryRoot, '.github/workflows/ci.yml'))), guideSHA };
          }
          function prepare() {
            git = executable('git');
            tar = process.platform === 'win32' ? path.join(process.env.SystemRoot, 'System32', 'tar.exe') : executable('tar');
            if (!fs.existsSync(tar) || !fs.statSync(tar).isFile()) fail('Required native tar executable is missing.');
            observed.tar = { executable: tar, versionOutput: command('tar-version', tar, ['--version']) };
            let gitRoot = path.dirname(git);
            if (!['bin', 'cmd'].includes(path.basename(gitRoot).toLowerCase())) fail('The observed Git installation layout is unsupported.');
            gitRoot = path.dirname(gitRoot);
            if (/^mingw(?:32|64)$/u.test(path.basename(gitRoot).toLowerCase())) gitRoot = path.dirname(gitRoot);
            listingTar = path.join(gitRoot, 'usr', 'bin', 'tar.exe');
            if (!fs.existsSync(listingTar) || !fs.lstatSync(listingTar).isFile()) fail('The native Git-distribution listing tar is missing or non-regular.');
            const listingVersion = command('tar-list-version', listingTar, ['--version']);
            if (!/^tar \(GNU tar\) /u.test(listingVersion)) fail('The native listing executable is not GNU tar.');
            observed.listingTar = { executable: listingTar, versionOutput: listingVersion,
              environmentOverrides: { LC_ALL: 'C.UTF-8', LANG: 'C.UTF-8' } };
            const guide = fs.readFileSync(path.join(repositoryRoot, ...guideRelative.split('/')));
            if (digest(guide) !== guideSHA) fail('Published guide bytes differ from the reviewed source.');
            const text = guide.toString('utf8');
            const section = text.split('## Native preflight\n')[1]?.split('\n## ')[0];
            const blocks = [...(section ?? '').matchAll(/```js\n([\s\S]*?)\n```/gu)];
            if (blocks.length !== 1) fail('The published preflight must have exactly one JavaScript block.');
            const saved = Buffer.from(blocks[0][1] + '\n');
            if (digest(saved) !== recipeSHA) fail('Extracted recipe bytes differ from the reviewed block.');
            recipe = path.join(scratch, 'published-preflight.mjs');
            fs.writeFileSync(recipe, saved, { flag: 'wx' });
            fs.writeFileSync(path.join(receiptRoot, 'published-preflight.mjs'), saved, { flag: 'wx' });
            observed.guideSHA = guideSHA;
            observed.savedRecipeSHA = recipeSHA;
          }
          function preflight(label, root, selected, expectedExit = 0) {
            const argv = [recipe, root, ...selected.flatMap((item) => [item.name, String(item.bytes), item.sha256])];
            const stdout = command(label, process.execPath, argv, expectedExit);
            if (expectedExit === 0 && stdout !== 'Verified ' + selected.length + ' selected files.\n') {
              fail(label + ' did not report the complete selected inventory.');
            }
          }
          function archiveIdentity(file, expected) {
            if (!/^[a-f0-9]{64}$/u.test(expected ?? '')) fail('Required trusted archive digest is unknown.');
            const actual = digest(fs.readFileSync(file));
            if (actual !== expected) fail('Downloaded archive digest differs before extraction.');
            return actual;
          }
          function members(label, archive, selected) {
            const listing = command(label, listingTar, ['--force-local', '--quoting-style=literal', '-tf', archive],
              0, repositoryRoot, observed.listingTar.environmentOverrides);
            const actual = listing.split(/\r?\n/u).filter((line) => line.length).map((name) => name.startsWith('./') ? name.slice(2) : name);
            const expected = selected.map((item) => item.name).sort();
            if (JSON.stringify(actual.sort()) !== JSON.stringify(expected)) fail('Native archive member inventory differs.');
            return actual;
          }
          function extractedInventory(root, selected) {
            const actual = [];
            const allowedDirectories = new Set();
            for (const item of selected) {
              const parts = item.name.split('/');
              for (let i = 1; i < parts.length; i++) allowedDirectories.add(parts.slice(0, i).join('/'));
            }
            function visit(directory, prefix) {
              for (const name of fs.readdirSync(directory)) {
                const relative = prefix ? prefix + '/' + name : name;
                const file = path.join(directory, name);
                const stat = fs.lstatSync(file);
                if (stat.isDirectory() && !stat.isSymbolicLink()) {
                  if (!allowedDirectories.has(relative)) fail('Unexpected extracted directory: ' + relative);
                  visit(file, relative);
                } else {
                  actual.push(relative);
                }
              }
            }
            visit(root, '');
            if (JSON.stringify(actual.sort()) !== JSON.stringify(selected.map((item) => item.name).sort())) {
              fail('Extracted layout has missing or unexpected entries.');
            }
            return selected.map((item) => {
              const bytes = fs.readFileSync(path.join(root, ...item.name.split('/')));
              const result = { name: item.name, bytes: bytes.length, sha256: digest(bytes) };
              if (result.bytes !== item.bytes || result.sha256 !== item.sha256) fail('Extracted raw bytes differ.');
              return result;
            });
          }
          function output(name, value) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, name + '=' + value + '\n');
          }
          let finished = false;
          function finish(error = null) {
            if (error) {
              process.exitCode = 1;
              console.error(error?.stack ?? String(error));
            }
            if (finished) return;
            finished = true;
            observed.endedUTC = new Date().toISOString();
            observed.actualControllerExit = error ? 1 : 0;
            observed.blocker = error?.message ?? null;
            observed.nativeCommandCount = commands.length;
            try {
              json(path.join(receiptRoot, 'job-receipt.json'), observed);
              if (error) {
                fs.writeFileSync(path.join(receiptRoot, 'failure.txt'), (error?.stack ?? String(error)) + '\n', { flag: 'wx' });
              }
            } catch (receiptError) {
              process.exitCode = 1;
              observed.actualControllerExit = 1;
              console.error('Evidence receipt write failed; terminal receipt is incomplete: ' + (receiptError?.stack ?? String(receiptError)));
            }
          }
          try {
            prepare();
            const receiverSource = sourceObservation('receiver');
            observed.checkoutHead = receiverSource.head;
            observed.source = receiverSource;
            observed.directions = [];
            const sentinel = path.join(scratch, 'unrelated-receiver.txt');
            fs.writeFileSync(sentinel, 'Unrelated receiving contents.\n', { flag: 'wx' });
            const sentinelSHA = digest(fs.readFileSync(sentinel));
            for (const producer of ['linux', 'windows']) {
              const encoded = process.env[producer.toUpperCase() + '_TRUSTED'];
              if (!encoded) fail('Trusted producer identity is missing: ' + producer);
              const trusted = JSON.parse(Buffer.from(encoded, 'base64').toString('utf8'));
              const artifactID = process.env[producer.toUpperCase() + '_ARTIFACT_ID'];
              const artifactURL = process.env[producer.toUpperCase() + '_ARTIFACT_URL'];
              const artifactDigest = process.env[producer.toUpperCase() + '_ARTIFACT_DIGEST'];
              if (!artifactURL || !/^[a-f0-9]{64}$/u.test(artifactDigest ?? '') || !/^\d+$/u.test(artifactID ?? '') || !/^[a-f0-9]{64}$/u.test(trusted.archiveSHA ?? '') ||
                trusted.repository !== observed.repository || trusted.run !== observed.run || trusted.attempt !== observed.attempt ||
                trusted.source?.head !== receiverSource.head || trusted.eventHead !== observed.eventHead ||
                trusted.requestedHead !== observed.requestedHead || trusted.guideSHA !== guideSHA || trusted.recipeSHA !== recipeSHA ||
                trusted.source.workflowSHA !== receiverSource.workflowSHA || !Array.isArray(trusted.selected) || !trusted.selected.length ||
                digest(Buffer.from(JSON.stringify(trusted.selected))) !== trusted.manifestSHA) {
                fail('Required trusted source/archive/selection identity is unknown or mismatched: ' + producer);
              }
              const downloaded = path.join(process.env.RUNNER_TEMP, 'evidence-download-' + producer);
              const archive = path.join(downloaded, 'bundle.tar');
              const indexSHA = process.env[producer.toUpperCase() + '_INDEX_SHA'];
              const indexBytes = process.env[producer.toUpperCase() + '_INDEX_BYTES'];
              if (!/^[a-f0-9]{64}$/u.test(indexSHA ?? '') || !/^\d+$/u.test(indexBytes ?? '') ||
                !Number.isSafeInteger(Number(indexBytes)) || !Number.isSafeInteger(trusted.archiveBytes)) {
                fail('Trusted downloaded archive/index byte identity is unavailable.');
              }
              preflight(producer + '-downloaded-preflight', downloaded, [
                { name: 'bundle.tar', bytes: trusted.archiveBytes, sha256: trusted.archiveSHA },
                { name: 'index.json', bytes: Number(indexBytes), sha256: indexSHA },
              ]);
              const actualArchiveSHA = archiveIdentity(archive, trusted.archiveSHA);
              const index = JSON.parse(fs.readFileSync(path.join(downloaded, 'index.json'), 'utf8'));
              if (JSON.stringify(index.trusted) !== JSON.stringify(trusted)) fail('Downloaded index disagrees with out-of-band source/inventory.');
              const listed = members(producer + '-tar-list', archive, trusted.selected);
              const root = path.join(scratch, producer + '-received');
              fs.mkdirSync(root);
              command(producer + '-tar-extract', tar, ['-xf', archive, '-C', root]);
              preflight(producer + '-received-preflight', root, trusted.selected);
              const files = extractedInventory(root, trusted.selected);
              const results = JSON.parse(fs.readFileSync(path.join(root, 'execution-results.json'), 'utf8'));
              if (JSON.stringify(results) !== JSON.stringify(index.results) ||
                results[0]?.result !== 'PASS' || results[0]?.actual?.exit !== 0 ||
                results[1]?.result !== 'FAIL' || results[1]?.actual?.exit !== 1 ||
                results[2]?.result !== 'UNRUN' || results[2]?.actual !== null ||
                results[3]?.result !== 'pending' || results[3]?.actual !== null ||
                results[4]?.result !== 'FAIL' || results[4]?.actual?.exit !== 1 || !results[4]?.excluded) {
                fail('Delivered original execution states changed or became verification claims.');
              }
              const direction = { producer: trusted.producerOS, receiver: observed.runnerOS, artifactID,
                uploadArtifactURL: process.env[producer.toUpperCase() + '_ARTIFACT_URL'],
                uploadEnvelopeDigest: process.env[producer.toUpperCase() + '_ARTIFACT_DIGEST'],
                retrievedUTC: new Date().toISOString(), destination: root, trusted, actualArchiveSHA, listed,
                observedFiles: files, actualResult: 'PASS', scope: observed.scope, originalsRetained: true };
              json(path.join(receiptRoot, producer + '-direction.json'), direction);
              observed.directions.push(direction);
              const tampered = path.join(scratch, producer + '-tampered.tar');
              fs.copyFileSync(archive, tampered, fs.constants.COPYFILE_EXCL);
              fs.appendFileSync(tampered, Buffer.from([0]));
              const tamperedSHA = digest(fs.readFileSync(tampered));
              let refused = null;
              try { archiveIdentity(tampered, trusted.archiveSHA); } catch (error) { refused = error.message; }
              if (refused !== 'Downloaded archive digest differs before extraction.') fail('Tampered archive was not refused by the receiving digest check.');
              let unknownRefused = null;
              try { archiveIdentity(archive, undefined); } catch (error) { unknownRefused = error.message; }
              if (unknownRefused !== 'Required trusted archive digest is unknown.') fail('Unknown archive identity was not refused.');
              json(path.join(receiptRoot, producer + '-digest-refusal.json'), {
                actualResult: 'REFUSED', reason: refused, unknownIdentityRefusal: unknownRefused, tamperedSHA,
                expectedSHA: trusted.archiveSHA, extractionInvoked: false, originalArchiveSHA: digest(fs.readFileSync(archive)),
              });
              const alteredRoot = path.join(scratch, producer + '-altered');
              fs.mkdirSync(alteredRoot);
              command(producer + '-negative-extract', tar, ['-xf', archive, '-C', alteredRoot]);
              fs.appendFileSync(path.join(alteredRoot, ...trusted.selected[0].name.split('/')), Buffer.from([0]));
              preflight(producer + '-altered-refusal', alteredRoot, trusted.selected, 1);
              if (digest(fs.readFileSync(archive)) !== trusted.archiveSHA) fail('Retained downloaded original changed.');
              preflight(producer + '-original-recheck', root, trusted.selected);
            }
            if (observed.directions.length !== 2) fail('Both producer artifacts must be independently received.');
            if (digest(fs.readFileSync(sentinel)) !== sentinelSHA) fail('Unrelated receiving sentinel changed.');
            const finalSource = sourceObservation('receiver-final');
            if (JSON.stringify(finalSource) !== JSON.stringify(receiverSource)) fail('Receiver source/index changed.');
            finish();
          } catch (error) {
            finish(error);
          }
          NODE
      - name: Retain native receiver receipts
        id: retained
        if: ${{ !cancelled() && steps.proof.outputs.owned == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: temp-evidence-receiver-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/temp-evidence-receipts
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  # ── 6. Aggregate gate (for branch protection) ────────────────────
  ci-pass:
    # An EMPTY map, not an omission. The verdict reads `needs` from the
    # workflow context and touches no repository content, so it needs no
    # scope — and declaring that explicitly is what makes the absence
    # auditable instead of indistinguishable from an oversight.
    permissions: {}
    if: always()
    # `detect` is in this list, and it is the one entry that is not a lane.
    # Without it a CRASHED detection would skip every job that needs it, the verdict
    # would read those as `skipped`, and `skipped` is accepting — a green run with
    # nothing verified. Failing OPEN is a decision the classifier makes and records;
    # failing HARD must reach the gate.
    needs:
      [
        detect,
        lint,
        mirror-surface,
        check-types,
        check-types-future,
        node-floor,
        test,
        windows-parity,
        build,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The verdict is DERIVED from the serialized needs map and never from a
      # hand-written list of job names. The body this replaced compared six names
      # in a shell condition, so a seventh job could be wired into `needs:` above
      # and this gate would pass while ignoring it — adding a lane cost two edits
      # and one of them was silent to omit.
      #
      # Node rather than jq: the runner image ships both, but the accepting-set
      # rule below is ALSO executed as a test over synthetic needs maps, and Node
      # is the one interpreter guaranteed to exist wherever this repository's
      # tests run. The rule is measured, not read.
      #
      # The heredoc is QUOTED (`<<'NODE'`), which is load-bearing twice over: bash
      # performs no expansion inside it, so the bytes GitHub executes are the
      # bytes the test extracts and runs, and no `$` or backtick in the program
      # can be rewritten by the shell on the way in. An unquoted heredoc would
      # make the executed text and the tested text differ silently.
      - name: Derive the verdict from the serialized needs map
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          cat > "${RUNNER_TEMP}/ci-verdict.mjs" <<'NODE'
          // The accepting set is CLOSED: a state token absent from this set fails
          // the verdict, so an unrecognized state never degrades to success.
          // `skipped` accepts because change detection produces an all-skipped run
          // on a documentation-only pull request, and "nothing needed running" is
          // not the same claim as "nothing was verified" — it is the second that
          // must never pass, and an empty needs map is how it would arrive.
          const ACCEPTING = new Set(["success", "skipped"]);

          const needs = JSON.parse(process.env.NEEDS_JSON ?? "{}");
          const entries = Object.entries(needs);

          // An empty map is REJECTED. Unreachable while `needs:` is non-empty, but
          // the direction still has to be chosen, and accepting "no evidence" is
          // exactly the degradation this job exists to prevent.
          if (entries.length === 0) {
            console.log("::error::The verdict received an empty needs map, so no job result was observed.");
            process.exit(1);
          }

          let rejected = 0;
          for (const [name, need] of entries) {
            // A need with no `result` reads as the literal below rather than as
            // `undefined`, so the log line stays legible and the accepting-set
            // test rejects it for the same reason any other unknown token is
            // rejected: it is not in the set.
            const result = need?.result ?? "(no result)";
            console.log(`${name}: ${result}`);
            if (!ACCEPTING.has(result)) {
              console.log(`::error::CI job ${name} concluded ${result}.`);
              rejected += 1;
            }
          }

          process.exit(rejected === 0 ? 0 : 1);
          NODE
          node "${RUNNER_TEMP}/ci-verdict.mjs"
