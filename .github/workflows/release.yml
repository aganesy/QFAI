name: Release

# Two triggers, one pipeline.
#
#   push tag vX.Y.Z   -> verify + gate + GitHub Release + npm publish
#   workflow_dispatch -> verify + gate + npm publish, for a tag that already exists
#
# `RELEASE.md` treats tag creation and `npm publish（必要な場合）` as separate
# steps, and the repo rules require an explicit instruction for each. That
# separation is now enforced by the `release` **environment** rather than by
# withholding the trigger: the publish job cannot start until a required
# reviewer approves the deployment, so pushing a tag proposes a publish instead
# of performing one.
#
# That only holds if the environment is configured. An environment with no
# protection rules gates nothing and a tag push would publish unattended, so
# the job refuses to run against an unprotected one — see "Require an approved
# environment" below.
#
# `workflow_dispatch` stays for re-publishing a tag that already exists (a
# failed upload, an approval that lapsed) without cutting a new tag.
#
# Publishing authenticates by **trusted publishing** (OIDC): the job exchanges a
# short-lived GitHub identity token for a registry credential. There is no
# `NPM_TOKEN` to store, leak, or rotate. npm binds that exchange to this
# repository AND to this workflow's filename, so `release.yml` cannot be renamed
# without re-registering the trusted publisher on npmjs.com.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm (e.g. v1.10.0)"
        required: true
        type: string

env:
  # Trusted publishing needs npm >= 11.5.1. Pinning Node to that requirement is
  # documented minimum (22.14.0) is not enough: `npm@latest` carries its own
  # engine range — npm 12 wants `^22.22.2 || ^24.15.0 || >=26.0.0` — so the
  # install fails with EBADENGINE before the version check ever runs. Track the
  # current LTS major instead, and let setup-node resolve its newest patch.
  #
  # Only the publish job runs on it, and it is the ONE workflow-level Node literal this repository
  # allows (BR-0017-0027). It survives because it encodes npm's engine range for trusted publishing,
  # which no file in the repository expresses. Every other job, the release gate included, takes its
  # Node from `./.github/actions/setup`.
  NODE_PUBLISH: "24"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. The tag is a claim; check that the tree agrees ─────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pin.outputs.version }}
      tag: ${{ steps.pin.outputs.tag }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Not the input: the repository default, so nothing the dispatcher
          # controls decides what code is checked out before it is validated.
          # The tag is resolved through `refs/tags/` below and everything
          # afterwards runs against the SHA that resolution produced.
          fetch-depth: 0
      - name: Resolve and check the version the tag claims
        id: pin
        env:
          # Through the environment, never through `${{ }}` inside `run`. A
          # dispatcher-supplied value spliced into the script can close a quote
          # and run its own commands — including forging this step's outputs so
          # gate and publish proceed against a ref nothing validated.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$RELEASE_TAG' is not a vX.Y.Z release tag"; exit 1 ;;
          esac
          version="${RELEASE_TAG#v}"

          # Fully qualified, so a branch that happens to share the tag's name
          # cannot stand in for it. `^{commit}` dereferences an annotated tag.
          git fetch --no-tags origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
            echo "::error::refs/tags/${RELEASE_TAG} does not exist"
            exit 1
          fi

          pkg="$(git show "${sha}:packages/qfai/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf-8')).version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::tag $RELEASE_TAG does not match packages/qfai/package.json#version $pkg"
            exit 1
          fi

          # Literal prefix match, not a regex: as a basic regular expression the
          # dots in `1.10.0` match any character, so a `## [1x10x0]` heading
          # would satisfy the check here and then break the awk extraction that
          # builds the release notes — publishing while the GitHub Release
          # silently fails. `index($0, h) == 1` is the comparison the notes step
          # makes, so the two cannot disagree.
          if ! git show "${sha}:CHANGELOG.md" | awk -v h="## [${version}] - " 'index($0, h) == 1 { found = 1 } END { exit !found }'; then
            echo "::error::CHANGELOG.md has no released heading for ${version} (expected '## [${version}] - YYYY-MM-DD')"
            exit 1
          fi

          # A tag can be pushed onto any commit, including one on an unmerged
          # branch. Without this, code that never passed branch protection or
          # review could reach npm just by being tagged.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$RELEASE_TAG points at a commit that is not an ancestor of origin/main"
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        shell: bash

  # ── 2. The gate main is held to, re-run on the tagged tree ───────
  gate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
          # Full history, because the gate is not a self-contained check.
          # `pnpm ci:gate` runs `scripts/check-prompt-scanner-pair.mjs`, which
          # takes a three-dot diff between `origin/main` and `HEAD`. At the
          # default depth of 1 the tag and the branch share no reachable merge
          # base, the script exits 2, and the re-publish path this workflow
          # opens with — re-running a failed publish for an older tag — could
          # never get past this job.
          fetch-depth: 0
      # ── The composite action, taken from THIS workflow's revision ────────────────────
      # The checkout above put the TAG's tree in the workspace, and `uses: ./…` resolves
      # against the workspace. Review finding [07]: re-publishing a tag created before the
      # composite action existed — the `workflow_dispatch` path this workflow opens with —
      # left `./.github/actions/setup/action.yml` absent, and the job failed on step
      # resolution without ever reaching `pnpm ci:gate`. The re-publish route was documented
      # and unreachable for exactly the tags it was written for.
      #
      # So the action is fetched separately, at `github.sha` — the revision of the workflow
      # being executed, which by construction contains the action this file references. A
      # sparse checkout of `.github/actions` into a side path, and `clean: false` so it does
      # not wipe the tag tree already in the workspace.
      #
      # Not `uses: aganesy/QFAI/.github/actions/setup@main`: that is a moving reference, and
      # this repository pins every `uses:` to an immutable ref. Not a re-inlined preamble
      # either — `BR-0017-0027` makes the composite action the single definition, and a copy
      # here is the drift its extraction removed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-actions
          clean: false
          sparse-checkout: .github/actions
          # CONE MODE OFF, which is the difference between fetching one directory and fetching one
          # directory plus every file at the repository root. In cone mode the root files come too,
          # so `.ci-actions/CHANGELOG.md` lands in the workspace and `ci:gate`'s
          # `markdownlint-cli2 "**/*.md"` lints it — its ignore entry is the bare `CHANGELOG.md`,
          # which does not match a nested copy. Measured: 376 errors, on every release rather than
          # only on the re-publish path this sidecar exists for.
          sparse-checkout-cone-mode: false
      # The one definition of how this repository installs a toolchain (BR-0017-0027). It enables
      # corepack, resolves Node from `package.json#engines`, re-shims pnpm against the toolcache Node
      # in that order, and installs frozen. Inlining any of it is what let the gate and `ci.yml` drift.
      #
      # Resolving the RANGE, deliberately — the newest release satisfying `engines.node`.
      #
      # Review finding [13] is about the floor going unexercised, and pinning this job to it was the
      # first attempt. That trades one gap for its mirror image: the gate would then run ONLY on
      # 20.19.0 and the inverse break — works on the floor, fails on the newest Node an adopter
      # actually installs — would be exercised nowhere at tag time. The finding asks for a floor
      # lane "separately from validating the newest Node", not instead of it.
      #
      # The floor is covered for this exact commit without pinning here: the `verify` job above
      # refuses a tag that is not an ancestor of `origin/main`, so the tagged tree has already
      # passed `ci.yml`, whose `node-floor` lane runs the package suite on the floor. Seven lanes on
      # the newest, one on the floor, and this gate re-runs the aggregate on the newest.
      - uses: ./.ci-actions/.github/actions/setup
      - name: Run the release gate
        # The same aggregate `main` is held to: SSOT sync, format, lint, types,
        # package tests and pack verification.
        run: pnpm ci:gate
        env:
          # The branch-name pin is a PR-time guard; a tag has no branch to read,
          # and `verify` already checked the stronger claim
          # (tag == package.json == CHANGELOG).
          VERSION_PIN_SKIP: "1"
      - name: Sanity grep — no internal spec IDs or version markers leak (post-build)
        # `ci:gate` builds but does not re-run this; CI runs it after the build
        # because some identifiers only appear in `dist/`. Without it here, a
        # leak that is invisible in source reaches an irreversible publish.
        run: bash packages/qfai/scripts/check-no-internal-version-leakage.sh
        shell: bash

  # ── 3. GitHub Release, on the tag push ───────────────────────────
  github-release:
    if: github.event_name == 'push'
    needs: [verify, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - name: Extract this version's CHANGELOG section
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          # From this version's heading to the next `## [` heading, exclusive.
          awk -v h="## [${RELEASE_VERSION}] - " '
            index($0, h) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > tmp/release-notes.md
          if [ ! -s tmp/release-notes.md ]; then
            echo "::error::no CHANGELOG body for ${RELEASE_VERSION}"
            exit 1
          fi
        shell: bash
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: gh release create "$RELEASE_TAG" --title "qfai $RELEASE_VERSION" --notes-file tmp/release-notes.md
        shell: bash

  # ── 4. npm publish, on either trigger, behind an approval ────────
  # Authenticates by OIDC — no stored credential. Two things must be true
  # before it can upload, and it fails loudly rather than skipping when either
  # is missing, because a release that silently does not publish looks
  # identical to one that did:
  #   - npmjs.com lists this repository + `release.yml` as a trusted publisher;
  #   - the `release` environment carries a required reviewer, which is what
  #     keeps tagging and publishing separate decisions.
  publish:
    needs: [verify, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - name: "Enable corepack (provides pnpm for setup-node cache: pnpm)"
        run: corepack enable
        shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_PUBLISH }}
          cache: pnpm
          # `registry-url` is required — npm needs the registry configured in
          # .npmrc before it will run the OIDC exchange. Dropping it does not
          # fix the token problem below; it just moves the failure from E404
          # to ENEEDAUTH, because npm then has no registry config to act on.
          registry-url: "https://registry.npmjs.org"
      - name: Re-shim pnpm against toolcache Node
        run: corepack prepare pnpm@9.12.3 --activate
        shell: bash
      - run: pnpm install --frozen-lockfile
      - name: Drop the placeholder auth line so npm reaches the OIDC exchange
        # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
        # and exports NODE_AUTH_TOKEN as the literal `XXXXX-XXXXX-XXXXX-XXXXX`
        # when no token is supplied. npm reads that as a configured credential,
        # skips trusted publishing entirely, and sends a token the registry has
        # never seen. Removing the line is the workaround tracked in
        # actions/setup-node#1551; npm then finds ACTIONS_ID_TOKEN_REQUEST_* and
        # exchanges properly.
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            echo "auth lines remaining: $(grep -c _authToken "$npmrc" || true)"
          fi
        shell: bash
      - name: Require an npm that can do trusted publishing
        # `actions/setup-node` ships whatever npm the Node build carries, which
        # is older than 11.5.1 on every current LTS line. Without this the
        # publish fails at the OIDC exchange with an authentication error that
        # says nothing about the version.
        run: |
          set -euo pipefail
          npm install -g npm@latest
          have="$(npm --version)"
          need="11.5.1"
          lowest="$(printf '%s\n%s\n' "$have" "$need" | sort -V | head -1)"
          if [ "$lowest" != "$need" ]; then
            echo "::error::npm $have is below $need, the minimum for trusted publishing (node $(node --version))"
            exit 1
          fi
          echo "npm $have"
        shell: bash
      - name: Require an approved environment
        # The `environment:` key above is what makes a tag push *propose* a
        # publish rather than perform one — but only when the environment
        # carries required reviewers. GitHub silently allows an unprotected
        # environment, which would turn every tag push into an unattended
        # irreversible upload. Refuse rather than assume.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rules="$(gh api "repos/${GITHUB_REPOSITORY}/environments/release" \
            --jq '[.protection_rules[]?.type] | join(",")' 2>/dev/null || echo "")"
          case "$rules" in
            *required_reviewers*) echo "release environment requires reviewers: $rules" ;;
            *)
              echo "::error::the 'release' environment has no required reviewers (rules: ${rules:-none}). A tag push would publish unattended. Add a required reviewer to the release environment before publishing."
              exit 1
              ;;
          esac
        shell: bash
      - name: Skip if this version is already on npm
        # Re-running a release — a rotated token, a retried upload — must not
        # fail on `EPUBLISHCONFLICT`. npm refuses to overwrite a version, so a
        # version already present means this job's work is done.
        id: published
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "qfai@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "qfai@${RELEASE_VERSION} is already published; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Pack the tarball that will ship
        if: steps.published.outputs.skip != 'true'
        # `prepack` runs `npm run build`, so packing is what produces the
        # final `dist/`. Checking a tree built in a separate step and then
        # letting `publish` re-run `prepack` would inspect one artifact and
        # ship another.
        run: |
          set -euo pipefail
          mkdir -p tmp
          pnpm -C packages/qfai pack --pack-destination "$PWD/tmp"
        shell: bash
      - name: Sanity grep — no internal spec IDs or version markers leak (packed tarball)
        if: steps.published.outputs.skip != 'true'
        # Unpacked and scanned, so what is inspected is byte-for-byte what npm
        # receives — including files only `prepack` produces.
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          tarball="tmp/qfai-${RELEASE_VERSION}.tgz"
          if [ ! -f "$tarball" ]; then
            echo "::error::expected $tarball; pack produced: $(ls tmp)"
            exit 1
          fi
          rm -rf tmp/packed && mkdir -p tmp/packed
          tar -xzf "$tarball" -C tmp/packed
          QFAI_LEAKAGE_SCAN_ROOT="$PWD/tmp/packed/package" \
            bash packages/qfai/scripts/check-no-internal-version-leakage.sh
        shell: bash
      - name: Publish the inspected tarball
        if: steps.published.outputs.skip != 'true'
        # The directory the scan just read, not the .tgz. Same bytes either
        # way — it is the tarball unpacked — but npm's directory code path is
        # the one every documented trusted-publishing example takes, and
        # publishing the .tgz never reached the OIDC exchange.
        #
        # `--ignore-scripts` is what keeps the guarantee the .tgz gave: the
        # published package.json still declares `prepack: npm run build`, and
        # without this npm would re-run it here — after the leakage scan, and
        # in a tree with no source to build.
        #
        # No `NODE_AUTH_TOKEN`: the OIDC exchange is what authenticates, using
        # the `id-token: write` permission above. `--provenance` is passed
        # explicitly rather than relying on the documented default, because the
        # attestation is the point of publishing this way and a silent default
        # change would remove it without failing anything.
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        # `./` is load-bearing. Without it npm reads `tmp/qfai-1.10.0.tgz` as the
        # `owner/repo` GitHub shorthand and fails with EALLOWGIT, refusing to
        # fetch "github:tmp/qfai-1.10.0.tgz" — a path that looks like a spec.
        run: npm publish --access public --provenance --ignore-scripts
        working-directory: tmp/packed/package
        shell: bash
      - name: npm debug log (on failure)
        if: failure()
        # Every diagnosis so far has come from guessing at an error code.
        # npm writes its own account of the request, including whether it
        # attempted the OIDC exchange at all.
        run: |
          set -euo pipefail
          log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -1 || true)"
          if [ -n "$log" ]; then
            echo "--- $log ---"
            tail -80 "$log"
          else
            echo "no npm debug log found"
          fi
        shell: bash
