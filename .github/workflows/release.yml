name: Release

# Two triggers, one pipeline.
#
#   push tag vX.Y.Z   -> verify + gate + GitHub Release + npm publish
#   workflow_dispatch -> verify + gate + npm publish, for a tag that already exists
#
# `RELEASE.md` treats tag creation and `npm publish（必要な場合）` as separate
# steps, and the repo rules require an explicit instruction for each. That
# separation is now enforced by the `release` **environment** rather than by
# withholding the trigger: the publish job cannot start until a required
# reviewer approves the deployment, so pushing a tag proposes a publish instead
# of performing one.
#
# That only holds if the environment is configured. An environment with no
# protection rules gates nothing and a tag push would publish unattended, so
# the job refuses to run against an unprotected one — see "Require an approved
# environment" below.
#
# `workflow_dispatch` stays for re-publishing a tag that already exists (a
# failed upload, an approval that lapsed) without cutting a new tag.
#
# ## What stays serial here, and why
#
# Ten jobs, and the shape is one fan-out and one fan-in: `verify` decides, seven
# gate jobs run concurrently off it, and `github-release` and `publish` wait on
# all eight. What is left serial is serial for one of four reasons, none of them
# a leftover.
#
# **`verify` is a prerequisite of everything, and its two steps of each other.**
# Between them `pin` and `shape` set all five outputs — the version, the tag, the
# sha, and the two shapes that decide which gate runs — and every job downstream
# reads one. A gate that started beside `verify` would be gating a tag nobody had
# checked, which is the whole of what `verify` is for.
#
# **The gate jobs fan in to the publish, within this run.** `github-release` and
# `publish` name all eight in `needs`, so an upload nobody can take back cannot
# read a gate that was skipped, cancelled, or ran somewhere else. That is a trust
# dependency rather than an ordering convenience, and it is why a new gate job
# belongs in this file and in both of those lists — never in a workflow of its
# own.
#
# **`publish` cannot move out of this file at all.** npm binds the trusted-publishing
# exchange to this workflow's filename, and only `publish` performs it.
#
# **What is left inside `gate` is shape-dependent, not unsplit.** `gate-ssot`,
# `gate-lint`, `gate-types`, `gate-tests` and the two floor jobs are already jobs
# of their own. `gate` holds what a tag's own declared entry points decide: an
# `operations` tag builds, an `aggregate` tag runs the checks, a `whole` tag runs
# the suite with them — and the post-build leak grep reads the `dist/` whichever
# of those produced. Splitting the grep from the build would give it no build to
# read on two of the three shapes.
#
# Publishing authenticates by **trusted publishing** (OIDC): the job exchanges a
# short-lived GitHub identity token for a registry credential. There is no
# `NPM_TOKEN` to store, leak, or rotate. npm binds that exchange to this
# repository AND to this workflow's filename, so `release.yml` cannot be renamed
# without re-registering the trusted publisher on npmjs.com.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm (e.g. v1.10.0)"
        required: true
        type: string

env:
  # Trusted publishing needs npm >= 11.5.1. Pinning Node to that requirement is
  # documented minimum (22.14.0) is not enough: `npm@latest` carries its own
  # engine range — npm 12 wants `^22.22.2 || ^24.15.0 || >=26.0.0` — so the
  # install fails with EBADENGINE before the version check ever runs. Track the
  # current LTS major instead, and let setup-node resolve its newest patch.
  #
  # Only the publish job runs on it, and it is the ONE workflow-level Node literal this repository
  # allows (BR-0017-0027). It survives because it encodes npm's engine range for trusted publishing,
  # which no file in the repository expresses. Every other job, the release gate included, takes its
  # Node from `./.github/actions/setup`.
  NODE_PUBLISH: "24"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. The tag is a claim; check that the tree agrees ─────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pin.outputs.version }}
      tag: ${{ steps.pin.outputs.tag }}
      sha: ${{ steps.pin.outputs.sha }}
      suite-shape: ${{ steps.shape.outputs.suite-shape }}
      checks-shape: ${{ steps.shape.outputs.checks-shape }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Not the input: the repository default, so nothing the dispatcher
          # controls decides what code is checked out before it is validated.
          # The tag is resolved through `refs/tags/` below and everything
          # afterwards runs against the SHA that resolution produced.
          fetch-depth: 0
      - name: Resolve and check the version the tag claims
        id: pin
        env:
          # Through the environment, never through `${{ }}` inside `run`. A
          # dispatcher-supplied value spliced into the script can close a quote
          # and run its own commands — including forging this step's outputs so
          # gate and publish proceed against a ref nothing validated.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Exactly `vX.Y.Z`, anchored at both ends.
          #
          # The pattern here was `v[0-9]*.[0-9]*.[0-9]*`, and a shell `*` matches ANY run of
          # characters — so `v1.10.1-beta.1` passed, and so did `v1x.2y.3junk`. Both were
          # measured. That matters more than it looks: the publish step passes no `--tag`, so npm
          # points `latest` at whatever it publishes, and a hand-dispatched prerelease would have
          # gone out to every `npm install qfai`.
          #
          # Checked by structure rather than by regex, so it holds under any POSIX shell: nothing
          # but digits and dots after the `v`, no empty component, and exactly three of them.
          # That is the same set as `^v[0-9]+\.[0-9]+\.[0-9]+$`.
          reject() { echo "::error::'$RELEASE_TAG' is not a vX.Y.Z release tag: $1"; exit 1; }
          case "$RELEASE_TAG" in
            v*) ;;
            *) reject "it must begin with v" ;;
          esac
          version="${RELEASE_TAG#v}"
          case "$version" in
            *[!0-9.]*)
              reject "only digits and dots may follow the v, so a prerelease or build suffix is not a release"
              ;;
            *..* | .* | *.) reject "it has an empty version component" ;;
          esac
          after_major="${version#*.}"
          [ "$after_major" != "$version" ] || reject "it must carry exactly three numeric components"
          after_minor="${after_major#*.}"
          [ "$after_minor" != "$after_major" ] || reject "it must carry exactly three numeric components"
          case "$after_minor" in
            *.*) reject "it must carry exactly three numeric components" ;;
          esac

          # Fully qualified, so a branch that happens to share the tag's name
          # cannot stand in for it. `^{commit}` dereferences an annotated tag.
          git fetch --no-tags origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
            echo "::error::refs/tags/${RELEASE_TAG} does not exist"
            exit 1
          fi

          pkg="$(git show "${sha}:packages/qfai/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf-8')).version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::tag $RELEASE_TAG does not match packages/qfai/package.json#version $pkg"
            exit 1
          fi

          # Literal prefix match, not a regex: as a basic regular expression the
          # dots in `1.10.0` match any character, so a `## [1x10x0]` heading
          # would satisfy the check here and then break the awk extraction that
          # builds the release notes — publishing while the GitHub Release
          # silently fails. `index($0, h) == 1` is the comparison the notes step
          # makes, so the two cannot disagree.
          if ! git show "${sha}:CHANGELOG.md" | awk -v h="## [${version}] - " 'index($0, h) == 1 { found = 1 } END { exit !found }'; then
            echo "::error::CHANGELOG.md has no released heading for ${version} (expected '## [${version}] - YYYY-MM-DD')"
            exit 1
          fi

          # A tag can be pushed onto any commit, including one on an unmerged
          # branch. Without this, code that never passed branch protection or
          # review could reach npm just by being tagged.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$RELEASE_TAG points at a commit that is not an ancestor of origin/main"
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        shell: bash

      # ── Which gate the tag's tree can actually run ──────────────────────────────────
      # Every job below checks out the TAG's tree and runs package scripts from it, and the
      # `workflow_dispatch` path this workflow opens with exists to re-publish a tag that already
      # exists. So the scripts a job may name are whatever that tag declares, and a tag cut before
      # the gate was split declares a different set from this one.
      #
      # Two shapes, and the decision between them is made ONCE, here. Made per job instead, the
      # gate could read the tag as old, run the aggregate — suite included — while the sliced lane
      # beside it read the same tag as new and ran the suite a second time. One output, four
      # consumers, so the halves cannot disagree.
      #
      # It belongs to `verify` rather than to a job of its own: `verify` already resolves the tag,
      # already holds the tree at full depth, already publishes the outputs every other job reads,
      # and every other job already waits for it. A job-level `if:` on a matrix job is evaluated
      # before the matrix expands, which is what lets `gate-tests` and `gate-floor` skip whole
      # rather than leg by leg.
      - name: Read which gate shape the tag's tree declares
        id: shape
        env:
          RELEASE_SHA: ${{ steps.pin.outputs.sha }}
          # The slice set, declared once and checked in full. Eight of the nine is not the new
          # shape: the ninth leg would find no script, and a leg with nothing to run is a green
          # check over nothing.
          #
          # SHIPPED-CI: not-applicable
          # Because: the shipped set carries no publish workflow, so it holds no release gate.
          # Its three lanes run an adopter's own documents, validation and layer-named test
          # scripts, never this repository's suite, so a slice of ours has nothing to join there.
          SUITE_SLICES: core validators integration e2e cli unit scripts pr-fix pr-merge
        run: |
          set -euo pipefail
          # The tag's manifests, read as DATA. `git show` puts each one in a variable and the
          # program below parses it out of the environment — nothing the tag carries reaches a
          # command position, nothing is evaluated, and no manifest value is echoed back into the
          # log where a workflow command could be read out of it.
          #
          # Assigned on their own lines, not as a prefix to `node`: a command substitution that
          # fails in an assignment PREFIX leaves the command's own exit status behind, so a
          # missing manifest would arrive as an empty string instead of stopping the job.
          ROOT_MANIFEST="$(git show "${RELEASE_SHA}:package.json")"
          PACKAGE_MANIFEST="$(git show "${RELEASE_SHA}:packages/qfai/package.json")"
          export ROOT_MANIFEST PACKAGE_MANIFEST
          node - <<'SHAPE'
          const { appendFileSync } = require("node:fs");

          const fail = (message) => {
            console.log(`::error::${message}`);
            process.exit(1);
          };

          // Parsed, never evaluated. A parse failure names the manifest and not the text it
          // choked on, because the text is the dispatcher's to choose.
          const manifest = (label, text) => {
            let value;
            try {
              value = JSON.parse(text);
            } catch {
              fail(`${label} is not valid JSON, so which gate this tag can run is undecidable`);
            }
            if (value === null || typeof value !== "object" || Array.isArray(value)) {
              fail(`${label} is not a JSON object, so which gate this tag can run is undecidable`);
            }
            return value;
          };

          // A script is declared when the lookup yields a string. The type check is what makes a
          // lookup on a parsed object safe: an inherited member answers to a key the manifest
          // never set, and none of them is a string.
          const declares = (parsed, name) => {
            const scripts = parsed.scripts;
            if (scripts === null || typeof scripts !== "object") return false;
            return typeof scripts[name] === "string";
          };

          const root = manifest("the tag's root package.json", process.env.ROOT_MANIFEST ?? "");
          const pkg = manifest(
            "the tag's packages/qfai/package.json",
            process.env.PACKAGE_MANIFEST ?? "",
          );

          const slices = (process.env.SUITE_SLICES ?? "").trim().split(/\s+/).filter(Boolean);
          if (slices.length === 0) {
            fail("SUITE_SLICES named no slices, so no slice set was checked for");
          }

          // Only names from the list above ever appear here, so reporting them says nothing the
          // tag chose.
          const absent = slices.filter((slice) => !declares(pkg, `test:${slice}`));

          const operationScripts = [
            "ci:gate:ssot", "ci:gate:lint", "ci:gate:types", "ci:gate:build",
          ];
          const emit = (shape, why) => {
            const checks = shape === "sliced" && operationScripts.every((name) => declares(root, name))
              ? "operations" : "aggregate";
            console.log(`release gate shape: ${shape} — ${why}`);
            console.log(`release checks shape: ${checks}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `suite-shape=${shape}\nchecks-shape=${checks}\n`);
            process.exit(0);
          };

          if (declares(root, "ci:gate:checks") && absent.length === 0) {
            emit(
              "sliced",
              "the tree declares ci:gate:checks and a script for all " +
                `${slices.length} slices, so the checks and the suite run as separate jobs`,
            );
          }

          if (declares(root, "ci:gate") && declares(pkg, "test")) {
            emit(
              "whole",
              "the tree predates the split, so the gate runs the ci:gate aggregate — suite " +
                "included — and the sliced jobs stand down",
            );
          }

          // Neither shape is runnable, and there is no third. Refused rather than guessed at: a
          // shape nothing can classify is exactly the case where a skipped job would report as a
          // gate that passed.
          fail(
            "this tag declares neither gate shape, so nothing can validate it: " +
              `ci:gate:checks ${declares(root, "ci:gate:checks") ? "present" : "absent"}, ` +
              `ci:gate ${declares(root, "ci:gate") ? "present" : "absent"}, ` +
              `the package's test script ${declares(pkg, "test") ? "present" : "absent"}, ` +
              `slice scripts absent: ${absent.length === 0 ? "none" : absent.join(" ")}`,
          );
          SHAPE
        shell: bash

  # ── 2. The gate main is held to, re-run on the tagged tree ───────
  gate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The branch-name pin is a PR-time guard; a tag has no branch to read, and `verify` already
      # checked the stronger claim (tag == package.json == CHANGELOG). Declared for the job
      # because either of the two gate steps below may be the one that runs.
      VERSION_PIN_SKIP: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
          # Older tags' aggregates include a scanner using a three-dot diff
          # against origin/main. Their re-publication path still needs full history.
          fetch-depth: 0
      # ── The composite action, taken from THIS workflow's revision ────────────────────
      # The checkout above put the TAG's tree in the workspace, and `uses: ./…` resolves
      # against the workspace. Review finding [07]: re-publishing a tag created before the
      # composite action existed — the `workflow_dispatch` path this workflow opens with —
      # left `./.github/actions/setup/action.yml` absent, and the job failed on step
      # resolution without ever reaching `pnpm ci:gate`. The re-publish route was documented
      # and unreachable for exactly the tags it was written for.
      #
      # So the action is fetched separately, at `github.sha` — the revision of the workflow
      # being executed, which by construction contains the action this file references. A
      # sparse checkout of `.github/actions` into a side path, and `clean: false` so it does
      # not wipe the tag tree already in the workspace.
      #
      # Not `uses: aganesy/QFAI/.github/actions/setup@main`: that is a moving reference, and
      # this repository pins every `uses:` to an immutable ref. Not a re-inlined preamble
      # either — `BR-0017-0027` makes the composite action the single definition, and a copy
      # here is the drift its extraction removed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-actions
          clean: false
          sparse-checkout: .github/actions
          # CONE MODE OFF, which is the difference between fetching one directory and fetching one
          # directory plus every file at the repository root. In cone mode the root files come too,
          # so `.ci-actions/CHANGELOG.md` lands in the workspace and `ci:gate`'s
          # `markdownlint-cli2 "**/*.md"` lints it — its ignore entry is the bare `CHANGELOG.md`,
          # which does not match a nested copy. Measured: 376 errors, on every release rather than
          # only on the re-publish path this sidecar exists for.
          sparse-checkout-cone-mode: false
      # The one definition of how this repository installs a toolchain (BR-0017-0027). It enables
      # corepack, resolves Node from `package.json#engines`, re-shims pnpm against the toolcache Node
      # in that order, and installs frozen. Inlining any of it is what let the gate and `ci.yml` drift.
      #
      # Resolving the RANGE, deliberately — the newest release satisfying `engines.node`.
      #
      # Review finding [13] is about the floor going unexercised, and pinning this job to it was the
      # first attempt. That trades one gap for its mirror image: the gate would then run ONLY on
      # 22.12.0 and the inverse break — works on the floor, fails on the newest Node an adopter
      # actually installs — would be exercised nowhere at tag time. The finding asks for a floor
      # lane "separately from validating the newest Node", not instead of it.
      #
      # The floor is covered for this exact commit without pinning here: the `verify` job above
      # refuses a tag that is not an ancestor of `origin/main`, so the tagged tree has already
      # passed `ci.yml`, whose `node-floor` lane runs the package suite on the floor. Seven lanes on
      # the newest, one on the floor, and this gate re-runs the aggregate on the newest.
      - uses: ./.ci-actions/.github/actions/setup
      # The tag's declared entry points decide which complete gate runs.
      - name: Build and verify the release package
        if: needs.verify.outputs.checks-shape == 'operations'
        run: pnpm ci:gate:build
        shell: bash
      - name: Run the release gate's checks
        # Everything in the aggregate `main` is held to except the package suite: SSOT sync,
        # format, lint, types and pack verification. The suite runs beside this job, sliced, so
        # the two halves take the wall clock of the longer rather than the sum.
        if: needs.verify.outputs.suite-shape == 'sliced' && needs.verify.outputs.checks-shape == 'aggregate'
        run: pnpm ci:gate:checks
        shell: bash
      - name: Run the whole release gate, suite included
        # A tag cut before the split carries `ci:gate` alone, and that aggregate is the whole of
        # what such a tag was ever held to. It runs here in full, and the sliced jobs beside this
        # one stand down, so the suite runs once either way.
        if: needs.verify.outputs.suite-shape == 'whole'
        run: pnpm ci:gate
        shell: bash
      - name: Sanity grep — no internal spec IDs or version markers leak (post-build)
        # `ci:gate` builds but does not re-run this; CI runs it after the build
        # because some identifiers only appear in `dist/`. Without it here, a
        # leak that is invisible in source reaches an irreversible publish.
        run: bash packages/qfai/scripts/check-no-internal-version-leakage.sh
        shell: bash

  # Independent checks use separate workspaces: tsc writes dist and the
  # bundler cleans it. Only verify's immutable tag decision is shared.
  # SHIPPED-CI: not-applicable
  # Because: the shipped templates do not build or publish this package.
  gate-ssot:
    needs: verify
    if: needs.verify.outputs.checks-shape == 'operations'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-actions
          clean: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.ci-actions/.github/actions/setup
      - run: pnpm ci:gate:ssot
        shell: bash

  gate-lint:
    needs: verify
    if: needs.verify.outputs.checks-shape == 'operations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION_PIN_SKIP: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-actions
          clean: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.ci-actions/.github/actions/setup
      - run: pnpm ci:gate:lint
        shell: bash

  gate-types:
    needs: verify
    if: needs.verify.outputs.checks-shape == 'operations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-actions
          clean: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.ci-actions/.github/actions/setup
      - run: pnpm ci:gate:types
        shell: bash

  # ── 2a. The package suite, sliced, on the tagged tree ────────────
  # The aggregate beside this job ran the suite itself, in one process pool, and that pool is what a
  # release waited on: measured, running the whole aggregate and running the suite alone both cost
  # twelve to fourteen minutes. Sliced over the nine projects the runner workspace declares, this
  # lane costs its longest slice — `cli`, measured at 349 seconds — instead of the sum of all nine,
  # and every check that ran before a publish still runs before one.
  #
  # The same nine values `ci.yml` declares, for the same reason it declares them: the slices
  # partition the suite, so the legs together carry the whole claim. `fail-fast: false`, so one red
  # leg does not hide which of the others would also have failed.
  #
  # Only for a tag whose tree declares the sliced shape. On any other tag the aggregate in `gate`
  # runs the suite whole, so these nine legs would be a second run of the same tests — and the
  # condition sits on the JOB, where it is evaluated before the matrix expands, rather than inside
  # each leg where nine legs would report green having run nothing.
  gate-tests:
    needs: verify
    if: needs.verify.outputs.suite-shape == 'sliced'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice: [core, validators, integration, e2e, cli, unit, scripts, pr-fix, pr-merge]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
          # The tagged commit and its parent, the depth `ci.yml`'s test lane takes: a test in the
          # `e2e` slice tells a count this tree moved from one its parent moved, and at the default
          # depth the parent's SHA is readable while its objects are not. Declared for every leg
          # rather than for that one, because a checkout that differs by leg is a difference nobody
          # reading a red leg would think to look for.
          fetch-depth: 2
      # The composite action from THIS workflow's revision, for the reason the gate documents: a tag
      # cut before the action existed has no `./.github/actions/setup` in its tree.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-actions
          clean: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.ci-actions/.github/actions/setup
      # `dist/` is not committed and two slices read it: `integration` fails without a shipped
      # bundle to measure, and `e2e` spawns the built CLI. The other seven run pure TS through
      # vitest's loader and would pay for a build nothing in them reads.
      - name: Build qfai (the slices that read dist/)
        if: matrix.slice == 'e2e' || matrix.slice == 'integration'
        run: pnpm -C packages/qfai build
      - name: Run the package test suite (${{ matrix.slice }})
        # The per-slice script, not the generic runner with a project name — the reason `ci.yml`'s
        # test step gives: a slice with no script of its own would still run, so nothing would
        # demand the script exist. The job's condition is what guarantees the tag declares one.
        shell: bash
        run: pnpm -C packages/qfai test:${{ matrix.slice }}

  # ── 2b. The same tree, on the floor `engines.node` promises ──────
  # Review finding [56]. The gate above resolves the RANGE — the newest Node satisfying
  # `engines.node` — and the comment there argued the floor was already covered: `verify` refuses a
  # tag that is not an ancestor of `origin/main`, so the tagged tree has passed `ci.yml`, whose
  # `node-floor` lane runs the package suite on the floor.
  #
  # That holds only for tags cut after `node-floor` existed. This workflow opens with a
  # `workflow_dispatch` re-publish path whose whole purpose is older tags: such a tag is an ancestor
  # of `main` and has never seen that lane. So the floor is exercised here, on the tagged tree,
  # derived from THAT tree's `engines.node` — the version the package about to be published promises
  # to run on.
  #
  # Beside the gate rather than instead of it: the two failures are mirror images, and the finding
  # that created `node-floor` asked for a floor lane separately from validating the newest Node.
  #
  # Over the same slice matrix as the lane beside it, and for the same reason `ci.yml` slices its own
  # floor lane: one process pool over the whole suite sets the wall clock for the release. Each leg
  # asserts the floor for itself, because a leg running the wrong Node is what that assertion is for
  # and a single leg checking it would leave the other eight unverified.
  #
  # Only for a tag whose tree declares the sliced shape. A tag that predates it has no per-slice
  # script for these legs to run, and the floor is covered for it by `gate-floor-whole` below.
  gate-floor:
    needs: verify
    if: needs.verify.outputs.suite-shape == 'sliced'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: [core, validators, integration, e2e, cli, unit, scripts, pr-fix, pr-merge]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
          # The tagged commit and its parent, for the reason the lane above takes the same depth: a
          # test in the `e2e` slice reads the parent's objects, which the default depth leaves
          # unfetched.
          fetch-depth: 2
      # The composite action from THIS workflow's revision, for the reason the gate documents: a tag
      # cut before the action existed has no `./.github/actions/setup` in its tree.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-actions
          clean: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.ci-actions/.github/actions/setup
        with:
          pin-engines-floor: "true"
          # The PACKAGE's manifest, which is where the promise to adopters lives. In this tree it
          # agrees with the root's; on a re-published tag it need not.
          engines-manifest: "./packages/qfai/package.json"
      - name: Confirm the pinned floor is what is running
        shell: bash
        run: |
          set -euo pipefail
          # Asserted, not assumed. `setup-node` silently ignores an empty `node-version`, so a
          # wiring mistake in the shared action would leave this lane running the newest release
          # while still reporting as the floor lane — a green check for a claim nothing tested, on
          # the one run that ends in an irreversible publish.
          #
          # The expected value is READ from the manifest the `engines-manifest` input above names,
          # which is where the action derives it from. A version literal here would be a second
          # answer to the same question, and the repository allows exactly one Node literal.
          range="$(node -p "require('./packages/qfai/package.json').engines.node")"
          expected="v${range#>=}"
          actual="$(node --version)"
          echo "gate-floor: engines floor ${expected}, running ${actual}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::gate-floor expected ${expected} but is running ${actual}; pin-engines-floor did not take effect"
            exit 1
          fi
      # The two slices that read `dist/`, which is not committed. The other seven run pure TS through
      # vitest's loader, and an always-red leg here would stop a release for a missing bundle rather
      # than for a floor break.
      - name: Build qfai on the floor (the slices that read dist/)
        if: matrix.slice == 'e2e' || matrix.slice == 'integration'
        run: pnpm -C packages/qfai build
      - name: Run the package test suite on the floor (${{ matrix.slice }})
        # The fork count comes from the runner, for the reason `ci.yml`'s floor lane records: forks
        # outnumbering the cores turn a healthy run red on an RPC timeout the declaration cannot
        # reach.
        shell: bash
        run: QFAI_TEST_MAX_WORKERS="$(nproc)" pnpm -C packages/qfai test:${{ matrix.slice }}

  # ── 2c. The floor, for a tree that predates the slices ───────────
  # The lane above needs a `test:<slice>` script per leg, and a tag cut before the split carries
  # none — so for such a tag the floor is exercised here instead, by the one script it does
  # declare. This is what that tag's floor lane always was, before the suite was sliced.
  #
  # Its own job rather than a tenth leg of the lane above. The two are mutually exclusive on
  # `verify`'s answer, and a matrix leg cannot be that: the matrix expands after the job's
  # condition is read, so an "everything" leg would have to decide inside the shell, where the
  # other nine legs skip themselves and report green.
  #
  # Nothing else runs the suite on the floor — `gate` beside it resolves the newest Node
  # satisfying the range — so this is the whole of the floor claim for such a tag.
  gate-floor-whole:
    needs: verify
    if: needs.verify.outputs.suite-shape == 'whole'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      # The composite action from THIS workflow's revision, for the reason the gate documents: a tag
      # cut before the action existed has no `./.github/actions/setup` in its tree.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-actions
          clean: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.ci-actions/.github/actions/setup
        with:
          pin-engines-floor: "true"
          # The PACKAGE's manifest, which is where the promise to adopters lives. In this tree it
          # agrees with the root's; on a re-published tag it need not.
          engines-manifest: "./packages/qfai/package.json"
      - name: Confirm the pinned floor is what is running
        # The same assertion the sliced lane makes, for the same reason: `setup-node` silently
        # ignores an empty `node-version`, so a wiring mistake would leave this job running the
        # newest release while still reporting as the floor lane.
        shell: bash
        run: |
          set -euo pipefail
          range="$(node -p "require('./packages/qfai/package.json').engines.node")"
          expected="v${range#>=}"
          actual="$(node --version)"
          echo "gate-floor-whole: engines floor ${expected}, running ${actual}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::gate-floor-whole expected ${expected} but is running ${actual}; pin-engines-floor did not take effect"
            exit 1
          fi
      # Unconditionally, unlike the sliced lane: that one builds for the two slices that read
      # `dist/`, and the whole suite contains both of them.
      - name: Build qfai on the floor
        run: pnpm -C packages/qfai build
      - name: Run the package test suite on the floor
        # The aggregate script, which is the one such a tag declares. No worker-count override:
        # the trees that reach this job do not read one, so setting it would be a knob with
        # nothing behind it.
        run: pnpm -C packages/qfai test

  # ── 3. GitHub Release, on the tag push ───────────────────────────
  github-release:
    # Only the gates outside the selected suite shape may be skipped.
    # Every gate on the selected path must have succeeded before an upload starts.
    # SHIPPED-CI: not-applicable
    # Because: the shipped templates have no release or registry publication jobs.
    if: >-
      ${{ github.event_name == 'push'
      && !cancelled()
      && needs.verify.result == 'success'
      && needs.gate.result == 'success'
      && ((needs.verify.outputs.suite-shape == 'sliced'
      && needs.gate-tests.result == 'success'
      && needs.gate-floor.result == 'success'
      && needs.gate-floor-whole.result == 'skipped')
      || (needs.verify.outputs.suite-shape == 'whole'
      && needs.gate-floor-whole.result == 'success'
      && needs.gate-tests.result == 'skipped'
      && needs.gate-floor.result == 'skipped'))
      && ((needs.verify.outputs.checks-shape == 'operations'
      && needs.verify.outputs.suite-shape == 'sliced'
      && needs.gate-ssot.result == 'success'
      && needs.gate-lint.result == 'success'
      && needs.gate-types.result == 'success')
      || (needs.verify.outputs.checks-shape == 'aggregate'
      && needs.gate-ssot.result == 'skipped'
      && needs.gate-lint.result == 'skipped'
      && needs.gate-types.result == 'skipped')) }}
    needs:
      [verify, gate, gate-ssot, gate-lint, gate-types, gate-tests, gate-floor, gate-floor-whole]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - name: Extract this version's CHANGELOG section
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          # From this version's heading to the next `## [` heading, exclusive.
          awk -v h="## [${RELEASE_VERSION}] - " '
            index($0, h) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > tmp/release-notes.md
          if [ ! -s tmp/release-notes.md ]; then
            echo "::error::no CHANGELOG body for ${RELEASE_VERSION}"
            exit 1
          fi

          # …and it has to FIT. A GitHub Release body is capped at 125,000 characters, and this
          # step only ever checked the empty end of the range — so v1.10.1, whose section runs to
          # 160,676 characters across 415 entries, made `gh release create` fail with a 422 and no
          # Release was created. The npm publish was unaffected (the two jobs are siblings), which
          # is exactly why this went unnoticed until somebody read the run.
          #
          # Capped rather than failed. A release that is too well described is not a reason to
          # stop shipping it, and the section is the authority either way — so the body is cut at
          # an ENTRY boundary, in document order, and says how much was left and where the rest
          # is. Nothing here decides which entries matter; that judgement is not this machinery's
          # to make.
          node - <<'CAP'
          const { readFileSync, writeFileSync } = require("node:fs");
          const LIMIT = 125000;
          const version = process.env.RELEASE_VERSION;
          const path = "tmp/release-notes.md";
          const body = readFileSync(path, "utf8").replace(/\n+$/, "");
          if (body.length <= LIMIT - 600) {
            console.log(`release notes: ${body.length} characters, within the limit`);
            process.exit(0);
          }
          const footer =
            "\n\n---\n\n**These notes are not the whole section.**\n\n" +
            `The \`[${version}]\` section of \`CHANGELOG.md\` runs to ${body.length} characters, ` +
            `past the ${LIMIT}-character limit on a release body. What is above is that same ` +
            "section in document order, stopped at an entry boundary.\n\n" +
            `Full section: https://github.com/${process.env.GITHUB_REPOSITORY}/blob/v${version}/CHANGELOG.md\n`;
          const budget = LIMIT - footer.length - 200;
          // An entry boundary, so the notes never end mid-sentence. A heading boundary was tried
          // first and kept a quarter of the section: the headings are few and the bodies between
          // them are enormous.
          let cut = body.lastIndexOf("\n- **", budget);
          if (cut < 0) cut = body.lastIndexOf("\n- ", budget);
          if (cut < 0) cut = body.lastIndexOf("\n### ", budget);
          if (cut < 0) cut = budget;
          writeFileSync(path, body.slice(0, cut).replace(/\n+$/, "") + footer, "utf8");
          console.log(
            `release notes: capped at ${cut} of ${body.length} characters ` +
              `(${Math.round((100 * cut) / body.length)}% of the section), with a link to the rest`,
          );
          CAP
        shell: bash
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: gh release create "$RELEASE_TAG" --title "qfai $RELEASE_VERSION" --notes-file tmp/release-notes.md
        shell: bash

  # ── 4. npm publish, on either trigger, behind an approval ────────
  # Authenticates by OIDC — no stored credential. Two things must be true
  # before it can upload, and it fails loudly rather than skipping when either
  # is missing, because a release that silently does not publish looks
  # identical to one that did:
  #   - npmjs.com lists this repository + `release.yml` as a trusted publisher;
  #   - the `release` environment carries a required reviewer, which is what
  #     keeps tagging and publishing separate decisions.
  publish:
    # The same gate results as github-release, on both supported triggers.
    if: >-
      ${{ !cancelled()
      && needs.verify.result == 'success'
      && needs.gate.result == 'success'
      && ((needs.verify.outputs.suite-shape == 'sliced'
      && needs.gate-tests.result == 'success'
      && needs.gate-floor.result == 'success'
      && needs.gate-floor-whole.result == 'skipped')
      || (needs.verify.outputs.suite-shape == 'whole'
      && needs.gate-floor-whole.result == 'success'
      && needs.gate-tests.result == 'skipped'
      && needs.gate-floor.result == 'skipped'))
      && ((needs.verify.outputs.checks-shape == 'operations'
      && needs.verify.outputs.suite-shape == 'sliced'
      && needs.gate-ssot.result == 'success'
      && needs.gate-lint.result == 'success'
      && needs.gate-types.result == 'success')
      || (needs.verify.outputs.checks-shape == 'aggregate'
      && needs.gate-ssot.result == 'skipped'
      && needs.gate-lint.result == 'skipped'
      && needs.gate-types.result == 'skipped')) }}
    needs:
      [verify, gate, gate-ssot, gate-lint, gate-types, gate-tests, gate-floor, gate-floor-whole]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      # FIRST, before a single line of tag-controlled code is fetched or run.
      #
      # `environment: release` makes a tag push PROPOSE a publish rather than perform one — but
      # only when the environment carries required reviewers. Without them GitHub starts this job
      # immediately, and this check used to sit eight steps down: after `actions/checkout` at the
      # tag, and after `pnpm install`, which runs the lifecycle scripts of whatever that tag
      # declares. This job holds `id-token: write`, so that code could mint an OIDC token and
      # publish on its own before the guard below ever ran and failed.
      #
      # An unprotected environment is precisely the case this guard exists to refuse, so it is
      # answered before anything the tag controls is on disk. It needs nothing from the
      # repository: `gh api` and `GITHUB_REPOSITORY` are enough.
      - name: Require an approved environment
        # The `environment:` key above is what makes a tag push *propose* a
        # publish rather than perform one — but only when the environment
        # carries required reviewers. GitHub silently allows an unprotected
        # environment, which would turn every tag push into an unattended
        # irreversible upload. Refuse rather than assume.
        env:
          # `Get an environment` wants repository `Administration: read`, and the workflow
          # `permissions:` block has no key that grants it — so `github.token` may not be able to
          # answer this at all. An optional secret carries a credential that can; without one the
          # job token is still tried, because on many repositories it does work and requiring a
          # secret nobody needs would be its own obstacle.
          GH_TOKEN: ${{ secrets.ENVIRONMENT_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # A call this token cannot make is NOT the same answer as `no protection rules`.
          #
          # This read was `2>/dev/null || echo ""`, which collapsed both into an empty string —
          # so a permission failure on a properly protected environment reported that the
          # environment was unprotected, and every release stopped with a message pointing at the
          # wrong thing. Both outcomes still refuse, because a check that cannot read its input
          # must never report a pass; what changes is that they are now told apart, and the
          # operator is sent to the right fix.
          set +e
          response="$(gh api "repos/${GITHUB_REPOSITORY}/environments/release" \
            --jq '[.protection_rules[]?.type] | join(",")' 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::cannot read the 'release' environment (gh exited ${status}): ${response}. This is not a statement about whether the environment is protected — it is that this job could not find out, and publishing without knowing is the thing this guard refuses. \`Get an environment\` requires repository Administration: read, which the workflow permissions block cannot grant; supply a credential that has it as the ENVIRONMENT_READ_TOKEN secret."
            exit 1
          fi
          case "$response" in
            *required_reviewers*) echo "release environment requires reviewers: $response" ;;
            *)
              echo "::error::the 'release' environment has no required reviewers (rules: ${response:-none}). A tag push would publish unattended. Add a required reviewer to the release environment before publishing."
              exit 1
              ;;
          esac
        shell: bash
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      # The rebuild allow-list from THIS workflow's revision, for the same reason the gate jobs
      # fetch the composite action that way. Review finding [131]: a tag cut before the list
      # existed does not carry it, so reading it out of the tag's tree made the refusal below
      # fire on every re-publish of an older tag — a documented route, stopped by a guard meant
      # to protect it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-actions
          clean: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: "Enable corepack (provides pnpm for setup-node cache: pnpm)"
        run: corepack enable
        shell: bash
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_PUBLISH }}
          cache: pnpm
          # `registry-url` is required — npm needs the registry configured in
          # .npmrc before it will run the OIDC exchange. Dropping it does not
          # fix the token problem below; it just moves the failure from E404
          # to ENEEDAUTH, because npm then has no registry config to act on.
          registry-url: "https://registry.npmjs.org"
      - name: Re-shim pnpm against toolcache Node
        run: corepack prepare pnpm@9.12.3 --activate
        shell: bash
      # `--ignore-scripts` for the reason the toolchain action carries it: a dependency's
      # manifest is not in this tree, it arrives inside a tarball, and its `postinstall` would
      # run here — in the job holding `id-token: write`. The guard above means a human approved
      # this release; it does not mean they reviewed every transitive lifecycle script the tag
      # resolves to. What may build is named in the allow-list beside the composite action.
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Build the dependencies permitted to run install scripts
        run: |
          set -euo pipefail
          list=".ci-actions/.github/actions/setup/dependency-builds.txt"
          # Where each permitted package comes from, before any of it runs. A name on the list
          # is a permission for that package, not for whatever the lockfile points the name at.
          node ".ci-actions/.github/actions/setup/verify-rebuild-sources.mjs" pnpm-lock.yaml "${list}"
          if [ ! -f "${list}" ]; then
            echo "::error::${list} is missing, so which dependencies may run install scripts is decided by nothing. Installation ran with --ignore-scripts; this step refuses rather than guessing."
            exit 1
          fi
          names=0
          while IFS= read -r name || [ -n "${name}" ]; do
            case "${name}" in "" | "#"*) continue ;; esac
            names=$((names + 1))
            echo "rebuilding ${name}"
            pnpm rebuild "${name}"
          done <"${list}"
          echo "rebuilt ${names} permitted dependency package(s)"
        shell: bash
      - name: Drop the placeholder auth line so npm reaches the OIDC exchange
        # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
        # and exports NODE_AUTH_TOKEN as the literal `XXXXX-XXXXX-XXXXX-XXXXX`
        # when no token is supplied. npm reads that as a configured credential,
        # skips trusted publishing entirely, and sends a token the registry has
        # never seen. Removing the line is the workaround tracked in
        # actions/setup-node#1551; npm then finds ACTIONS_ID_TOKEN_REQUEST_* and
        # exchanges properly.
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            echo "auth lines remaining: $(grep -c _authToken "$npmrc" || true)"
          fi
        shell: bash
      - name: Require an npm that can do trusted publishing
        # `actions/setup-node` ships whatever npm the Node build carries, which
        # is older than 11.5.1 on every current LTS line. Without this the
        # publish fails at the OIDC exchange with an authentication error that
        # says nothing about the version.
        run: |
          set -euo pipefail
          # The registry, named on the command line. Review finding [87]'s rule found this one:
          # `npm` resolves its registry from `NPM_CONFIG_REGISTRY` or a project `.npmrc`, so an
          # unqualified `npm@latest` is a name an attacker-controlled registry can answer — in the
          # job that holds the publishing identity, and with the installed npm doing the publish.
          # `--ignore-scripts` stops the package running at install time rather than when invoked.
          #
          # And the VERSION, for the same reason the corepack fallback carries one.
          #
          # This was `npm@latest`, on the argument that the floor check below decides whether
          # what arrived is new enough and a pin would be a second version to maintain. That
          # argument is wrong in the direction that matters here: `@latest` means the same tag
          # installs a different npm on different days, into the one job that holds
          # `id-token: write` and performs an irreversible upload. A future release with a
          # different engine requirement, a regression, or a tampered publish all arrive without
          # a diff — and the floor check cannot see any of that, because it only asks whether the
          # version is at least 11.5.1.
          #
          # The floor stays. It is the ASSERTION that this pin is still adequate, which is a
          # different job from choosing what to install: bump the pin and the floor tells you
          # whether the new one still clears the bar. Two numbers, because they answer two
          # questions.
          npm install -g --ignore-scripts --registry https://registry.npmjs.org/ npm@12.0.2
          have="$(npm --version)"
          need="11.5.1"
          lowest="$(printf '%s\n%s\n' "$have" "$need" | sort -V | head -1)"
          if [ "$lowest" != "$need" ]; then
            echo "::error::npm $have is below $need, the minimum for trusted publishing (node $(node --version))"
            exit 1
          fi
          echo "npm $have"
        shell: bash
      - name: Skip if this version is already on npm
        # Re-running a release — a rotated token, a retried upload — must not
        # fail on `EPUBLISHCONFLICT`. npm refuses to overwrite a version, so a
        # version already present means this job's work is done.
        id: published
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "qfai@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "qfai@${RELEASE_VERSION} is already published; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Pack the tarball that will ship
        if: steps.published.outputs.skip != 'true'
        # `prepack` runs `npm run build`, so packing is what produces the
        # final `dist/`. Checking a tree built in a separate step and then
        # letting `publish` re-run `prepack` would inspect one artifact and
        # ship another.
        run: |
          set -euo pipefail
          mkdir -p tmp
          pnpm -C packages/qfai pack --pack-destination "$PWD/tmp"
        shell: bash
      - name: Sanity grep — no internal spec IDs or version markers leak (packed tarball)
        if: steps.published.outputs.skip != 'true'
        # Unpacked and scanned, so what is inspected is byte-for-byte what npm
        # receives — including files only `prepack` produces.
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          tarball="tmp/qfai-${RELEASE_VERSION}.tgz"
          if [ ! -f "$tarball" ]; then
            echo "::error::expected $tarball; pack produced: $(ls tmp)"
            exit 1
          fi
          rm -rf tmp/packed && mkdir -p tmp/packed
          tar -xzf "$tarball" -C tmp/packed
          QFAI_LEAKAGE_SCAN_ROOT="$PWD/tmp/packed/package" \
            bash packages/qfai/scripts/check-no-internal-version-leakage.sh
        shell: bash
      - name: Publish the inspected tarball
        if: steps.published.outputs.skip != 'true'
        # The directory the scan just read, not the .tgz. Same bytes either
        # way — it is the tarball unpacked — but npm's directory code path is
        # the one every documented trusted-publishing example takes, and
        # publishing the .tgz never reached the OIDC exchange.
        #
        # `--ignore-scripts` is what keeps the guarantee the .tgz gave: the
        # published package.json still declares `prepack: npm run build`, and
        # without this npm would re-run it here — after the leakage scan, and
        # in a tree with no source to build.
        #
        # No `NODE_AUTH_TOKEN`: the OIDC exchange is what authenticates, using
        # the `id-token: write` permission above. `--provenance` is passed
        # explicitly rather than relying on the documented default, because the
        # attestation is the point of publishing this way and a silent default
        # change would remove it without failing anything.
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        # `./` is load-bearing. Without it npm reads `tmp/qfai-1.10.0.tgz` as the
        # `owner/repo` GitHub shorthand and fails with EALLOWGIT, refusing to
        # fetch "github:tmp/qfai-1.10.0.tgz" — a path that looks like a spec.
        run: npm publish --access public --provenance --ignore-scripts
        working-directory: tmp/packed/package
        shell: bash
      - name: npm debug log (on failure)
        if: failure()
        # Every diagnosis so far has come from guessing at an error code.
        # npm writes its own account of the request, including whether it
        # attempted the OIDC exchange at all.
        run: |
          set -euo pipefail
          log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -1 || true)"
          if [ -n "$log" ]; then
            echo "--- $log ---"
            tail -80 "$log"
          else
            echo "no npm debug log found"
          fi
        shell: bash
