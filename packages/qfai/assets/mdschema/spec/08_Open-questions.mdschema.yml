# Document schema: `<specsDir>/spec-NNNN/08_Open-questions.md`
#
# Unresolved questions, with an owner and a due date attached to each. Those
# two columns are what separates an open question from a note: a question
# nobody owns and nothing dates is not tracked, it is merely written down.

structure:
  - heading:
      pattern: "^# 08 Open Questions.*"
      regex: true
    description: The unresolved questions this spec is proceeding despite.
    allow_additional: true
    children:
      - heading:
          pattern: "^## Open Questions$"
          regex: true
        description: >-
          The open questions, under one heading. Present even when there are
          none — a stated zero is an answer, a missing section is not.

          Every question carries an ID, an owner, a due date and a status;
          without an owner and a date it is a note, not a tracked question. The
          NOTATION is not fixed, because two are in use and each is right for
          what it holds: a table when the questions are one-liners, and one
          subsection per question when a question needs its options, a
          recommendation and what it blocks. Forcing the table onto the second
          form would either drop those fields or state the owner twice.
        allow_additional: true

      - heading:
          pattern: "^## Empty State$"
          regex: true
        description: The stated count when this pack has no open questions.
        optional: true
        allow_additional: true
