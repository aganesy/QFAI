# Document schema: `<specsDir>/spec-NNNN/04_Business-Rules.md`
#
# One BR per independently falsifiable rule, in a table whose reference columns
# are what the traceability reader walks. The required headers are named here
# so a renamed column fails this lane rather than silently emptying a trace.

structure:
  - heading:
      pattern: "^# 04 Business Rules.*"
      regex: true
    description: Acceptance criteria decomposed into falsifiable rules.
    allow_additional: true
    children:
      - heading:
          pattern: "^## Purpose$"
          regex: true
        description: >-
          Why this file exists. Optional: it is an explanatory preamble, and a
          pack that goes straight to its rows is not worse for it.
        optional: true
        allow_additional: true
        lists:
          - min: 1

      - heading:
          pattern: '^## Granularity( \(required\))?$'
          regex: true
        description: >-
          The splitting rule. It is a section rather than a sentence in Purpose
          because `05_Examples.md` pins EX to BR one-to-one: a BR split late is
          a table of examples rewritten.

          Optional, because the rule it states is a property of the pack's rows
          rather than of this document, and restating it in seventeen packs
          gives it seventeen wordings to drift between. The template carries it
          for a pack being written from scratch.
        optional: true
        allow_additional: true
        lists:
          - min: 1

      - heading:
          pattern: "^## Reference Column Conventions$"
          regex: true
        description: How the typed reference columns are read, as a list.
        optional: true
        allow_additional: true
        lists:
          - min: 1

      - heading:
          pattern: '^## Rule Table( \(required\))?$'
          regex: true
        description: >-
          The rules themselves. A table rather than prose because every column
          is read by something: `AC-Refs` by the traceability walker,
          `Contract-Refs` by the contract binder.

          Optional as a SECTION, checked as a table when present. Ten packs
          carry one rule per `## BR-NNNN` section instead, which is a content
          layout rather than a shape defect — converting it is a migration that
          changes what the traceability walker can see, and that is a decision
          about coverage, not about headings.
        optional: true
        allow_additional: true
        tables:
          - min: 1
            required_headers:
              - BR-ID
              - Rule
              - AC-Refs
