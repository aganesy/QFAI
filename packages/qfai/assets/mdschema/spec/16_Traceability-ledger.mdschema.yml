# Document schema: `<specsDir>/spec-NNNN/16_Traceability-ledger.md`
#
# One row per obligation, naming the file that implements it and the file that
# proves it. This document is optional in a pack; when it exists, the ledger
# table is the whole point of it, so the table is not.

structure:
  - heading:
      pattern: "^# 16 Traceability Ledger.*"
      regex: true
    description: Obligation-to-artifact mapping for this spec.
    allow_additional: true
    children:
      - heading:
          pattern: "^## Purpose$"
          regex: true
        description: >-
          What this ledger is for and what it is not. Prose rather than a list
          here: the section has to explain which validator rule fires and when,
          and that is an argument rather than an enumeration.
        allow_additional: true

      - heading:
          pattern: '^## Ledger Table \(required when this file exists\)$'
          regex: true
        description: >-
          The rows. `Implementation File` holds one repository-root-relative
          path, no globs — a glob names a set, and a set cannot be the artifact
          that satisfies a single obligation.
        allow_additional: true
        tables:
          - min: 1
            required_headers:
              - Implementation File
              - Test File
