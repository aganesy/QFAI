# Document schema: <specsDir>/01_policy/initiative.md
heading_rules:
  no_skip_levels: true
  max_depth: 2
structure:
  - heading:
      pattern: "^# Initiative$"
      regex: true
    description: How the project works toward its objective.
    allow_additional: false
    forbidden_text:
      - pattern: '\A\s*[^#\s]'
        regex: true
    children:
      - heading:
          pattern: "^## Initiative$"
          regex: true
        description: What the initiative does, and how it leads to the outcome in objective.md.
        allow_additional: false
        paragraphs:
          min: 1
        forbidden_text:
          - pattern: '(?m)^\s*([-*+]|[0-9]+[.)])\s'
            regex: true
          - pattern: '(?m)^\s*\|'
            regex: true
          - pattern: '(?m)^[ \t]*(?:>|```|~~~)'
            regex: true
          - pattern: '(?m)^[ \t]*(?:(?:-[ \t]*){3,}|(?:\*[ \t]*){3,}|(?:_[ \t]*){3,})$'
            regex: true
          - pattern: '(?:\A(?:[ \t]*\n)*|\n[ \t]*\n)(?: {4}|\t)'
            regex: true
      - heading:
          pattern: "^## Assumptions$"
          regex: true
        description: Conditions the initiative relies on.
        optional: true
        allow_additional: false
        lists:
          - min: 1
        forbidden_text:
          - pattern: '(?m)^[ \t]?[^-\s#]'
            regex: true
          - pattern: '(?:\A|\n[ \t]*\n)\s*(?:[^-\s#]|-\S)'
            regex: true
          - pattern: '(?m)^[ \t]*(?:(?:-[ \t]*){3,}|(?:\*[ \t]*){3,}|(?:_[ \t]*){3,})$'
            regex: true
      - heading:
          pattern: "^## Dependencies$"
          regex: true
        description: Work or external elements the initiative depends on.
        optional: true
        allow_additional: false
        lists:
          - min: 1
        forbidden_text:
          - pattern: '(?m)^[ \t]?[^-\s#]'
            regex: true
          - pattern: '(?:\A|\n[ \t]*\n)\s*(?:[^-\s#]|-\S)'
            regex: true
          - pattern: '(?m)^[ \t]*(?:(?:-[ \t]*){3,}|(?:\*[ \t]*){3,}|(?:_[ \t]*){3,})$'
            regex: true
      - heading:
          pattern: "^## Milestones$"
          regex: true
        description: Milestones and what reaching each one means.
        optional: true
        allow_additional: false
        tables:
          - min: 1
            max: 1
            required_headers: [Milestone, Description]
        forbidden_text:
          - pattern: '(?m)^[ \t]*[^|\s#]'
            regex: true
          - pattern: '\S[^\n]*\n[ \t]*\n[ \t]*\|'
            regex: true
