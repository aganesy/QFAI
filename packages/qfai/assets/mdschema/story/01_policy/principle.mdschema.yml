# Document schema: <specsDir>/01_policy/principle.md
heading_rules:
  no_skip_levels: true
  max_depth: 2
structure:
  - heading:
      pattern: "^# Principles$"
      regex: true
    description: The criteria every decision in this project is judged against.
    allow_additional: false
    forbidden_text:
      - pattern: '\A\s*[^#\s]'
        regex: true
    children:
      - heading:
          pattern: "^## Product / Mission$"
          regex: true
        description: What the product is, and whose problem it solves.
        allow_additional: false
        lists:
          - min: 1
        required_text:
          - pattern: "(?m)^- Summary: "
            regex: true
          - pattern: "(?m)^- Value: "
            regex: true
        forbidden_text:
          - pattern: '(?m)^[^-\s#]'
            regex: true
      - heading:
          pattern: '^## Axioms \(Non-negotiable\)$'
          regex: true
        description: One principle per item that every design must preserve.
        allow_additional: false
        lists:
          - min: 1
        forbidden_text:
          - pattern: '(?m)^[^-\s#]'
            regex: true
      - heading:
          pattern: "^## Decision priorities$"
          regex: true
        description: The order in which concerns win when they conflict, 1 first.
        allow_additional: false
        tables:
          - min: 1
            max: 1
            required_headers: [Priority, Concern, Decision rule]
        forbidden_text:
          - pattern: '(?m)^[^|\s#]'
            regex: true
      - heading:
          pattern: "^## Compatibility vs Change Rubric$"
          regex: true
        description: When existing behaviour is preserved, and when a breaking change is warranted.
        allow_additional: false
        lists:
          - min: 1
        required_text:
          - pattern: "(?m)^- Compatibility: "
            regex: true
          - pattern: "(?m)^- Change: "
            regex: true
        forbidden_text:
          - pattern: '(?m)^[^-\s#]'
            regex: true
