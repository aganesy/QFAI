# Document schema: <specsDir>/decisions.md
heading_rules:
  no_skip_levels: true
  max_depth: 2
structure:
  - heading:
      pattern: "^# Decisions$"
      regex: true
    description: An append-only register; a row is never edited, moved or removed after it is added.
    allow_additional: false
    forbidden_text:
      - pattern: '\A\s*[^#\s]'
        regex: true
    children:
      - heading:
          pattern: "^## Decision pages$"
          regex: true
        optional: true
        description: Unique direct page paths, in the order their rows are read.
        allow_additional: false
        lists:
          - min: 1
            max: 1
        required_text:
          - pattern: '\A(?:[ \t]*\r?\n)*- decisions/page-[0-9]{4}\.md(?:\r?\n(?:[ \t]*\r?\n)*- decisions/page-[0-9]{4}\.md)*(?:\r?\n[ \t]*)*\r?\z'
            regex: true
      - heading:
          pattern: "^## Decisions$"
          regex: true
        description: Exactly one table; the table may have no rows.
        allow_additional: false
        tables:
          - min: 1
            max: 1
            required_headers: [ID, Content, Approach]
        forbidden_text:
          - pattern: '(?m)^[ \t]*[^|\s#]'
            regex: true
          - pattern: '\S[^\n]*\n[ \t]*\n[ \t]*\|'
            regex: true
          - pattern: '(?m)^[ \t]*\|(?:[ \t]*:?-+:?[ \t]*\|){3}[ \t]*:?-'
            regex: true
          - pattern: '\A\s*\|[^\n]*\n[ \t]*\|[^\n]*[^|:\s-]'
            regex: true
