# Document schema: <specsDir>/02_business-flow/business-flows.md
heading_rules:
  no_skip_levels: true
  max_depth: 2
structure:
  - heading:
      pattern: "^# Business Flows$"
      regex: true
    description: The index of the business flows in this tree.
    allow_additional: false
    forbidden_text:
      - pattern: '\A\s*[^#\s]'
        regex: true
    children:
      - heading:
          pattern: "^## Flows$"
          regex: true
        description: One row per flow, in ID order; the table may have no rows.
        allow_additional: false
        tables:
          - min: 1
            max: 1
            required_headers: [BF-ID, Flow, Path]
        forbidden_text:
          - pattern: '(?m)^[^|\s#]'
            regex: true
          - pattern: '(?m)^[ \t]*\|(?:[ \t]*:?-+:?[ \t]*\|){3}[ \t]*:?-'
            regex: true
          - pattern: '\A\s*\|[^\n]*\n[ \t]*\|[^\n]*[^|:\s-]'
            regex: true
