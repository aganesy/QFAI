# Document schema: <specsDir>/02_business-flow/business-flow-NNNN/business-flow.md
heading_rules:
  no_skip_levels: true
  max_depth: 2
structure:
  - heading:
      pattern: "^# BF-[0-9]{4}: .+$"
      regex: true
    description: Flow ID and title.
    allow_additional: false
    forbidden_text:
      - pattern: '\A\s*[^#\s]'
        regex: true
    children:
      - heading:
          pattern: "^## Purpose$"
          regex: true
        description: Who carries out the flow, and the outcome it reaches.
        allow_additional: false
        paragraphs:
          min: 1
        forbidden_text:
          - pattern: '(?m)^\s*([-*+]|[0-9]+[.)])\s'
            regex: true
          - pattern: '(?m)^\s*\|'
            regex: true
          - pattern: '(?m)^\s*(```|~~~)'
            regex: true
      - heading:
          pattern: "^## Flow$"
          regex: true
        description: The main path, as one flowchart or sequence diagram and nothing else.
        allow_additional: false
        code_blocks:
          - lang: mermaid
            min: 1
            max: 1
        forbidden_text:
          # Text before the diagram.
          - pattern: '\A\s*[^`\s]'
            regex: true
          # Text after the diagram's closing fence.
          - pattern: '(?s)\n```[ \t]*\n.*\S'
            regex: true
      - heading:
          pattern: "^## Alternate and exception paths$"
          regex: true
        description: Branches, failures, interruptions and resumptions, one item each.
        allow_additional: false
        lists:
          - min: 1
            max: 1
            min_items: 1
        forbidden_text:
          - pattern: '(?m)^[^-\s]'
            regex: true
