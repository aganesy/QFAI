# Document schema: open-questions.md
structure:
  - heading:
      pattern: "^# Open Questions$"
      regex: true
    description: Required document heading.
    allow_additional: true
    children:
      - heading:
          pattern: "^## Open Questions$"
          regex: true
        description: Open Questions section.
        allow_additional: true
        tables:
          - min: 1
            required_headers:
              - ID
              - Content
              - Approach
              - Status
