# Document schema: <contractsDir>/contracts.md
heading_rules:
  no_skip_levels: true
  max_depth: 2
structure:
  - heading:
      pattern: "^# Contracts$"
      regex: true
    description: The index of every contract in this tree.
    allow_additional: false
    forbidden_text:
      - pattern: '\A\s*[^#\s]'
        regex: true
    children:
      - heading:
          pattern: "^## Contract Index$"
          regex: true
        description: One row per contract, in ID order; the table may have no rows.
        allow_additional: false
        tables:
          - min: 1
            max: 1
            required_headers: [ID, Title, File, Depends On, Reconciled With, Purpose]
        forbidden_text:
          - pattern: '(?m)^[ \t]*[^|\s#]'
            regex: true
          - pattern: '\S[^\n]*\n[ \t]*\n[ \t]*\|'
            regex: true
