# Document schema: `<specsDir>/_policies/10_delta.md`
#
# The policy-layer change ledger. Wider than a spec pack's delta because a
# policy change can retarget several packs at once, which is what the triage
# table's `Existing Spec` column records.

structure:
  - heading:
      pattern: "^# 10 Delta.*"
      regex: true
    description: The policy-layer change ledger.
    allow_additional: true
    children:
      - heading:
          pattern: "^## Change Summary$"
          regex: true
        description: >-
          What changed, when, and why. A list in a fresh tree; a dated table
          once the layer has accreted enough entries that a reader needs to
          sort them. Both say the same thing, so neither is imposed.
        allow_additional: true

      - heading:
          pattern: "^## Triage$"
          regex: true
        description: >-
          Cross-spec triage — the SPLIT / MERGE / SUPERSEDE rows that touch more
          than one pack. Single-pack rows live in that pack's `09_delta.md`.

          Structure only, and deliberately. This is the one document in the set
          that is append-only across the project's whole life, so its run
          sub-sections carry the shape that was current when each run happened —
          a bare table early on, dated `## <date> — <change>` sections with
          `### Triage Table` children later. Pinning one of those shapes here
          would either reject the file's own history or force a rewrite of
          records that are supposed to be immutable. The column contract is
          enforced where the layout IS fixed: `spec-NNNN/09_delta.md`.
        allow_additional: true
