# Document schema: `<specsDir>/_policies/01_Objective.md`
#
# What the product is for. `Success criteria` is a table because a criterion
# without a stated measurement is an aspiration: the `How it is measured`
# column is the part that makes it falsifiable.

structure:
  - heading:
      pattern: "^# 01 Objective.*"
      regex: true
    description: The product objective and how success is measured.
    allow_additional: true
    children:
      - heading:
          pattern: "^## Objective$"
          regex: true
        description: The objective in prose or as a list; either reads.
        allow_additional: true

      - heading:
          pattern: "^## Success criteria$"
          regex: true
        description: Observable outcomes, each with the metric that settles it.
        allow_additional: true
        tables:
          - min: 1
            required_headers:
              - ID
              - Criterion

      - heading:
          pattern: "^## (Out of scope|Scope)$"
          regex: true
        description: >-
          The border, stated. Required: an objective with no stated border is
          one every reader draws differently.

          Two spellings, because two shapes say it equally well. `Out of scope`
          is the template's out-only list. `Scope` is a paired in / out table,
          which is strictly more informative — it says what each exclusion sits
          next to. Demanding the first would force a pack using the second to
          duplicate half its table as prose.
        allow_additional: true
