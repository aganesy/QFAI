route: change-compatibility
family: change
stages:
  - id: sdd
    kind: sdd
    steps: [sdd-triage, sdd-contract, sdd-story, sdd-gate]
    review: spec
  - id: implement
    kind: implement
    steps: [implement-scaffold, implement-tdd]
    after: [sdd]
    review: code
  - id: verify
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
      - verify-qfai-gate
      - verify-repo-gate
    after: [implement]
decisionPoints: [sdd-triage]
branchPoints: []
