route: quarantine-flaky
family: upkeep
stages:
  - id: isolate
    kind: implement
    steps: [implement-quarantine]
  - id: diagnose
    kind: diagnose
    steps: [implement-diagnose]
    after: [isolate]
  - id: fix
    kind: test_fix
    steps:
      - { step: implement-test-fix, passThrough: true }
    after: [diagnose]
  - id: reenable
    kind: verify
    steps: [verify-repeat-run]
    after: [fix]
  - id: note
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
    after: [reenable]
    review: code
  - id: verify
    kind: verify
    steps: [verify-qfai-gate, verify-repo-gate, verify-commit]
    after: [note]
decisionPoints: []
branchPoints:
  - step: implement-diagnose
    outcomes:
      - { outcome: product-race, routes: [fix-intermittent] }
