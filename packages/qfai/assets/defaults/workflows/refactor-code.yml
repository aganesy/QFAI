route: refactor-code
family: change
stages:
  - id: move
    kind: implement
    steps: [implement-refactor]
  - id: tests
    kind: test_fix
    steps:
      - { step: implement-test-fix, passThrough: true }
    after: [move]
    review: code
  - id: verify
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
      - verify-qfai-gate
      - verify-repo-gate
    after: [tests]
decisionPoints: []
branchPoints:
  - step: implement-refactor
    outcomes:
      - { outcome: behaviour-change, routes: [add-feature, change-compatibility] }
