route: change-tooling
family: upkeep
stages:
  - id: edit
    kind: implement
    steps: [implement-tooling]
  - id: note
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
    after: [edit]
    review: code
  - id: verify
    kind: verify
    steps: [verify-qfai-gate, verify-repo-gate, verify-commit]
    after: [note]
decisionPoints: []
branchPoints: []
