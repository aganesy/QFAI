route: revert-culprit
family: upkeep
stages:
  - id: revert
    kind: implement
    steps: [implement-revert]
  - id: spec
    kind: sdd_append
    steps:
      - { step: sdd-story, passThrough: true }
      - sdd-gate
    after: [revert]
    review: spec
  - id: implement
    kind: implement
    steps: [implement-scaffold, implement-tdd]
    after: [spec]
  - id: note
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
    after: [implement]
    review: code
  - id: verify
    kind: verify
    steps: [verify-qfai-gate, verify-repo-gate]
    after: [note]
decisionPoints: []
branchPoints: []
