route: revert-culprit
family: upkeep
stages:
  - id: revert
    kind: implement
    steps: [implement-revert]
  - id: implement
    kind: implement
    steps: [implement-tdd]
    after: [revert]
  - id: note
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
    after: [implement]
    review: code
  - id: verify
    kind: verify
    steps: [verify-qfai-gate, verify-repo-gate, verify-commit]
    after: [note]
decisionPoints: []
branchPoints: []
