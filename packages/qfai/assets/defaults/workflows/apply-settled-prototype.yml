route: apply-settled-prototype
family: change
stages:
  - id: spec
    kind: sdd
    steps:
      - { step: sdd-triage, mode: settled }
      - { step: sdd-story, passThrough: true }
      - { step: sdd-contract, passThrough: true }
      - common-design-md
      - sdd-gate
    review: spec
  - id: prototype
    kind: prototype
    steps: [prototyping-grill, prototyping-preflight, prototyping-loop, prototyping-handoff]
    after: [spec]
  - id: implement
    kind: implement
    steps:
      - { step: implement-scaffold, passThrough: true }
      - { step: implement-tdd, passThrough: true }
    after: [prototype]
  - id: note
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
    after: [implement]
    review: code
  - id: verify
    kind: verify
    steps: [verify-qfai-gate, verify-repo-gate]
    after: [note]
decisionPoints: [sdd-triage, prototyping-loop]
branchPoints:
  - step: sdd-triage
    outcomes:
      - { outcome: outside-record, routes: [decide-design] }
