route: bounded-change
stages:
  - id: sdd-delta
    kind: sdd_delta
    steps:
      - sdd-triage
      - { step: sdd-flow, passThrough: true }
      - sdd-story
      - { step: sdd-contract, passThrough: true }
      - { step: common-design-md, passThrough: true }
      - sdd-gate
  - id: acceptance
    kind: acceptance
    steps:
      - atdd-scaffold
      - { step: atdd-credentials, passThrough: true }
      - { step: atdd-author, passThrough: true }
    after: [sdd-delta]
  - id: implement
    kind: implement
    steps: [implement-tdd, implement-checkpoint]
    after: [acceptance]
  - id: verify
    kind: verify
    steps: [verify-context, verify-qfai-gate, verify-repo-gate]
    after: [implement]
