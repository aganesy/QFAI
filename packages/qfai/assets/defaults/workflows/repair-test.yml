route: repair-test
family: upkeep
stages:
  - id: diagnose
    kind: diagnose
    steps: [implement-diagnose]
  - id: fix
    kind: test_fix
    steps:
      - { step: atdd-test-fix, passThrough: true }
      - { step: implement-test-fix, passThrough: true }
    after: [diagnose]
  - id: verify
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
      - verify-context
      - verify-qfai-gate
      - verify-repo-gate
    after: [fix]
defaultModifiers: []
decisionPoints: []
branchPoints: []
