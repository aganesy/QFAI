route: investigate-question
family: close
stages:
  - id: investigate
    kind: triage
    steps: [triage-investigate]
  - id: answer
    kind: triage
    steps: [triage-answer]
    after: [investigate]
  - id: close
    kind: triage
    steps: [triage-close]
    after: [answer]
defaultModifiers: []
decisionPoints: []
branchPoints:
  - step: triage-investigate
    outcomes:
      - { outcome: defect-found, routes: decision-table }
