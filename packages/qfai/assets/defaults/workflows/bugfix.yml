route: bugfix
stages:
  - id: diagnose
    kind: diagnose
    steps: [implement-diagnose]
  - id: sdd-append
    kind: sdd_append
    steps:
      - { step: sdd-story, passThrough: true }
      - sdd-gate
    after: [diagnose]
  - id: acceptance
    kind: acceptance
    steps:
      - atdd-scaffold
      - { step: atdd-credentials, passThrough: true }
      - { step: atdd-author, passThrough: true }
    after: [sdd-append]
  - id: implement
    kind: implement
    steps: [implement-tdd, implement-checkpoint]
    after: [acceptance]
  - id: regression-fix
    kind: regression_fix
    steps: [implement-regression-fix]
    after: [diagnose]
  - id: test-fix
    kind: test_fix
    steps:
      - { step: atdd-test-fix, passThrough: true }
      - { step: implement-test-fix, passThrough: true }
    after: [diagnose]
  - id: verify
    kind: verify
    steps: [verify-context, verify-qfai-gate, verify-repo-gate]
    after: [implement, regression-fix, test-fix]
