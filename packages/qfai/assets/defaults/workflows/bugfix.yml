route: bugfix
stages:
  - id: diagnose
    kind: diagnose
    skill: qfai-implement
    operation: diagnose-only
    when: always
  - id: sdd-append
    kind: sdd_append
    skill: qfai-sdd
    operation: defect-example-seeding
    when: missing_example_needed
    after: [diagnose]
  - id: acceptance
    kind: acceptance
    skill: qfai-atdd
    operation: author-acceptance-tests
    when: acceptance_obligations_unmet
    after: [sdd-append]
  - id: implement
    kind: implement
    skill: qfai-implement
    operation: implement
    when: diagnosis_missing_test
    after: [acceptance]
  - id: regression-fix
    kind: regression_fix
    skill: qfai-implement
    operation: regression-fix
    when: regression_found
    after: [diagnose]
  - id: test-fix
    kind: test_fix
    skill: [qfai-atdd, qfai-implement]
    operation: test-fix
    when: test_defect_found
    after: [diagnose]
  - id: verify
    kind: verify
    skill: qfai-verify
    operation: verify-full
    when: always
    after: [implement, regression-fix, test-fix]
