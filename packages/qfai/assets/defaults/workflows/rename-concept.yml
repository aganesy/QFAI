route: rename-concept
family: change
stages:
  - id: spec
    kind: sdd
    steps:
      - sdd-triage
      - { step: sdd-flow, passThrough: true }
      - { step: sdd-story, passThrough: true }
      - { step: sdd-contract, passThrough: true }
    review: spec
  - id: rename
    kind: implement
    steps: [implement-refactor]
    after: [spec]
  - id: note
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
    after: [rename]
    review: code
  - id: verify
    kind: verify
    steps: [verify-qfai-gate, verify-repo-gate, verify-commit]
    after: [note]
decisionPoints: [sdd-triage]
branchPoints:
  - step: implement-refactor
    outcomes:
      - { outcome: behaviour-change, routes: [add-feature, change-compatibility] }
