route: retire-feature
family: change
stages:
  - id: spec
    kind: sdd
    steps:
      - sdd-triage
      - sdd-story
      - { step: sdd-contract, passThrough: true }
    review: spec
  - id: remove
    kind: implement
    steps: [implement-retire]
    after: [spec]
  - id: note
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
    after: [remove]
    review: code
  - id: verify
    kind: verify
    steps: [verify-qfai-gate, verify-repo-gate, verify-commit]
    after: [note]
decisionPoints: [sdd-triage]
branchPoints: []
