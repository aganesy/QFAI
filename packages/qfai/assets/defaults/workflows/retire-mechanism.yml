route: retire-mechanism
family: consistency
stages:
  - id: diagnose
    kind: diagnose
    steps: [implement-diagnose]
  - id: decide
    kind: sdd
    steps: [sdd-triage]
    after: [diagnose]
  - id: remove
    kind: implement
    steps: [implement-retire]
    after: [decide]
  - id: note
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
    after: [remove]
    review: code
  - id: verify
    kind: verify
    steps: [verify-qfai-gate, verify-repo-gate]
    after: [note]
decisionPoints: [sdd-triage]
branchPoints: []
