route: feature
stages:
  - id: sdd
    kind: sdd
    steps:
      - sdd-triage
      - sdd-flow
      - sdd-story
      - sdd-contract
      - { step: common-design-md, passThrough: true }
      - sdd-cycle
      - sdd-gate
  - id: prototype
    kind: prototype
    steps: [prototyping-grill, prototyping-preflight, prototyping-loop, prototyping-handoff]
    after: [sdd]
  - id: acceptance
    kind: acceptance
    steps:
      - atdd-scaffold
      - { step: atdd-credentials, passThrough: true }
      - { step: atdd-author, passThrough: true }
    after: [prototype]
  - id: implement
    kind: implement
    steps: [implement-tdd, implement-checkpoint]
    after: [acceptance]
  - id: verify
    kind: verify
    steps: [verify-context, verify-qfai-gate, verify-repo-gate]
    after: [implement]
