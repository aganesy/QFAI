route: hand-off-operation
family: release
stages:
  - id: inspect
    kind: diagnose
    steps:
      - { step: implement-diagnose, mode: read-only }
  - id: handoff
    kind: triage
    steps: [triage-handoff]
    after: [inspect]
  - id: close
    kind: triage
    steps: [triage-close]
    after: [handoff]
decisionPoints: []
releasePoint: triage-handoff
branchPoints: []
