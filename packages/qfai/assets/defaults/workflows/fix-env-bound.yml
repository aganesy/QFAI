route: fix-env-bound
family: fix
stages:
  - id: collect
    kind: triage
    steps: [triage-request-info]
  - id: diagnose
    kind: diagnose
    steps: [implement-diagnose]
    after: [collect]
  - id: spec
    kind: sdd_append
    steps:
      - { step: sdd-story, passThrough: true }
      - sdd-gate
    after: [diagnose]
    review: spec
  - id: implement
    kind: implement
    steps: [implement-scaffold, implement-tdd]
    after: [spec]
    review: code
  - id: verify
    kind: verify
    steps:
      - { step: verify-change-note, passThrough: true }
      - verify-qfai-gate
      - verify-repo-gate
    after: [implement]
  - id: confirm
    kind: verify
    steps: [verify-external]
    after: [verify]
decisionPoints: []
branchPoints:
  - step: implement-diagnose
    outcomes:
      - { outcome: as-specified, routes: [answer-question] }
      - { outcome: not-ours, routes: [close-no-change] }
      - { outcome: duplicate, routes: [close-duplicate] }
      - { outcome: needs-info, routes: [request-info] }
      - { outcome: expectation-differs, routes: [decide-design] }
      - { outcome: defective-test, routes: [repair-test] }
      - { outcome: regression, routes: [fix-red-main] }
      - { outcome: surface-conflict, routes: [repair-consistency] }
