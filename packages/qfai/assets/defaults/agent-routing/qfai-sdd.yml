# Routing defaults for the `qfai-sdd` steps.
# `_contract.yml` states what every file in this directory holds.

routing:
  # `requirements-analyst` writes the triage decision rows the planner judges,
  # so a `REVISE` has to reach the author: under `failed-agents-only` only the
  # planner would re-run, re-reading an unchanged table.
  - step: sdd-triage
    phases:
      - id: slice-and-scope
        mandatory_agents: [delivery-planner, requirements-analyst]
        conditional_agents: []
        parallel_groups: []
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: sdd-flow
    phases:
      - id: design
        mandatory_agents: [solution-architect, requirements-analyst]
        conditional_agents: [product-experience-architect]
        parallel_groups: []
        rerun_policy: changed-scope-dependents
    review_profile: default

  # `product-experience-architect` joins exactly when the target flow is
  # UI-bearing. The flow's surface decides, never which files the run edited.
  # This key says which agent may join, never whether it may be skipped.
  - step: sdd-story
    phases:
      - id: design
        mandatory_agents: [requirements-analyst, test-design-analyst]
        conditional_agents: [qa-strategist, product-experience-architect]
        parallel_groups: []
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: sdd-contract
    phases:
      - id: design
        mandatory_agents: [solution-architect]
        conditional_agents: [test-design-analyst, product-experience-architect]
        parallel_groups: []
        rerun_policy: changed-scope-dependents
    review_profile: default

  # Examples are the concrete side and business rules the abstract side, so
  # both authors re-run with every cycle.
  - step: sdd-cycle
    phases:
      - id: design
        mandatory_agents: [requirements-analyst, solution-architect]
        conditional_agents: [test-design-analyst]
        parallel_groups: []
        rerun_policy: changed-scope-dependents
    review_profile: default
