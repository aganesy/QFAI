        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: implement-stress-harness
    phases:
      - id: harness
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: [frontend-engineer, backend-engineer]
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, qa-gatekeeper]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  # Which inputs the parity check covers is a test design call.
  - step: implement-oracle-parity
    phases:
      - id: parity
        mandatory_agents: [test-design-analyst]
        conditional_agents: [frontend-engineer, backend-engineer, devops-ci-engineer]
        parallel_groups: []
        blocking_agents: [test-design-analyst]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, qa-gatekeeper]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  # Measures twice under the same conditions; changes no tracked file.
  - step: implement-benchmark
    phases:
      - id: measure
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: [qa-strategist]
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, qa-gatekeeper]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  # The gatekeeper observes the suite green before and after the moves.
  - step: implement-refactor
    phases:
