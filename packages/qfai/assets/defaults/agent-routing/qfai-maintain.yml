# Routing defaults for the `qfai-maintain` steps.
# `_contract.yml` states what every file in this directory holds.

routing:
  - step: maintain-edit
    phases:
      - id: edit
        mandatory_agents: [doc-steward]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
    review_profile: default
