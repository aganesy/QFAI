# Routing defaults for the `qfai-verify` steps.
# `_contract.yml` states what every file in this directory holds.

routing:
  # No review of its own: the gate steps after it are reviewed.
  - step: verify-context
    phases:
      - id: plan
        mandatory_agents: [delivery-planner, qa-strategist]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [delivery-planner]
        rerun_policy: failed-agents-only

  - step: verify-qfai-gate
    phases:
      - id: execution
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [qa-gatekeeper]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - step: verify-repo-gate
    phases:
      - id: execution
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [qa-gatekeeper]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - step: verify-change-note
    phases:
      - id: note
        mandatory_agents: [doc-steward]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: verify-repeat-run
    phases:
      - id: execution
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [qa-gatekeeper]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - step: verify-external
    phases:
      - id: request
        mandatory_agents: [qa-strategist]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: verify-manual
    phases:
      - id: check
        mandatory_agents: [qa-strategist]
        conditional_agents: [devops-ci-engineer]
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: verify-advisory
    phases:
      - id: draft
        mandatory_agents: [doc-steward]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: verify-release-notes
    phases:
      - id: draft
        mandatory_agents: [doc-steward]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: verify-commit
    phases:
      - id: commit
        mandatory_agents: []
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
    review_profile: default
