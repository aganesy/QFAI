# Routing defaults for the skills that are not split into steps.
# `_contract.yml` states what every file in this directory holds.

routing:
  - skill: qfai-migration-v1-to-v2
    phases:
      - id: plan
        mandatory_agents: [requirements-analyst, solution-architect]
        conditional_agents: []
        parallel_groups: []
        rerun_policy: failed-agents-only
      - id: execution
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: []
        parallel_groups: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [architecture-reviewer]
        conditional_agents: []
        parallel_groups: []
        rerun_policy: changed-scope-dependents
    review_profile: architecture-heavy

  - skill: qfai-configure
    phases:
      - id: analysis
        mandatory_agents: [delivery-planner, qa-strategist]
        conditional_agents: []
        parallel_groups: []
        rerun_policy: failed-agents-only
      - id: config
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: []
        parallel_groups: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [qa-gatekeeper]
        conditional_agents: []
        parallel_groups: []
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  # The entry skill only orchestrates: it drafts and reviews nothing, so it
  # routes no author and no reviewer, and names no review profile. Each stage
  # it hands work to brings its own.
  - skill: qfai-run
    phases:
      - id: route
        mandatory_agents: [orchestrator]
        conditional_agents: []
        parallel_groups: []
        rerun_policy: changed-scope-dependents
