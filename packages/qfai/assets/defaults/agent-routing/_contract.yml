schema_version: "1.0"

# The package's routing defaults are every `*.yml` file in this directory, read
# in file-name order and joined into one `routing:` list. Each file holds the
# entries of one owner: a parent skill's steps (`<skill>.yml`), the `common-*`
# steps (`common.yml`), or the skills that are not split into steps
# (`skills.yml`). A step or skill name appears in one file only. A file stays
# within the line ceiling of an assistant asset; one that approaches it is split
# again rather than raised.
#
# One entry per executor unit. A `- step: <name>` entry routes a step under
# `.qfai/assistant/step/<name>/STEP.md`; a `- skill: <name>` entry routes a
# skill that is not split into steps. A parent skill that runs steps has no
# entry of its own: each of its steps carries its agents and its review
# profile, and the parent runs the one review it names after its last step.
#
# Contract with each entry's `roles:` frontmatter — the step's `STEP.md` or
# the skill's `SKILL.md` (validated by `QFAI-AGENT-015` .. `QFAI-AGENT-019`):
#
# `roles:` is the closed set of agents the step or skill may dispatch, so it
# must be a SUPERSET of every agent the routing defaults bind to it —
# `mandatory_agents`, `conditional_agents`, `blocking_agents` and
# `parallel_groups` across all of its phases — plus every reviewer its
# `review_profile` selects. A missing `mandatory_agents` / `blocking_agents`
# entry, or a missing `always_required` reviewer of that profile, is an error:
# the run cannot finish without dispatching a role it never declared. A missing
# `conditional_agents` / `parallel_groups` / `conditional_required` entry is a
# warning.
#
# The reverse also holds: a declared role that neither the routing defaults nor
# the review profile selects is a stale grant and is reported. The one exception
# is `orchestrator`, the invoking agent, which
# `.qfai/assistant/rule/shared-skill-delegation-baseline.md` governs instead of
# any routing phase.
#
# Both directions need a `roles:` list to compare, so a `roles:` key that is
# not a list of agent ids is an error rather than "no declaration"
# (`QFAI-AGENT-016`). A step or skill that declares `routing-profile:` but that
# no routing file routes anything to is an error too (`QFAI-AGENT-017`): a
# deleted or misspelled entry — or one left with no usable `phases:` — leaves a
# unit that can dispatch no one. One that declares no `routing-profile:` is
# exempt: a step with no review of its own (`verify-context`, `atdd-scaffold`)
# and the deliberately un-routed `web-research`.
# That `routing-profile:` must also name the same profile the entry's
# `review_profile:` gives it, and one `review-profiles.yml` defines
# (`QFAI-AGENT-018`): otherwise the two sides state different review gates.
# Both keys must be a non-empty profile name when present — a list or an empty
# value is a shape error (`QFAI-AGENT-013` here, `QFAI-AGENT-016` in the
# frontmatter) rather than "no gate declared". Whenever the gate is in any of
# those states, the roles cross-check above is skipped for that entry: the
# reviewer set it would compare against is known to be partial.
#
# Every entry with a `review_profile` has a `review` phase whose
# `mandatory_agents` and `blocking_agents` hold the profile's `always_required`
# reviewers (`scripts/check-review-profile-consistency.mjs`).
#
# A project overrides an entry whole in `qfai.config.yaml#routing`, keyed by
# the same `step:` or `skill:` name.
#
# `rerun_policy` vocabulary (validated by `QFAI-AGENT-013`):
#
# - `failed-agents-only`        re-run only the agents that did not return PASS
# - `changed-scope-dependents`  re-run every agent whose inputs the change
#                               touched, including ones that passed
#
# A key that is defined nowhere and read by nothing hides its own typos, which is
# why the vocabulary is validated. `.qfai/assistant/rule/drift-protocol.md`
# step 4 uses the same vocabulary when a Change Request names its rerun mode.

routing: []
