schema_version: "1.0"

profiles:
  default:
    always_required: [completion-reviewer]
    conditional_required: []
  requirements-heavy:
    always_required: [completion-reviewer, requirements-reviewer]
    conditional_required: []
  architecture-heavy:
    always_required: [completion-reviewer, architecture-reviewer]
    conditional_required: []
  ui-bearing:
    always_required: [completion-reviewer, product-surface-reviewer]
    conditional_required: []
  runtime-heavy:
    always_required: [completion-reviewer, qa-gatekeeper]
    conditional_required: [implementation-reviewer]
  # The steps that change production code (`implement-tdd`,
  # `implement-regression-fix`, `implement-seam`) make an `implementation-reviewer`
  # PASS part of their completion gate, so for them the code-quality review is
  # always required and always blocking. The other `runtime-heavy` users — the
  # atdd, verify and test-running steps and qfai-configure — keep that reviewer
  # genuinely conditional, hence a profile of its own rather than widening
  # runtime-heavy for all of them.
  implementation-heavy:
    always_required: [completion-reviewer, qa-gatekeeper, implementation-reviewer]
    conditional_required: []

optional_modes:
  devils-advocate:
    kind: advisory
    description: Challenge assumptions aggressively, but do not block completion by default.
    alternative_required: true
    bare_negation_invalid: true
  pattern-doubler:
    kind: advisory
    description: Propose missing concrete business-flow, story, acceptance-criterion, or example coverage with rationale; do not demand more abstract rules or numeric targets.
    rationale_required: true
