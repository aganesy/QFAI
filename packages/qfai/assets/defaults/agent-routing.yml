schema_version: "1.0"

# One entry per executor unit. A `- step: <name>` entry routes a step under
# `.qfai/assistant/step/<name>/STEP.md`; a `- skill: <name>` entry routes a
# skill that is not split into steps. A parent skill that runs steps has no
# entry of its own: each of its steps carries its agents and its review
# profile, and a run reviews the union of the steps it ran.
#
# Contract with each entry's `roles:` frontmatter — the step's `STEP.md` or
# the skill's `SKILL.md` (validated by `QFAI-AGENT-015` .. `QFAI-AGENT-019`):
#
# `roles:` is the closed set of agents the step or skill may dispatch, so it
# must be a SUPERSET of every agent this manifest binds to it —
# `mandatory_agents`, `conditional_agents`, `blocking_agents` and
# `parallel_groups` across all of its phases — plus every reviewer its
# `review_profile` selects. A missing `mandatory_agents` / `blocking_agents`
# entry, or a missing `always_required` reviewer of that profile, is an error:
# the run cannot finish without dispatching a role it never declared. A missing
# `conditional_agents` / `parallel_groups` / `conditional_required` entry is a
# warning.
#
# The reverse also holds: a declared role that neither this manifest nor the
# review profile selects is a stale grant and is reported. The one exception is
# `orchestrator`, the invoking agent, which
# `.qfai/assistant/rule/shared-skill-delegation-baseline.md` governs instead of
# any routing phase.
#
# Both directions need a `roles:` list to compare, so a `roles:` key that is
# not a list of agent ids is an error rather than "no declaration"
# (`QFAI-AGENT-016`). A step or skill that declares `routing-profile:` but that
# this file routes nothing to is an error too (`QFAI-AGENT-017`): a deleted or
# misspelled entry — or one left with no usable `phases:` — leaves a unit that
# can dispatch no one. One that declares no `routing-profile:` is exempt: a
# step with no review of its own (`verify-context`, `atdd-scaffold`) and the
# deliberately un-routed `web-research`.
# That `routing-profile:` must also name the same profile this file's
# `review_profile:` gives the entry, and one `review-profiles.yml` defines
# (`QFAI-AGENT-018`): otherwise the two sides state different review gates.
# Both keys must be a non-empty profile name when present — a list or an empty
# value is a shape error (`QFAI-AGENT-013` here, `QFAI-AGENT-016` in the
# frontmatter) rather than "no gate declared". Whenever the gate is in any of
# those states, the roles cross-check above is skipped for that entry: the
# reviewer set it would compare against is known to be partial.
#
# Every entry with a `review_profile` has a `review` phase whose
# `mandatory_agents` and `blocking_agents` hold the profile's `always_required`
# reviewers (`scripts/check-review-profile-consistency.mjs`).
#
# A project overrides an entry whole in `qfai.config.yaml#routing`, keyed by
# the same `step:` or `skill:` name.

routing:
  # --- qfai-discussion ------------------------------------------------------

  # `discovery-analyst` owns `.qfai/assistant/rule/research-first-protocol.md`
  # and is mandatory in this step's framing phase.
  - step: discussion-research
    phases:
      - id: preflight
        mandatory_agents: [delivery-planner]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [delivery-planner]
        rerun_policy: failed-agents-only
      - id: framing
        mandatory_agents: [discovery-analyst]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [discovery-analyst]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  # `product-experience-architect` joins for the design-DNA intake, which
  # applies when a classified surface is `web`, `mobile`, `desktop` or `mixed`.
  - step: discussion-interview
    phases:
      - id: framing
        mandatory_agents: [discovery-analyst, requirements-analyst]
        conditional_agents: [solution-architect, product-experience-architect]
        parallel_groups: []
        blocking_agents: [requirements-analyst]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, requirements-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer, requirements-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: requirements-heavy

  - step: discussion-pack
    phases:
      - id: framing
        mandatory_agents: [requirements-analyst]
        conditional_agents: [solution-architect, product-experience-architect]
        parallel_groups: []
        blocking_agents: [requirements-analyst]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, requirements-reviewer]
        conditional_agents: [architecture-reviewer]
        parallel_groups: []
        blocking_agents: [completion-reviewer, requirements-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: requirements-heavy

  - step: discussion-oq
    phases:
      - id: framing
        mandatory_agents: [requirements-analyst]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [requirements-analyst]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, requirements-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer, requirements-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: requirements-heavy

  - step: discussion-uiux
    phases:
      - id: framing
        mandatory_agents: [product-experience-architect]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [product-experience-architect]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, product-surface-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer, product-surface-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: ui-bearing

  # --- qfai-sdd -------------------------------------------------------------

  # `requirements-analyst` writes the triage decision rows the planner judges,
  # so a `REVISE` has to reach the author: under `failed-agents-only` only the
  # planner would re-run, re-reading an unchanged table.
  - step: sdd-triage
    phases:
      - id: slice-and-scope
        mandatory_agents: [delivery-planner, requirements-analyst]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [delivery-planner]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: sdd-flow
    phases:
      - id: design
        mandatory_agents: [solution-architect, requirements-analyst]
        conditional_agents: [product-experience-architect]
        parallel_groups: []
        blocking_agents: [solution-architect]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  # `product-experience-architect` joins exactly when the target flow is
  # UI-bearing. The flow's surface decides, never which files the run edited.
  # This key says which agent may join, never whether it may be skipped.
  - step: sdd-story
    phases:
      - id: design
        mandatory_agents: [requirements-analyst, test-design-analyst]
        conditional_agents: [qa-strategist, product-experience-architect]
        parallel_groups: []
        blocking_agents: [requirements-analyst]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: sdd-contract
    phases:
      - id: design
        mandatory_agents: [solution-architect]
        conditional_agents: [test-design-analyst, product-experience-architect]
        parallel_groups: []
        blocking_agents: [solution-architect]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, architecture-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer, architecture-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: architecture-heavy

  # Examples are the concrete side and business rules the abstract side, so
  # both authors re-run with every cycle.
  - step: sdd-cycle
    phases:
      - id: design
        mandatory_agents: [requirements-analyst, solution-architect]
        conditional_agents: [test-design-analyst]
        parallel_groups: []
        blocking_agents: [solution-architect]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: sdd-gate
    phases:
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: [qa-gatekeeper]
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  # --- qfai-prototyping -----------------------------------------------------

  - step: prototyping-grill
    phases:
      - id: seed
        mandatory_agents: [product-experience-architect]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [product-experience-architect]
        rerun_policy: failed-agents-only
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: prototyping-preflight
    phases:
      - id: seed
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: [product-experience-architect]
        parallel_groups: []
        blocking_agents: []
        rerun_policy: failed-agents-only
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  # One prototype lineage per spec and screen pair, cycles 0 to 9, judged on
  # the ordinal axes, the impressions, layout anti-patterns and DESIGN.md token
  # violations.
  - step: prototyping-loop
    phases:
      - id: seed
        mandatory_agents: [product-experience-architect]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [product-experience-architect]
        rerun_policy: failed-agents-only
      - id: loop
        mandatory_agents:
          [devops-ci-engineer, product-surface-reviewer, product-experience-architect]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [product-surface-reviewer]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, product-surface-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer, product-surface-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: ui-bearing

  - step: prototyping-handoff
    phases:
      - id: handoff
        mandatory_agents: [product-experience-architect]
        conditional_agents: [devops-ci-engineer]
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, product-surface-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer, product-surface-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: ui-bearing

  - step: prototyping-recover
    phases:
      - id: recover
        mandatory_agents: [product-experience-architect]
        conditional_agents: [devops-ci-engineer]
        parallel_groups: []
        blocking_agents: [product-experience-architect]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  # --- qfai-verify ----------------------------------------------------------

  # No review of its own: the gate steps after it are reviewed.
  - step: verify-context
    phases:
      - id: plan
        mandatory_agents: [delivery-planner, qa-strategist]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [delivery-planner]
        rerun_policy: failed-agents-only

  - step: verify-qfai-gate
    phases:
      - id: execution
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [qa-gatekeeper, completion-reviewer]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - step: verify-repo-gate
    phases:
      - id: execution
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [qa-gatekeeper, completion-reviewer]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - step: verify-change-note
    phases:
      - id: note
        mandatory_agents: [doc-steward]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: verify-repeat-run
    phases:
      - id: execution
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [qa-gatekeeper, completion-reviewer]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - step: verify-external
    phases:
      - id: request
        mandatory_agents: [qa-strategist]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: verify-manual
    phases:
      - id: check
        mandatory_agents: [qa-strategist]
        conditional_agents: [devops-ci-engineer]
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: verify-advisory
    phases:
      - id: draft
        mandatory_agents: [doc-steward]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  - step: verify-release-notes
    phases:
      - id: draft
        mandatory_agents: [doc-steward]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  # --- qfai-atdd ------------------------------------------------------------

  # No review of its own: the authoring step after it is reviewed.
  - step: atdd-scaffold
    phases:
      - id: coverage
        mandatory_agents: [test-design-analyst, qa-strategist]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [test-design-analyst]
        rerun_policy: failed-agents-only

  - step: atdd-author
    phases:
      # `qa-gatekeeper` confirms the RED while nothing makes the assertion
      # pass, so this phase sits before `implementation`: after the surfaces
      # are built there is nothing left to watch fail.
      #
      # `delivery-planner` is blocking ahead of `qa-gatekeeper`: it is the only
      # authority on whether a selector covers a sufficient slice of its
      # obligation, and a scope REVISE is settled before the RED is submitted.
      #
      # `qa-gatekeeper` is conditional: it judges the rows that have evidence at
      # this gate. A row whose falsifiability evidence is produced later would
      # otherwise stop the run on the absence of what the gate is the reason
      # for. It stays blocking: when it is routed, its verdict decides.
      #
      # `per-ledger-item`: one deliberate RED at a time, each seen by the
      # gatekeeper in its own RED state.
      #
      # `changed-scope-dependents`: a planner REVISE is repaired by the test
      # author splitting the test, and the gatekeeper then judges the new RED.
      - id: red
        iteration: per-ledger-item
        mandatory_agents: [delivery-planner, acceptance-test-engineer]
        conditional_agents: [qa-gatekeeper]
        parallel_groups: []
        blocking_agents: [delivery-planner, qa-gatekeeper]
        rerun_policy: changed-scope-dependents
      - id: implementation
        mandatory_agents: [acceptance-test-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: evidence
        mandatory_agents: []
        conditional_agents: [devops-ci-engineer, qa-gatekeeper]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, qa-gatekeeper]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - step: atdd-test-fix
    phases:
      - id: implementation
        mandatory_agents: [acceptance-test-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: evidence
        mandatory_agents: []
        conditional_agents: [devops-ci-engineer, qa-gatekeeper]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, qa-gatekeeper]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - step: atdd-credentials
    phases:
      - id: implementation
        mandatory_agents: [acceptance-test-engineer]
        conditional_agents: [devops-ci-engineer]
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  # --- qfai-implement -------------------------------------------------------

  # Reproduces and locates the cause; changes no code. The verdict names the
  # layer a missing or defective test belongs to, which is the test design
  # owner's call.
  - step: implement-diagnose
    phases:
      - id: diagnose
        mandatory_agents: [test-design-analyst, devops-ci-engineer]
        conditional_agents: [frontend-engineer, backend-engineer]
        parallel_groups: []
        blocking_agents: [test-design-analyst]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  # `parallel_groups` describes ROLE FAN-OUT within a phase, not item
  # dispatch. `iteration` says how often a phase runs: the TDD micro-cycle goes
  # one ledger row at a time, so `red`, `build` and `test` run once per row,
  # and `qa-gatekeeper` observes each RED before production code exists and
  # each GREEN after. The review runs once, at the end of the stage.
  - step: implement-tdd
    phases:
      # Once, before any ledger row is touched: `delivery-planner` frames the
      # invocation and blocks it when the plan is wrong; `test-design-analyst`
      # reports coverage and layer-ownership findings. A planner REVISE
      # changes the ledger the analyst read, so both re-run.
      - id: plan
        iteration: per-invocation
        mandatory_agents: [delivery-planner, test-design-analyst]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [delivery-planner]
        rerun_policy: changed-scope-dependents
      # The walking skeleton: its exit criterion is that the product runs, and
      # `qa-gatekeeper` is the only judge of an execution result, so it is
      # mandatory and blocking. The production owners author the entrypoint
      # and the smoke script; `devops-ci-engineer` supplies and verifies the
      # start command. Which owner applies depends on where the entrypoint
      # lives.
      - id: skeleton
        iteration: per-invocation
        mandatory_agents: [qa-gatekeeper]
        conditional_agents: [frontend-engineer, backend-engineer, devops-ci-engineer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
      # The failing test exists and no production code does: the only window in
      # which "watch it fail" is a first-hand observation. The production
      # owners are conditional because a new-surface row needs its minimal seam
      # before its failure is an assertion rather than a 404. A gatekeeper
      # REVISE here is usually about that seam, so its author re-runs with it.
      - id: red
        iteration: per-ledger-item
        mandatory_agents: []
        conditional_agents: [qa-gatekeeper, frontend-engineer, backend-engineer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
      - id: build
        iteration: per-ledger-item
        mandatory_agents: [qa-gatekeeper]
        conditional_agents: [frontend-engineer, backend-engineer]
        parallel_groups:
          - [frontend-engineer, backend-engineer]
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
      # `acceptance-test-engineer` is not listed: acceptance tests belong to the
      # `atdd-*` steps, and this step does not author them.
      - id: test
        iteration: per-ledger-item
        mandatory_agents: []
        conditional_agents: [qa-strategist]
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      # Once, over every example the stage implemented. `product-surface-reviewer`
      # joins exactly when one of them is UI-affecting.
      - id: review
        iteration: per-invocation
        mandatory_agents: [implementation-reviewer, qa-gatekeeper, completion-reviewer]
        conditional_agents: [product-surface-reviewer]
        parallel_groups: []
        blocking_agents: [implementation-reviewer, qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: implementation-heavy

  # An existing correct test already fails, so there is no RED to take: the
  # fix is built and the gatekeeper observes the test pass.
  - step: implement-regression-fix
    phases:
      - id: build
        mandatory_agents: [qa-gatekeeper]
        conditional_agents: [frontend-engineer, backend-engineer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [implementation-reviewer, qa-gatekeeper, completion-reviewer]
        conditional_agents: [product-surface-reviewer]
        parallel_groups: []
        blocking_agents: [implementation-reviewer, qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: implementation-heavy

  - step: implement-test-fix
    phases:
      - id: fix
        mandatory_agents: []
        conditional_agents: [frontend-engineer, backend-engineer]
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, qa-gatekeeper]
        conditional_agents: [implementation-reviewer]
