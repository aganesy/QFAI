# QFAI-CONTRACT-ID: CON-UI-0001
prototype:
  mode: interactive
  mockPaths:
    - id: mp_create_to_list
      flow: create -> list reflects
  markers:
    - id: mk_order_create_form
      selector: "[data-qfai='order-create-form']"
      purpose: create form root marker
screens:
  - id: order_list
    title: Orders
    route: /orders
    elements:
      - id: order_list_search_input
        label: Search
        type: input
        required: false
        validations: []
      - id: order_list_table
        label: Orders table
        type: table
        required: true
        validations:
          - must render table header and one row placeholder
      - id: order_list_create_button
        label: Create order
        type: button
        required: true
        validations: []
    actions:
      - id: open_order_create
        label: Open create form
        kind: navigate
        effect: navigates to /orders/new
  - id: order_create
    title: Create Order
    route: /orders/new
    elements:
      - id: order_create_customer_id_input
        label: Customer ID
        type: input
        required: true
        validations:
          - must be non-empty
      - id: order_create_submit_button
        label: Submit
        type: button
        required: true
        validations: []
    actions:
      - id: submit_order_create
        label: Submit order
        kind: submit
        effect: navigates to /orders and shows the newly created row
