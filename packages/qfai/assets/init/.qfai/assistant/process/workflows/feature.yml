route: feature
stages:
  - id: sdd
    kind: sdd
    skill: qfai-sdd
    operation: new-capability
    when: always
  - id: prototype
    kind: prototype
    skill: qfai-prototyping
    operation: existing-runtime-contract
    when: prototype_decision_needed
    after: [sdd]
  - id: acceptance
    kind: acceptance
    skill: qfai-atdd
    operation: author-acceptance-tests
    when: acceptance_obligations_unmet
    after: [prototype]
  - id: implement
    kind: implement
    skill: qfai-implement
    operation: implement
    when: always
    after: [acceptance]
  - id: verify
    kind: verify
    skill: qfai-verify
    operation: verify-full
    when: always
    after: [implement]
