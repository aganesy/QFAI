schema_version: "1.0"

required:
  shared:
    - Objective
    - Initiative
    - Capabilities
    - BusinessFlow
  spec:
    - Spec
    - UserStories
    - AcceptanceCriteria
    - BusinessRules
    - Examples
    - TestCases

optional:
  shared:
    - Contracts
    - Glossary
    - Constraints
    - Decisions
    - OpenQuestions
    - Delta
  spec:
    - Decisions
    - OpenQuestions
    - Delta

reviewers:
  minimum: 3
  required:
    - id: qa-lead
      role: Quality Lead
    - id: qa-gatekeeper
      role: QA Gatekeeper
    - id: reviewer
      role: Independent Reviewer
  defaults:
    - id: qa-lead
      role: Quality Lead
    - id: qa-gatekeeper
      role: QA Gatekeeper
    - id: code-reviewer
      role: Code Reviewer
    - id: architect-reviewer
      role: Architect Reviewer
    - id: qa-reviewer
      role: QA Reviewer
    - id: frontend-reviewer
      role: Frontend Reviewer
    - id: backend-reviewer
      role: Backend Reviewer
    - id: design-review-lead
      role: Design Review Lead
    - id: runtime-gatekeeper
      role: Runtime Gatekeeper
