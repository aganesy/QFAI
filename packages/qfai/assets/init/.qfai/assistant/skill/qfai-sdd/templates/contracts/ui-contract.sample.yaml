# QFAI-CONTRACT-ID: UI-0003
# Replace the sample IDs: the contract takes the next contract number, its
# rules are numbered under it, and its examples come from the story tree.
# API, DB and UI share one number sequence: take one more than the highest
# number of any kind in contracts.md and the contract file names, not of this
# kind alone.
x-qfai-depends-on: []
x-qfai-rules:
  - id: BR-0003-NNNN
    statement: Submitting an invalid order displays a field-level error.
    examples: [EX-NNNN-NNNN-NN]
prototype:
  mode: interactive
  mockPaths:
    - id: mp_create_to_list
      flow: create -> list reflects
  # CONTRACT_ID:ELEMENT_ID, with the suffix taken from screens[].elements[].id.
  # Only the markers declared here are inspected; nothing derives them.
  markers:
    - id: mk_customer_id_input
      selector: "[data-qfai='UI-0003:customer_id_input']"
      purpose: customer id field on the order create form
screens:
  - id: order_create
    # The one heading of the screen. A heading beyond it is a group heading
    # under `structure`.
    title: Create Order
    route: /orders/new
    # purpose: why the screen exists, in one sentence the user would agree with.
    # navigation: where the screen sits in the app. `shell` names the app frame
    # it renders inside, `entry_points` the screens or menus that lead to it,
    # and `back_to` the route the user returns to. A screen in no navigation on
    # purpose writes `navigation: { none: <reason> }` instead. An application
    # screen with no navigation is QFAI-CONTRACT-054, a warning.
    # surface: `application` for a screen a member uses after signing in (the
    # default when the key is left out), `marketing` for a page a visitor sees
    # before signing in that explains, persuades or informs. Any other value is
    # QFAI-CONTRACT-051.
    surface: application
    purpose: Record a customer's order so it can be fulfilled or finished later.
    navigation:
      shell: main app shell with the role's navigation
      entry_points:
        - New order button on /orders
        - Orders item in the main navigation
      back_to: /orders
    # omitted (optional): each part of "What a business screen always has" in
    # .agents/rules/interface-clarity.md that applies to this screen and that
    # it leaves out, with the reason. `part` names the part in the list's words,
    # `reason` says why the screen does without it. A part left out with no
    # entry here is a defect. A state the screen cannot be in is recorded with
    # `none` under `states`, not here. The once-per-application parts (app
    # shell, home, shared component) are listed on the app frame's
    # contract. An entry with no `part` or no
    # `reason` is QFAI-CONTRACT-052.
    omitted:
      - part: feedback after every change
        reason: Discard draft stores nothing; it returns to /orders, where the list already shows no draft
    # primary_tasks: at least one entry required per screen (QFAI-AUD-001).
    # Recommended ceiling: at most 7 entries per screen (QFAI-AUD-020).
    # More than 7 warns at validate time. The required minimum is one: a screen
    # that does one thing lists one task.
    # See references/ui-contract-guide.md for the rationale.
    # Each entry is a `{id, label, acceptance}` mapping (closed schema — no
    # other keys). A plain string entry is rejected.
    primary_tasks:
      - id: t1
        label: Submit a new order
        acceptance: the order appears in /orders with status draft
      - id: t2
        label: Correct a rejected field
        acceptance: the field-level error clears and submit re-enables
      - id: t3
        label: Keep the order for later
        acceptance: the order appears under /orders/drafts and the form keeps what was entered
      - id: t4
        label: Abandon the draft
        acceptance: navigating away discards the draft and returns to /orders
    elements:
      - id: customer_id_input
        label: Customer ID
        type: input
        required: true
        validations:
          - must be non-empty
      - id: item_code_input
        label: Item Code
        type: input
        required: true
        validations:
          - must be non-empty
    actions:
      - id: submit_order
        label: Submit order
        kind: submit
        effect: navigates to /orders and shows the created row
      - id: save_draft
        label: Save draft
        kind: submit
        effect: stores the order under /orders/drafts, stays on the form and keeps what was entered
      - id: discard_draft
        label: Discard draft
        kind: navigate
        effect: navigates to /orders without storing the order
    # states: what the screen renders in each of the five states, and the
    # user's next action there. Every state is listed: one the screen cannot be
    # in carries `none` with the reason instead of `renders` and `next`. An
    # application screen with no `states`, or without one of the five, is
    # QFAI-CONTRACT-053, a warning.
    states:
      - id: default
        renders: the empty form with Submit order disabled until both fields hold a value
        next: fill in the customer and the item, then submit or save a draft
      - id: empty
        none: the form starts empty by design; there is no list on this screen to be empty
      - id: loading
        renders: the submit and save actions show progress and are disabled; the entries stay visible
        next: wait; nothing on the form can be changed until the request returns
      - id: error
        renders: each rejected field shows its validation message, and a failed save shows sp_draft_not_saved
        next: correct the field or retry the save; nothing entered is lost
      - id: success
        renders: a submit navigates to /orders with the created row; a saved draft shows sp_draft_saved
        next: continue on /orders, or keep editing the draft
    # structure (optional): the groups the screen is read in, in reading order.
    # `tasks` are primary_tasks ids, `members` are elements/actions ids, and
    # `heading` is the displayed heading of the group; leave it out for a group
    # that shows none. An id belongs to one group. This key describes the
    # screen; validate does not check it.
    structure:
      - id: g_customer
        heading: Customer
        tasks: [t1, t2]
        members: [customer_id_input]
      - id: g_items
        heading: Items
        tasks: [t1, t2]
        members: [item_code_input]
      - id: g_commit
        tasks: [t1, t3, t4]
        members: [submit_order, save_draft, discard_draft]
    # supplements (optional): text the screen shows beyond its title, group
    # headings and labels. Field validation messages belong to the element's
    # `validations`. This key describes the copy; validate does not check it.
    # Validate checks the UI source instead: every plain text there carries a
    # `qfai-text` reason comment. `near` is an elements/actions/structure id, `when` is one of
    # the `states` ids (default, empty, loading, error, success), and `why` says what the user
    # could not know or do without the text, and why a label or the structure
    # cannot carry it.
    #
    # There is no supplement that restates what "Save draft" does: the label
    # says it. What the label cannot say is where the draft went and what a
    # failed save means, so those two are described.
    supplements:
      - id: sp_draft_saved
        near: save_draft
        when: success
        text: Saved to Drafts
        why: After the click the user cannot see where the order went; the label names the action, not the place its result is kept.
      - id: sp_draft_not_saved
        near: save_draft
        when: error
        text: Not saved. Your entries are still here. Try again.
        why: A failed save leaves the user unsure whether work was lost and what to do; the label says nothing about failure.
  - id: order_list
    title: Orders
    route: /orders
    surface: application
    purpose: Find an order and see where it stands, so the next step on it can be taken.
    navigation:
      shell: main app shell with the role's navigation
      entry_points:
        - Orders item in the main navigation
      back_to: nowhere; the screen is top level and reached from the main navigation
    primary_tasks:
      - id: t1
        label: Find an order
        acceptance: a search or filter shows the order and the count of matching orders
      - id: t2
        label: Start a new order
        acceptance: New order opens /orders/new
    elements:
      - id: orders_table
        label: Orders
        type: table
        # list: how a `list` or `table` element is shown and narrowed. Each of
        # columns, search, filters, sort and pagination is set, or carries
        # `none` with the reason the element does without it, such as
        # `pagination: { none: at most 12 fixed plans are all shown at once }`.
        # No entry is left out. An element with no list behaviour on purpose
        # writes `list: { none: <reason> }` instead. A list or table element of
        # an application screen with no `list` is QFAI-CONTRACT-055, a warning.
        list:
          columns: [order number, customer, status, created at]
          search: order number and customer name, normalised the same way on both sides
          filters: [status, created at range]
          sort: created at, newest first by default; every column is sortable
          pagination: 25 rows per page on the server, with the total count from the same query
    actions:
      - id: new_order
        label: New order
        kind: navigate
        effect: navigates to /orders/new
      - id: open_order
        label: Order number
        kind: navigate
        effect: navigates to the order's detail at /orders/:id
    states:
      - id: default
        renders: the first page of orders, newest first, with the total count
        next: search, filter or open an order; or start a new order
      - id: empty
        renders: no orders yet, with New order; a search or filter with no match offers to clear it
        next: start a new order, or clear the search and filters
      - id: loading
        renders: the table keeps its columns and shows progress in place of the rows
        next: wait; the search and filters stay as entered
      - id: error
        renders: an inline alert that the orders could not be loaded, with a retry
        next: retry; the search, filters, sort and page are kept
      - id: success
        none: the list changes nothing, so no change of the user's is confirmed here
