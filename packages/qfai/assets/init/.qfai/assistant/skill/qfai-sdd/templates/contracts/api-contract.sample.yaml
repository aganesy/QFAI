# QFAI-CONTRACT-ID: API-0001
# Replace the sample IDs: the contract takes the next number of its kind, its
# rules are numbered under its kind and number, and its examples come from the
# story tree. Each kind has its own number sequence: take one more than the
# highest number of this kind in contracts.md and the contract file names.
x-qfai-depends-on: []
x-qfai-rules:
  - id: BR-API-0001-NNNN
    statement: A valid order draft request creates one draft.
    examples: [EX-NNNN-NNNN-NN]
openapi: "3.1.0"
info:
  title: Sample Orders API
  version: "0.1.0"
paths:
  /api/orders:
    post:
      summary: Create order draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, itemCode]
              properties:
                customerId:
                  type: string
                itemCode:
                  type: string
      responses:
        "201":
          description: Created
        "409":
          description: Duplicate request
