# Firecrawl MCP - supports both hosted URL and local npx modes
# Local npx mode: recommended for sensitive environments
# Hosted mode: HTTP transport to https://mcp.firecrawl.dev/v2/mcp, templates in ../firecrawl-hosted/
# FIRECRAWL_API_URL names the Firecrawl API this local server calls, not an MCP transport
[mcp_servers.firecrawl]
command = "npx"
args = ["-y", "firecrawl-mcp@3.11.0"]
env_vars = ["FIRECRAWL_API_KEY"]

[mcp_servers.firecrawl.env]
FIRECRAWL_API_URL = "https://api.firecrawl.dev"
