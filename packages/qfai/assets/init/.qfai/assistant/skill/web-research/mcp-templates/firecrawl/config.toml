# Firecrawl MCP - two separate settings decide where the work happens.
# Process location: npx launches the MCP server on this machine (stdio).
# For Firecrawl's hosted MCP server over HTTP instead, see ../firecrawl-hosted/.
# Data destination: FIRECRAWL_API_URL is the API that fetches every page.
# https://api.firecrawl.dev is Firecrawl's cloud API, so URLs and page
# content pass through Firecrawl's service even though the server runs here.
# For sensitive environments, set FIRECRAWL_API_URL to a self-hosted
# Firecrawl instance (for example http://localhost:3002).
[mcp_servers.firecrawl]
command = "npx"
args = ["-y", "firecrawl-mcp@3.11.0"]
env_vars = ["FIRECRAWL_API_KEY"]

[mcp_servers.firecrawl.env]
FIRECRAWL_API_URL = "https://api.firecrawl.dev"
