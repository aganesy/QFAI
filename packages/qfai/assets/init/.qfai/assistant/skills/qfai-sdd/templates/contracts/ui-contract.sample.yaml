# QFAI-CONTRACT-ID: CON-UI-0001
prototype:
  mode: interactive
  mockPaths:
    - id: mp_create_to_list
      flow: create -> list reflects
  markers:
    - id: mk_order_form
      selector: "[data-qfai='order-form']"
      purpose: order create form root
screens:
  - id: order_create
    title: Create Order
    route: /orders/new
    # primary_tasks: at least one entry required per screen (QFAI-AUD-001).
    # Replace the example below with the actual primary user action(s).
    primary_tasks:
      - submit a new order
    elements:
      - id: customer_id_input
        label: Customer ID
        type: input
        required: true
        validations:
          - must be non-empty
      - id: item_code_input
        label: Item Code
        type: input
        required: true
        validations:
          - must be non-empty
      - id: submit_button
        label: Submit
        type: button
        required: true
        validations: []
    actions:
      - id: submit_order
        label: Submit order
        kind: submit
        effect: navigates to /orders and shows the created row
