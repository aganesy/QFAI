# Downstream evaluation-axis contract generated by /qfai-sdd
invariant_axes:
  - id: INV-01
    name: Visual hierarchy clarity
    intent: Primary actions and content hierarchy are immediately legible.
trend_derived_axes:
  - id: TRD-01
    name: Contemporary density balance
    intent: Dense data layouts remain breathable on current platform norms.
    source_refs:
      - SRC-01
product_specific_axes:
  - id: PRD-01
    name: Operational confidence
    intent: The UI communicates status and next action without hesitation.
aggregate_rules:
  scoring_scale: 0.0..1.0
  required_visual_categories:
    - color
    - typography
    - spacing
    - border_radius
    - shadow
    - dos_and_donts
