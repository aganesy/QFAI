schemaVersion: "1.0"
sourcePrototypeRefs:
  winnerHtml: ".qfai/prototypes/winner/index.html"
  screenshots:
    - ".qfai/evidence/prototyping/screenshots/home.png"
surfaceProfiles:
  primary: mobile
screens:
  - screenId: home
    prototypeRef: ".qfai/prototypes/winner/index.html#home"
    preserve:
      - "Primary CTA position and visual weight"
      - "Bottom navigation shape and active state"
visualDna:
  color:
    primary: "#2563eb"
    background: "#f8fafc"
  typography:
    heading: "large, dense, high contrast"
  layout:
    density: "compact"
    rhythm: "8px spacing scale"
interactionMap:
  - from: home
    action: "tap primary CTA"
    to: detail
stateCoverage:
  - screenId: home
    states: ["default", "loading", "empty", "error"]
implementationHandoff:
  mustPreserve:
    - "Visual hierarchy from winner screenshot"
    - "Navigation flow and CTA prominence"
  mayAdapt:
    - "Component names and implementation framework"
  mustNotCopy:
    - "Prototype-only fake data wiring"
    - "Device chrome as production UI unless the product actually needs it"
