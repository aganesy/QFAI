schema_version: "1.0"

required:
  shared:
    - Objective
    - Initiative
    - Capabilities
    - BusinessFlow
    - SlicePolicy
  spec:
    - Spec
    - UserStories
    - AcceptanceCriteria
    - BusinessRules
    - Examples
    - TestCases
    - Plan

optional:
  shared:
    - Contracts
    - Glossary
    - Constraints
    - Decisions
    - OpenQuestions
    - Delta
  spec:
    - Decisions
    - OpenQuestions
    - Delta

agent_routing:
  catalog_ssot: .qfai/assistant/manifest/agent-catalog.yml
  routing_ssot: .qfai/assistant/manifest/agent-routing.yml
  review_profiles_ssot: .qfai/assistant/manifest/review-profiles.yml

reviewers:
  minimum: 1
  required:
    - id: completion-reviewer
      role: Completion Reviewer

quality_gates:
  validate:
    required_codes:
      - QFAI-COV-201
      - QFAI-COV-202
      - QFAI-COV-203
      - QFAI-COV-204
      - QFAI-COV-205
      - QFAI-COV-206
  coverage_report:
    required_path: .qfai/report/specs-coverage/spec-*.md
    warning_signal:
      - QFAI-COV-207
  defaults:
    - id: completion-reviewer
      role: Completion Reviewer
    - id: qa-gatekeeper
      role: QA Gatekeeper
    - id: implementation-reviewer
      role: Implementation Reviewer

optional_review_modes:
  review_profiles_ssot: .qfai/assistant/manifest/review-profiles.yml
  supported:
    - devils-advocate
    - pattern-doubler
  pattern-doubler:
    more_scope: [business-flow, US, AC, EX, TC]
    excluded_more_scope: [BR, nonfunctional-floor, policy, decision, architecture]
    abstract_only_result: N/A
    numeric_targets: ignored
    missing_mandatory_pairing: required
    preserved_manifest_precedence: >-
      This catalog bound overrides numeric targets, including default_target,
      in preserved review-profiles.yml. Independently required gates and product
      obligations still apply. N/A never excuses a missing mandatory pairing.
