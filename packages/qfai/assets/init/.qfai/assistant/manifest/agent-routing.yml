schema_version: "1.0"

routing:
  - skill: qfai-discussion
    phases:
      - id: preflight
        mandatory_agents: [delivery-planner]
        conditional_agents: [discovery-analyst]
        parallel_groups: []
        blocking_agents: [delivery-planner]
        rerun_policy: failed-agents-only
      - id: framing
        mandatory_agents: [discovery-analyst, requirements-analyst]
        conditional_agents: [solution-architect, product-experience-architect]
        parallel_groups: []
        blocking_agents: [requirements-analyst]
        rerun_policy: changed-scope-dependents
      - id: review
        # requirements-heavy always_required is
        # [completion-reviewer, requirements-reviewer]; both must be blocking.
        # See scripts/check-review-profile-consistency.mjs for the drift guard.
        mandatory_agents: [completion-reviewer, requirements-reviewer]
        conditional_agents: [architecture-reviewer, product-surface-reviewer]
        parallel_groups: []
        blocking_agents: [completion-reviewer, requirements-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: requirements-heavy

  - skill: qfai-sdd
    phases:
      - id: slice-and-scope
        mandatory_agents: [delivery-planner, requirements-analyst]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [delivery-planner]
        rerun_policy: failed-agents-only
      - id: design
        mandatory_agents: [solution-architect, test-design-analyst]
        conditional_agents: [qa-strategist, product-experience-architect]
        parallel_groups: []
        blocking_agents: [solution-architect]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer]
        conditional_agents: [architecture-reviewer, product-surface-reviewer, qa-gatekeeper]
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: default

  # `parallel_groups` describes ROLE FAN-OUT within a phase, not item
  # dispatch. An empty list means no roles run concurrently; it says
  # nothing about item-level parallelism, which `qfai-implement/SKILL.md`
  # `## Parallelization Policy` governs.
  # `iteration` says how often a phase runs. `qfai-implement` drives the TDD
  # micro-cycle one ledger row at a time, so `red`, `build` and `test` run once
  # per row. Without this key the whole phase list read as a single pass over
  # the batch, and the only slot `qa-gatekeeper` had was the terminal `review`
  # phase — by which point production code exists and the RED state the
  # gatekeeper is supposed to observe has been destroyed. The gate could then
  # adjudicate nothing but the implementer's own written account, which is the
  # self-attestation it exists to prevent.
  - skill: qfai-implement
    phases:
      - id: plan
        iteration: per-invocation
        mandatory_agents: [delivery-planner, test-design-analyst]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [delivery-planner]
        rerun_policy: failed-agents-only
      # The failing test exists and no production code does. This is the only
      # window in which "watch it fail" is a first-hand observation, so the
      # gatekeeper is mandatory AND blocking here: RED must be confirmed before
      # the row is allowed to proceed to `build`.
      - id: red
        iteration: per-ledger-item
        mandatory_agents: [qa-gatekeeper]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [qa-gatekeeper]
        rerun_policy: failed-agents-only
      - id: build
        iteration: per-ledger-item
        mandatory_agents: [qa-gatekeeper]
        conditional_agents: [frontend-engineer, backend-engineer]
        parallel_groups:
          - [frontend-engineer, backend-engineer]
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
      - id: test
        iteration: per-ledger-item
        mandatory_agents: []
        conditional_agents: [acceptance-test-engineer, qa-strategist]
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      # Still per-item: the reviewers judge one row (or one T1 coherent group),
      # never the whole ledger at once. `qa-gatekeeper` stays listed because the
      # completion gate re-reads its verdicts here; its RED/GREEN observations
      # were already made in `red` and `build`.
      - id: review
        iteration: per-ledger-item
        mandatory_agents: [implementation-reviewer, qa-gatekeeper, completion-reviewer]
        conditional_agents: [product-surface-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - skill: qfai-atdd
    phases:
      - id: coverage
        mandatory_agents: [test-design-analyst, qa-strategist]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [test-design-analyst]
        rerun_policy: failed-agents-only
      - id: implementation
        mandatory_agents: [acceptance-test-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: evidence
        mandatory_agents: []
        conditional_agents: [devops-ci-engineer, qa-gatekeeper]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper]
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, qa-gatekeeper]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - skill: qfai-prototyping
    # Multi-spec evolution loop: every UI-bearing spec resolved at cycle 0,
    # one prototype lineage per spec × screen pair, 10 iter (cycle 0..9),
    # 4 ordinal axes + 6 *Feel impressions + layout anti-pattern detection
    # + DESIGN.md token violation gates, prose critique, pivot directive.
    # Routing is the 3 active roles plus completion-reviewer at handoff.
    phases:
      - id: seed
        mandatory_agents: [product-experience-architect]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [product-experience-architect]
        rerun_policy: failed-agents-only
      - id: loop
        mandatory_agents:
          [devops-ci-engineer, product-surface-reviewer, product-experience-architect]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [product-surface-reviewer]
        rerun_policy: changed-scope-dependents
      - id: handoff
        mandatory_agents: [completion-reviewer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: ui-bearing

  - skill: qfai-configure
    phases:
      - id: analysis
        mandatory_agents: [delivery-planner, qa-strategist]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [delivery-planner]
        rerun_policy: failed-agents-only
      - id: config
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [completion-reviewer, qa-gatekeeper]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy

  - skill: qfai-verify
    phases:
      - id: plan
        mandatory_agents: [delivery-planner, qa-strategist]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: [delivery-planner]
        rerun_policy: failed-agents-only
      - id: execution
        mandatory_agents: [devops-ci-engineer]
        conditional_agents: []
        parallel_groups: []
        blocking_agents: []
        rerun_policy: changed-scope-dependents
      - id: review
        mandatory_agents: [qa-gatekeeper, completion-reviewer]
        conditional_agents: [implementation-reviewer]
        parallel_groups: []
        blocking_agents: [qa-gatekeeper, completion-reviewer]
        rerun_policy: changed-scope-dependents
    review_profile: runtime-heavy
