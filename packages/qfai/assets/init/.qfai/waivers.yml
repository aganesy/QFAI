waivers: []
# Write `rule:` exactly as the finding's `code` appears in
# `.qfai/report/validate.json` and in the CLI output — `QFAI-DT-006`,
# `QFAI-CFG-LINK-002`, `W-ASSISTANT-LAYOUT`. Do not strip the `QFAI-` prefix;
# the stripped form is kept working only for older waiver files.
#
# Waivers apply to `warning` and `info` findings only. A waiver aimed at an
# `error` is a configuration error and fails the run.
#
# Example — a project whose design tokens name a platform QFAI does not know:
# - id: WVR-20260207-01
#   rule: QFAI-DT-006
#   scope:
#     paths: [".qfai/spec/03_contract/design/**"]
#   reason: "The kiosk platform is owned by this project; tracked in DEC-0001."
#   expires: "2026-03-01"
#   evidence: ".qfai/spec/decisions.md#DEC-0001"
#   owner: "team-foo"
