# QFAI validate CI workflow
#
# Generated by `qfai init`. Runs `qfai validate --profile
# full --fail-on error` on every push to main/master and every pull request.
#
# The `full` profile includes the QFAI-TEST-001 test-todo stub gate, so any
# `it.todo` / `test.todo` / `describe.todo` in your test suite will fail CI
# (you can opt out via `validation.testStrategy.forbidTestTodoStubs: false`
# in qfai.config.yaml).
#
# Install step auto-detects the project's lockfile (pnpm / yarn /
# npm) and runs the appropriate frozen-lockfile install. `npx qfai`
# works with any Node package manager.

name: qfai validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    name: qfai validate (full profile, fail on error)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout via actions/checkout 4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm via pnpm/action-setup 4.4.0 (if project uses pnpm)
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        # The pnpm setup action resolves the pnpm version from
        # `package.json#packageManager` when no `version:` input is
        # provided. Setting `version:` would override the consumer's
        # declared packageManager (e.g. forcing pnpm 9 on a pnpm 10
        # project), so we leave it unset and require the consumer to
        # declare `"packageManager": "pnpm@X.Y.Z"` in package.json —
        # the most common pnpm-on-CI baseline.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Set up Node via actions/setup-node 4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Match the QFAI repo's CI baseline (Node 20 LTS) and the package
          # `engines: ">=18.0.0"`. Bump deliberately when QFAI raises its
          # supported floor.
          node-version: "20"
          # setup-node@v4's `cache:` accepts a single package-manager value.
          # Pick the one matching the consumer's lockfile (or leave unset
          # when none of the three is present). The conditional expression
          # short-circuits left-to-right.
          #
          # NOTE: `cache: yarn` is built around Yarn Classic (v1)'s
          # `yarn cache dir`. Yarn Berry (v2+) keeps deps under `.yarn/cache`
          # so the built-in cache is best-effort there — but the install
          # step below still picks the correct flag (`--immutable` for
          # Berry, `--frozen-lockfile` for Classic) so functionality is
          # preserved either way.
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || (hashFiles('yarn.lock') != '' && 'yarn' || (hashFiles('package-lock.json') != '' && 'npm' || '')) }}
      - name: Install dependencies (lockfile-aware)
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            # Yarn Berry (v2+) uses `--immutable`; Yarn Classic (v1) uses
            # `--frozen-lockfile`. Pick the right flag based on the
            # version corepack resolves from `package.json#packageManager`
            # (or the bundled Classic default).
            yarn_major="$(yarn --version | cut -d . -f 1)"
            if [ "$yarn_major" -ge 2 ]; then
              yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
          elif [ -f package-lock.json ]; then
            npm ci
          else
            # No lockfile yet — fall back to `npm install` so QFAI can run on
            # freshly-initialized projects without forcing a package-manager
            # choice on first CI run.
            npm install --no-audit --no-fund
          fi
      - name: qfai validate
        run: npx qfai validate --profile full --fail-on error
