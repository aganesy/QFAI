# QFAI layered test orchestrator
#
# Generated by `qfai init`. Runs one lane per test layer (unit, component,
# integration, api, e2e) as legs of one matrixed job in this single file.
#
# The legs are one job rather than five because a lane installs your
# dependencies before it runs, and that install sequence is long. Five copies
# of it would drift apart; one matrix axis keeps one copy and still runs the
# layers concurrently.
#
# A change-detection job computes which lanes a change would need from a
# name-only diff against the base commit, and a script probe reads which
# layer-named test scripts (test:unit, test:component, test:integration,
# test:api, test:e2e) your package.json declares. A lane runs only when
# BOTH hold: your package.json declares the matching layer-named test
# script (your opt-in) and the diff selected the lane. Delete the file if
# you do not want it; `qfai init` will not recreate a file you
# deliberately removed.
#
# What this file needs from your repository, and how it behaves when it does
# not get it:
#
# | Field                         | Value                                                                                                     |
# | ----------------------------- | --------------------------------------------------------------------------------------------------------- |
# | Covered layer                 | all five adopter test layers - unit, component, integration, api, e2e - one matrix leg each               |
# | Runner selector               | `vars.QFAI_CI_RUNNER`, default `ubuntu-latest`                                                            |
# | Light runner selector         | `vars.QFAI_CI_LIGHT_RUNNER`, falling back to `vars.QFAI_CI_RUNNER`, default `ubuntu-latest`               |
# | What reads the light one      | the jobs that install nothing and run no test - change detection and the verdict                          |
# | Wrong runner value            | GitHub does not fail fast: an unknown label leaves the job queued indefinitely, never red                 |
# | `packageManager` precondition | a `pnpm-lock.yaml` needs `"packageManager": "pnpm@<version>"` in package.json, or the lane stops CLOSED   |
# | Inert when                    | your package.json declares no `test:<layer>` script, or the diff did not select the lane                  |
# | Fail-open behaviour           | degraded detection (unreachable base, shallow clone, failed diff, unknown path): warning, then every lane |
# | Node version                  | your `.nvmrc` / `.node-version` wins; with neither, a warning annotation, Node 20, and the lane continues |
# | Dependency install            | follows your lockfile: pnpm / yarn Berry / yarn Classic / npm, else `npm install`                        |
#
# Every lane is inert until you opt in: with no `test:<layer>` script in your
# package.json the matrix is empty, the job is skipped and the verdict is
# green over nothing. A lane that does run executes your script exactly once,
# through your own package manager, and appends no argument to it - the script
# is yours and its runner is unknown here.
#
# This file is self-contained: it does not reference any other workflow file
# QFAI ships.

name: qfai tests

on:
  push:
    branches: [main, master]
  pull_request:
    # `closed` is here to end work, not to start it. A closed pull request
    # starts a run in the same concurrency group as the one still testing its
    # last push, which cancels that run; every job below then declines to do
    # anything, so the close costs a queued run and no runner minutes.
    types: [opened, synchronize, reopened, closed]

# One live run per pull request, and per ref otherwise: a superseded push, a PR
# update and a PR close each cancel the older run.
#
# Keyed on the pull request's number rather than on `github.ref`, because the
# close event and the pushes before it do not share a ref expression — grouped
# by ref, the close would open a group of its own and cancel nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detection:
    name: change detection
    if: ${{ github.event.action != 'closed' }}
    runs-on: ${{ vars.QFAI_CI_LIGHT_RUNNER || vars.QFAI_CI_RUNNER || 'ubuntu-latest' }}
    # Reads the repository only; the name-only diff writes nothing back.
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.diff.outputs.lanes }}
      scripts: ${{ steps.scripts.outputs.scripts }}
      selected: ${{ steps.selected.outputs.selected }}
    steps:
      - name: Checkout with full history via actions/checkout 5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          # Full history is requested by this job only: the name-only
          # diff needs the base commit reachable locally.
          fetch-depth: 0
      - name: Select lanes from the name-only diff
        id: diff
        env:
          # Pull requests diff against the PR base; pushes against the
          # previous head.
          QFAI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Which diff form to take, because the two events want different ones. On a pull
          # request the question is what THIS branch changed, which is the merge base (`A...B`).
          # On a push the question is what the push changed, which is the previous head against
          # the new one (`A B`) — `A...B` there is `git diff $(git merge-base A B) B`, so a
          # non-fast-forward push drops everything the old head carried and the new one does not.
          # A force-push whose new side touches only documentation would otherwise report no
          # lanes, skip every test and accept a default branch that lost a source file.
          QFAI_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          # Selects the test-lane matrix from a name-only diff against the
          # base commit. Docs-only changes need no test lane (the minimal,
          # empty set); anything touching source selects the full set. Any
          # degraded input - missing or unreachable base, shallow clone, a
          # failed diff, or a changed path outside the recognized set -
          # FAILS OPEN: warn and select the full lane superset, so a
          # degraded run never claims a result it did not establish.
          FULL_LANES='["unit","component","integration","api","e2e"]'
          emit() { echo "lanes=$1" >> "$GITHUB_OUTPUT"; }
          fail_open() {
            echo "::warning::qfai tests change detection: $1 - selecting the full lane superset (fail open)"
            emit "$FULL_LANES"
            exit 0
          }
          if [ -z "${QFAI_BASE_REF:-}" ]; then
            fail_open "no base reference available"
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            fail_open "shallow clone: the base commit may be unreachable"
          fi
          if ! git rev-parse --verify --quiet "${QFAI_BASE_REF}^{commit}" > /dev/null; then
            fail_open "base reference is not reachable"
          fi
          # --no-renames is load-bearing. With rename detection on, git
          # reports only the DESTINATION of a move, so moving
          # src/foo.ts to docs/foo.md arrives here as one documentation
          # path and the source half of the change selects no lane.
          # Turning detection off makes both halves visible.
          # Two calls rather than one with a computed range: a bash array reads as an unparsable
          # program to the shipped-lane guard, which enumerates every command a shipped workflow
          # may invoke. Written out, both branches are the same enumerated git diff.
          if [ "${QFAI_EVENT_NAME:-}" = "pull_request" ]; then
            if ! changed="$(git diff --name-only --no-renames "${QFAI_BASE_REF}...HEAD")"; then
              fail_open "name-only diff failed"
            fi
          else
            if ! changed="$(git diff --name-only --no-renames "${QFAI_BASE_REF}" HEAD)"; then
              fail_open "name-only diff failed"
            fi
          fi
          docs_only=true
          while IFS= read -r changed_path; do
            [ -z "$changed_path" ] && continue
            case "$changed_path" in
              # Source and test DIRECTORIES are matched first, before any
              # extension rule. A file's directory decides what it is: a
              # template read at runtime (src/templates/prompt.md) or a
              # fixture read by a test (tests/fixtures/input.txt) is part
              # of the code, and an extension rule evaluated first would
              # call both of them documentation and skip every lane.
              #
              # At ANY depth, which the leading-segment forms alone are not.
              # A `case` glob's `*` matches `/` too, so in a monorepo
              # `packages/app/src/template.md` did not match `src/*` and fell
              # through to the documentation branch below: `lanes=[]`, every
              # declared test script skipped, verdict green. The nested forms
              # are what make the directory rule a directory rule rather than a
              # repository-root rule.
              src/*|tests/*|.github/*|*/src/*|*/tests/*) docs_only=false ;;
              # Documentation is a LOCATION, not an extension.
              #
              # Naming source directories and letting every other `.md` / `.txt`
              # be documentation only moves the hole to the next directory name.
              # Measured against this block: with `src` and `tests` named,
              # `packages/app/test/fixture.txt` (singular), `__tests__/`,
              # `spec/`, `fixtures/` and `testdata/` all still took the
              # documentation arm — lanes=[], every declared test:<layer> script
              # skipped, verdict green. An adopter's directory naming is not
              # ours to enumerate.
              #
              # So the documentation arm is the narrow one: an explicit `docs`
              # directory at any depth, or a document at the repository ROOT.
              # A `.md` or `.txt` anywhere else is content some code or test
              # reads, and the safe verdict for "we cannot tell" is to run the
              # lanes.
              docs/*|*/docs/*) ;;
              *.md|*.markdown|*.txt|LICENSE)
                case "$changed_path" in
                  */*) docs_only=false ;;
                  *) ;;
                esac
                ;;
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.json|*.yml|*.yaml|*.lock) docs_only=false ;;
              *) fail_open "changed path outside the recognized set: ${changed_path}" ;;
            esac
          done <<< "$changed"
          if [ "$docs_only" = "true" ]; then
            emit "[]"
          else
            emit "$FULL_LANES"
          fi
      - name: Probe layer-named test scripts
        id: scripts
        shell: bash
        run: |
          # Emits the layers whose opt-in test script (test:unit,
          # test:component, test:integration, test:api, test:e2e) exists
          # in package.json, as a JSON array. Every lane below keys its
          # run condition on membership in this output: no declared
          # script, no executing lane. A missing or unparsable
          # package.json declares nothing, so every lane stays skipped -
          # the safe default for an opt-in, because running a lane
          # without its script could only fail. The probe uses the
          # runner's preinstalled node and installs nothing.
          declared="[]"
          if [ -f package.json ]; then
            declared="$(node -e '
              const { readFileSync } = require("node:fs");
              let scripts = {};
              try {
                const parsed = JSON.parse(readFileSync("package.json", "utf8"));
                if (
                  parsed !== null &&
                  typeof parsed === "object" &&
                  parsed.scripts !== null &&
                  typeof parsed.scripts === "object"
                ) {
                  scripts = parsed.scripts;
                }
              } catch {
                scripts = {};
              }
              const layers = ["unit", "component", "integration", "api", "e2e"];
              const declared = layers.filter(
                (layer) => typeof scripts["test:" + layer] === "string",
              );
              process.stdout.write(JSON.stringify(declared));
            ')" || declared="[]"
          fi
          echo "scripts=${declared}" >> "$GITHUB_OUTPUT"
      - name: Intersect the selected lanes with the declared scripts
        id: selected
        shell: bash
        env:
          QFAI_LANES: ${{ steps.diff.outputs.lanes }}
          QFAI_SCRIPTS: ${{ steps.scripts.outputs.scripts }}
        run: |
          # The matrix runs one leg per layer that is BOTH selected by the
          # change detection and declared as a script. Computing it here
          # rather than in the lane's own condition is what lets the lane be
          # one matrixed job instead of five near-identical ones: a job
          # condition can skip a leg, but only a matrix value can stop the
          # leg existing, and five copies of an install sequence is the drift
          # class this repository's rules refuse.
          #
          # An empty result is a legal matrix: GitHub skips the job, and the
          # verdict below reads a skipped lane as green because it claims
          # nothing.
          selected="$(node -e '
            const parse = (raw) => {
              try {
                const value = JSON.parse(raw);
                return Array.isArray(value) ? value.filter((entry) => typeof entry === "string") : [];
              } catch {
                return [];
              }
            };
            const lanes = parse(process.env.QFAI_LANES ?? "[]");
            const scripts = parse(process.env.QFAI_SCRIPTS ?? "[]");
            process.stdout.write(JSON.stringify(lanes.filter((lane) => scripts.includes(lane))));
          ')" || selected="[]"
          echo "selected=${selected}" >> "$GITHUB_OUTPUT"
          echo "qfai tests: lanes to run ${selected}"
  tests:
    name: qfai tests (${{ matrix.layer }})
    needs: detection
    if: ${{ needs.detection.outputs.selected != '[]' && needs.detection.outputs.selected != '' }}
    runs-on: ${{ vars.QFAI_CI_RUNNER || 'ubuntu-latest' }}
    # Least privilege for a test lane: read the repository, write nothing
    # back. Bounded even while the lane is skipped.
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.detection.outputs.selected) }}
    steps:
      - name: Checkout via actions/checkout 5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Nothing in this job pushes back, so the token never needs to
          # outlive the checkout step.
          persist-credentials: false
      - name: Resolve the package manager (pnpm route fails closed)
        id: package-manager
        shell: bash
        run: |
          # Package manager resolution, fail CLOSED. The pnpm setup action
          # below is invoked with no `version:` input on purpose —
          # overriding the version the adopter declared would be worse, e.g.
          # forcing pnpm 9 on a pnpm 10 project — so
          # `package.json#packageManager` is its only source. With that
          # field missing the action stops with a resolution error naming
          # neither the file nor the fix; we stop first and name both.
          # Continuing without an install is not an option: the lane would
          # report a test result it never computed.
          #
          # Scoped to the pnpm route deliberately: Yarn Classic and npm ship
          # with the runner and do resolve without the field, so stopping
          # there would stop on a resolvable case.
          if [ ! -f pnpm-lock.yaml ]; then
            echo "qfai tests: no pnpm lockfile - no manifest-declared package manager required"
            exit 0
          fi
          declared=""
          if [ -f package.json ]; then
            declared="$(node -e '
              const { readFileSync } = require("node:fs");
              let field = "";
              try {
                const parsed = JSON.parse(readFileSync("package.json", "utf8"));
                if (
                  parsed !== null &&
                  typeof parsed === "object" &&
                  typeof parsed.packageManager === "string"
                ) {
                  field = parsed.packageManager;
                }
              } catch {
                field = "";
              }
              // The value is adopter input and this step echoes it, so every
              // whitespace run collapses to one space: a `\n` (a legal JSON
              // string escape) would otherwise start a new stdout line, and
              // the runner reads `::`-leading lines as workflow commands - a
              // fork PR could forge annotations against any file, mask
              // output, or stop command processing for the rest of the step.
              // Collapsing beats keeping the first line only: it also
              // neutralises a lone `\r`, and it keeps the whole value
              // visible in the log for diagnosis instead of silently
              // truncating it.
              process.stdout.write(field.trim().replace(/\s+/g, " "));
            ')" || declared=""
          fi
          if [ -z "$declared" ]; then
            echo '::error file=package.json::qfai tests: pnpm-lock.yaml is present but package.json does not resolve a "packageManager" string (the field is missing, is empty, is not a string, or package.json could not be read). Add "packageManager": "pnpm@<the pnpm version you use>" to package.json and commit it - the pnpm setup action reads the pnpm version from that field only, so this lane cannot install and must not report a test result it did not compute.'
            exit 1
          fi
          # Non-empty is not the same claim as resolvable. "yarn@4.9.2" and a
          # bare "pnpm" both pass a presence test, and the setup action below
          # then stops with an opaque resolution error naming neither the file
          # nor the fix - which is the failure this guard exists to replace.
          # So the pnpm route also checks the VALUE resolves to a pnpm version.
          # Checked to the END of the value. `pnpm@[0-9]*` was not that check:
          # a shell `*` is any string, not a repetition of digits, so
          # `pnpm@9junk` matched on its first character and the opaque
          # resolution error this guard exists to replace arrived one step
          # later anyway. The shape required is `pnpm@` then MAJOR.MINOR.PATCH
          # of digits, with corepack's optional `-<prerelease>` and `+<hash>`
          # suffixes allowed but not required.
          # The suffixes are VALIDATED, not stripped. Dropping everything from the
          # first `-` or `+` and checking only what was left accepted
          # `pnpm@9.12.3-`, `pnpm@9.12.3+` and `pnpm@9.12.3-foo_bar`: the core
          # read as 9.12.3, this guard said `resolvable=yes`, and corepack then
          # failed with the opaque resolution error the guard exists to replace.
          # Corepack's own grammar is `<name>@<semver>` with an optional
          # `+<algorithm>.<hex digest>` integrity suffix, so that is what is
          # required here - whole value, one shape at a time.
          version="${declared#pnpm@}"
          resolvable=no
          if [ "$version" != "$declared" ]; then
            shape_ok=yes
            body="$version"
            case "$version" in
              *+*)
                body="${version%%+*}"
                integrity="${version#*+}"
                # `<algorithm>.<digest>`: an algorithm name, a dot, a hex digest.
                # A bare `+`, a missing digest and a second `+` all fail — `+` is
                # not a hex character, so the digest test rejects it too.
                case "$integrity" in
                  *.*) ;;
                  *) shape_ok=no ;;
                esac
                # The algorithm is not guessed at from a fixed list, and it
                # is not taken on shape alone either.
                #
                # A closed list of `sha1|sha224|sha256|sha384|sha512`
                # refuses anything corepack accepts through
                # `crypto.createHash` that is not on it - `sha3-256` is the
                # obvious one - and refuses it with THIS guard's message,
                # sending an adopter to fix a value that was already
                # correct. But shape alone accepted
                # `pnpm@9.12.3+garbage.deadbeef`: `garbage` is a run of
                # letters, so this guard said the value was resolvable, and
                # corepack then failed to hash with it - the opaque failure
                # this precondition exists to replace, reached through the
                # precondition.
                #
                # So the runner is asked. `crypto.getHashes()` is the set
                # `crypto.createHash` accepts on THIS runner, which is the
                # question that matters and the one a list in this file
                # cannot answer.
                algorithm="${integrity%%.*}"
                case "$algorithm" in
                  ""|*[!0-9A-Za-z-]*) shape_ok=no ;;
                  *)
                    if ! node -e '
                      const { getHashes } = require("node:crypto");
                      const wanted = String(process.argv[1]).toLowerCase();
                      process.exit(
                        getHashes().some((name) => name.toLowerCase() === wanted)
                          ? 0
                          : 1,
                      );
                    ' "$algorithm" 2>/dev/null; then
                      shape_ok=no
                    fi
                    ;;
                esac
                case "${integrity#*.}" in
                  ""|*[!0-9a-fA-F]*) shape_ok=no ;;
                esac
                ;;
            esac
            case "$body" in
              *-*)
                core="${body%%-*}"
                # A prerelease is dot-separated identifiers of alphanumerics and
                # hyphens, none of them empty. `9.12.3-` has none at all.
                case "${body#*-}" in
                  ""|.*|*.|*..*|*[!0-9A-Za-z.-]*) shape_ok=no ;;
                esac
                # And a NUMERIC identifier carries no leading zero, which SemVer
                # forbids: `9.12.3-01` is not a version, and node-semver rejects
                # it. An alphanumeric one may start with a zero (`0alpha`), so
                # the two cases are separated rather than lumped together.
                ids="${body#*-}"
                while [ -n "$ids" ]; do
                  id="${ids%%.*}"
                  case "$id" in
                    "") shape_ok=no ;;
                    *[!0-9]*) ;;
                    0) ;;
                    0*) shape_ok=no ;;
                  esac
                  case "$ids" in
                    *.*) ids="${ids#*.}" ;;
                    *) ids="" ;;
                  esac
                done
                ;;
              *) core="$body" ;;
            esac
            case "$core" in
              ""|.*|*.|*[!0-9.]*|*.*.*.*) shape_ok=no ;;
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) shape_ok=no ;;
            esac
            # MAJOR.MINOR.PATCH, each without a leading zero. The glob above is
            # "digits and dots", not SemVer: `pnpm@9.12.03` and `pnpm@01.02.03`
            # passed it, and neither is a version node-semver or corepack will
            # resolve — so the guard said `resolvable` and the opaque downstream
            # failure it exists to replace arrived one step later anyway. A
            # dropped digit is an ordinary typo, which is exactly the case this
            # guard is for.
            rest="$core"
            for _part in 1 2 3; do
              part="${rest%%.*}"
              case "$part" in
                ""|*[!0-9]*) shape_ok=no ;;
                0) ;;
                0*) shape_ok=no ;;
              esac
              rest="${rest#*.}"
            done
            if [ "$shape_ok" = yes ]; then
              resolvable=yes
            fi
          fi
          if [ "$resolvable" != yes ]; then
            printf '::error file=package.json::qfai tests: pnpm-lock.yaml is present but package.json "packageManager" is %s, which does not name a pnpm version. Set it to "pnpm@<the pnpm version you use>" and commit it - the pnpm setup action resolves the version from that field only, so this lane cannot install and must not report a test result it did not compute.\n' "$declared"
            exit 1
          fi
          echo "qfai tests: package manager ${declared} (from the package.json packageManager field)"
      - name: Set up pnpm via pnpm/action-setup 4.4.0 (if project uses pnpm)
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        # No `version:` input: the action reads it from
        # `package.json#packageManager`, whose presence the step above has
        # already established (see its comment for why it is required).
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Resolve the Node version (adopter file wins, else fall open)
        id: node-version
        shell: bash
        run: |
          # Node version resolution, fail OPEN. An adopter version file
          # wins in the order probed below; with none present we use the
          # documented fallback and warn, so the lane continues.
          #
          # setup-node's `node-version-file:` input is deliberately NOT
          # used: it fails the job outright for every adopter who has no
          # such file, which would make this workflow unusable on a tree
          # that simply never pinned a Node version.
          fallback="20"
          for candidate in .nvmrc .node-version; do
            [ -f "$candidate" ] || continue
            first_line=""
            IFS= read -r first_line < "$candidate" || true
            resolved="$(printf '%s' "$first_line" | tr -d '[:space:]')"
            if [ -n "$resolved" ]; then
              echo "qfai tests: Node ${resolved} (from ${candidate})"
              echo "version=${resolved}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::warning::qfai tests: no Node version file (.nvmrc or .node-version) found - using Node ${fallback} and continuing (fail open). Add one to pin the version this workflow uses."
          echo "version=${fallback}" >> "$GITHUB_OUTPUT"
      - name: Choose a package-manager cache setup-node can actually resolve
        id: node-cache
        shell: bash
        run: |
          # setup-node resolves a cache DIRECTORY by running the package manager, before this
          # workflow has installed anything. Asking it for a cache it cannot resolve fails the
          # step outright, which is why the choice is made here rather than in an expression.
          #
          # pnpm and npm are already available at this point: `pnpm/action-setup` runs above, and
          # npm ships with every Node. Yarn does not. Corepack is not bundled from Node 25 on, and
          # the Node this workflow runs is the adopter's own `.nvmrc` / `.node-version` — so on a
          # runner with neither Yarn nor Corepack preinstalled, `cache: yarn` sent setup-node to
          # `yarn cache dir` and the job stopped there, BEFORE the install step below could
          # install Corepack and enable the shim. The lane failed at the one point it was built to
          # fail open.
          #
          # So the Yarn cache is claimed only when Yarn answers now. Skipping it costs a warm
          # cache and nothing else: the install step still provisions Corepack and installs, so
          # the lane runs. A missing optimisation is not a missing verification.
          if [ -f pnpm-lock.yaml ]; then
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            # The QUERY setup-node will make, not merely whether something called yarn is on
            # PATH. A self-hosted runner can carry a stale Corepack shim, or a `yarn` that
            # cannot resolve its own cache — `command -v` succeeds there and `yarn cache dir`
            # does not, which is the case that still stopped the job. Asking the real question
            # costs one subprocess and answers exactly what the cache needs.
            if yarn cache dir > /dev/null 2>&1; then
              echo "cache=yarn" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::qfai tests: yarn is not on PATH yet, so the Yarn download cache is skipped for this run. The install step provisions Corepack and installs normally; preinstall Yarn or Corepack on this runner to get the cache back."
              echo "cache=" >> "$GITHUB_OUTPUT"
            fi
          elif [ -f package-lock.json ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node via actions/setup-node 5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          # The version resolved by the step above: the adopter's own
          # version file when they have one, else the documented fallback
          # (Node 20, matching the package `engines: ">=20.19.0"` floor).
          node-version: ${{ steps.node-version.outputs.version }}
          # setup-node@v4's `cache:` accepts a single package-manager value, and the step above
          # decides it — an expression cannot ask whether the package manager is on PATH, and
          # asking for a cache setup-node cannot resolve fails the step outright.
          #
          # NOTE: `cache: yarn` is built around Yarn Classic (v1)'s
          # `yarn cache dir`. Yarn Berry (v2+) keeps deps under `.yarn/cache`
          # so the built-in cache is best-effort there — but the install
          # step below still picks the correct flag (`--immutable` for
          # Berry, `--frozen-lockfile` for Classic) so functionality is
          # preserved either way.
          cache: ${{ steps.node-cache.outputs.cache }}
      - name: Install dependencies (lockfile-aware)
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            # Corepack is not bundled from Node 25 on, and the Node this workflow runs is the
            # adopter's own `.nvmrc` / `.node-version`, which QFAI does not choose. Calling
            # `corepack enable` unconditionally stopped the run at `command not found` before a
            # single dependency was installed. Installed when absent, which is what this
            # repository's own composite action does for the same reason.
            if ! command -v corepack > /dev/null 2>&1; then
              # Pinned rather than latest: an unpinned global install fetches whatever the
              # registry calls latest at the moment the job runs, so the same commit installs a
              # different corepack from one day to the next — and this is the step that
              # bootstraps the toolchain everything after it depends on.
              # The version AND the registry it comes from. `npm` resolves its registry from
              # `NPM_CONFIG_REGISTRY` or from a project `.npmrc`, so a pinned version alone names
              # WHAT to fetch and not WHERE from — and this package's bin runs on the very next
              # line. `--registry` on the command line outranks both, and `--ignore-scripts` stops
              # the package running during installation rather than when it is invoked.
              #
              # The own-CI copy of this fallback goes further: it downloads the tarball, compares
              # its sha512 with a pinned integrity, and installs from the verified file. That is
              # deliberately NOT done here. This lane runs in an ADOPTER's repository, where the
              # enumerated set of programs a shipped lane may invoke is itself a reviewed
              # contract — putting `curl` and `openssl` into it widens what every adopter's CI is
              # allowed to run, to defend against a file that adopter owns and reviews. The flag
              # closes the redirect; the download would import a capability instead.
              npm install --global --ignore-scripts --registry https://registry.npmjs.org/ corepack@0.35.0
            fi
            corepack enable
            # Yarn Berry (v2+) uses `--immutable`; Yarn Classic (v1) uses
            # `--frozen-lockfile`. Pick the right flag based on the
            # version corepack resolves from `package.json#packageManager`
            # (or the bundled Classic default).
            yarn_major="$(yarn --version | cut -d . -f 1)"
            if [ "$yarn_major" -ge 2 ]; then
              yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
          elif [ -f package-lock.json ]; then
            npm ci
          else
            # No lockfile yet — fall back to `npm install` so QFAI can run on
            # freshly-initialized projects without forcing a package-manager
            # choice on first CI run.
            npm install --no-audit --no-fund
          fi
      - name: Run the declared test script
        shell: bash
        env:
          QFAI_LAYER: ${{ matrix.layer }}
        run: |
          # The adopter's own script, run through the adopter's own package
          # manager, exactly once. Its exit status is this lane's result, and
          # the verdict below turns a failing lane red.
          #
          # No argument is appended to it. The script belongs to the adopter
          # and its runner is unknown here, so a shard or reporter flag that
          # suits one framework is a syntax error in the next.
          if [ -f pnpm-lock.yaml ]; then
            pnpm run "test:${QFAI_LAYER}"
          elif [ -f yarn.lock ]; then
            yarn run "test:${QFAI_LAYER}"
          else
            npm run "test:${QFAI_LAYER}"
          fi
  verdict:
    name: verdict
    needs: [detection, tests]
    # Always-run: the verdict reports even when every lane above was
    # skipped (the empty-matrix case). Skipped lanes are green - they
    # established nothing and claim nothing; failed lanes are not.
    if: ${{ always() && github.event.action != 'closed' }}
    runs-on: ${{ vars.QFAI_CI_LIGHT_RUNNER || vars.QFAI_CI_RUNNER || 'ubuntu-latest' }}
    # The verdict only aggregates results GitHub already computed; it
    # needs no repository access at all.
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Aggregate lane results (green on skip)
        env:
          QFAI_NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          # A failed or cancelled lane turns the verdict red; success and
          # skipped both stay green, so an empty matrix exits 0 without
          # claiming results it does not have.
          if printf '%s' "$QFAI_NEEDS_JSON" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::qfai tests: a selected lane failed"
            exit 1
          fi
          echo "qfai tests verdict: green (no selected lane reported a failure; a skipped lane establishes nothing and claims nothing)"
