# QFAI layered test orchestrator
#
# Generated by `qfai init`. Declares one lane per test layer (unit,
# component, integration, api, e2e) as jobs inside this single file.
#
# Every lane below is declared but currently disabled: the opt-in
# condition (the presence of the matching layer-named test script in
# your package.json) is wired in a later revision of this file, so no
# lane checks out or executes anything in your repository yet. Delete
# the file if you do not want it; `qfai init` will not recreate a file
# you deliberately removed.
#
# This file is self-contained: it does not reference any other workflow
# file QFAI ships.

name: qfai tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: unit tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: unit lane placeholder
        run: echo "unit lane is declared but not yet enabled"
  component:
    name: component tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: component lane placeholder
        run: echo "component lane is declared but not yet enabled"
  integration:
    name: integration tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: integration lane placeholder
        run: echo "integration lane is declared but not yet enabled"
  api:
    name: api tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: api lane placeholder
        run: echo "api lane is declared but not yet enabled"
  e2e:
    name: e2e tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: e2e lane placeholder
        run: echo "e2e lane is declared but not yet enabled"
