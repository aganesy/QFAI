paths:
  specsDir: .qfai/specs
  contractsDir: .qfai/contracts
  discussionDir: .qfai/discussion
  outDir: .qfai/report
  skillsDir: .qfai/assistant/skills
  srcDir: src
  testsDir: tests
  # Where the project's migrations live. Left unset because qfai cannot guess
  # it, and a project without migrations is not in violation of anything.
  #
  # `qfai db-drift` is the only reader. It applies the DB contracts and the
  # migrations to separate in-process databases and reports the columns they
  # disagree about. With no value here it says the project is out of scope and
  # stops, rather than comparing the contracts against an empty directory and
  # calling every column a difference.
  # migrationsDir: migrations
validation:
  failOn: error
  require:
    specSections: []
  testStrategy:
    maxE2eScenarioRatio: null
    maxE2eScenarioCount: null
    # `qfai validate` rejects `it.todo` / `test.todo` / `describe.todo` stubs in
    # files matched by traceability.testFileGlobs (QFAI-TEST-001). Setting this
    # to false is the documented opt-out.
    #
    # The opt-out is not machine-checked. Setting it to false makes the stub
    # check return nothing at all — it does not downgrade to a warning, and no
    # field here associates a waiver with it. Recording a waiver DR-ID is a
    # project governance step you take and review yourselves; `qfai validate`
    # will neither ask for one nor notice its absence. Treat a false here as a
    # decision that needs a human reviewer, not one the gate will catch.
    forbidTestTodoStubs: true
  traceability:
    scMustHaveTest: true
    # `qfai init` fills this from the repository it runs in: each layout in the
    # list below is matched against the real tree, and the ones that select at
    # least one file are written here. A repository with no test file yet keeps
    # the empty list, which is then a fact about that repository rather than
    # about the default.
    #
    # It is left empty on purpose when nothing matched. A language-specific list
    # seeded regardless of the tree selects zero files on every other stack, and
    # the stub scan then reports nothing about a repository it never read — a
    # clean result that means only that the globs missed. So the value is
    # derived and never guessed. Run /qfai-configure to set or refine it;
    # `qfai validate` reports QFAI-TRACE-124 while this is unset or matches zero
    # files. `qfai init` never rewrites an existing config,
    # so a value tuned here stays.
    #
    # This key also selects the files scanned by the test-stub gate
    # (validation.testStrategy.forbidTestTodoStubs). While it is empty that gate
    # scans nothing, so QFAI-TEST-001 cannot fire however many stubs exist;
    # `qfai validate` reports QFAI-TEST-002 to say the scan produced no evidence.
    #
    # The layouts init recognises:
    #   TypeScript: tests/**/*.test.ts, src/**/*.spec.ts
    #   Python:     tests/**/test_*.py, tests/**/*_test.py
    #   Go:         **/*_test.go
    #   Java/Kotlin: src/test/**/*.java, src/test/**/*.kt
    #   Rust:       tests/**/*.rs
    #   Cucumber:   features/**/*.feature
    testFileGlobs: []
    testFileExcludeGlobs: []
    unknownContractIdSeverity: error
output:
  validateJsonPath: .qfai/report/validate.json
prototyping:
  calibration:
    packPath: .qfai/evidence/calibration.yaml
  execution:
    targetUrl: null
    browserTool: playwright
atdd:
  # How many consecutive `qfai validate` runs may observe a scaffold skeleton
  # still in placeholder shape before D-SCAFFOLD-PLACEHOLDER escalates from
  # warning to error. 0 disables the escalation and keeps it a warning forever.
  # This is the in-code default, restated here so the knob the ATDD skill
  # advertises is readable from the file it sends you to. See
  # `.qfai/assistant/skills/qfai-atdd/references/scaffolding.md`.
  scaffoldEscalateCycles: 3
