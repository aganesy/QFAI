# Write `rule:` exactly as the finding's `code` appears in
# `.qfai/report/validate.json` and in the CLI output — `QFAI-ATDD-112`,
# `TDDLIST_UNKNOWN_LEVEL`, `E_TC_ORPHAN`. Do not strip the `QFAI-` prefix; the
# stripped form is kept working only for older waiver files.
#
# Waivers apply to `warning` and `info` findings only. A waiver aimed at an
# `error` is a configuration error and fails the run.
#
