schema_version: "1.0"

required:
  shared:
    - Objective
    - Initiative
    - Capabilities
    - BusinessFlow
  spec:
    - Spec
    - UserStories
    - AcceptanceCriteria
    - BusinessRules
    - Examples
    - TestCases

optional:
  shared:
    - Contracts
    - Glossary
    - Constraints
    - Decisions
    - OpenQuestions
    - Delta
  spec:
    - Decisions
    - OpenQuestions
    - Delta

reviewers:
  minimum: 12
  roster_ssot: .qfai/assistant/steering/review-roster.yml
  required:
    - id: qa-lead
      role: Quality Lead
    - id: qa-gatekeeper
      role: QA Gatekeeper
    - id: reviewer
      role: Independent Reviewer
    - id: code-reviewer
      role: Code Reviewer
    - id: architect-reviewer
      role: Architect Reviewer
    - id: qa-reviewer
      role: QA Reviewer
    - id: frontend-reviewer
      role: Frontend Reviewer
    - id: backend-reviewer
      role: Backend Reviewer
    - id: design-review-lead
      role: Design Review Lead
    - id: runtime-gatekeeper
      role: Runtime Gatekeeper
    - id: devils-advocate
      role: Devil's Advocate
    - id: pattern-doubler
      role: Pattern Doubler

quality_gates:
  validate:
    required_codes:
      - QFAI-COV-201
      - QFAI-COV-202
      - QFAI-COV-203
      - QFAI-COV-204
      - QFAI-COV-205
      - QFAI-COV-206
  coverage_report:
    required_path: .qfai/report/specs-coverage/spec-*.md
    warning_signal:
      - QFAI-COV-207
  defaults:
    - id: qa-lead
      role: Quality Lead
    - id: qa-gatekeeper
      role: QA Gatekeeper
    - id: code-reviewer
      role: Code Reviewer
    - id: architect-reviewer
      role: Architect Reviewer
    - id: qa-reviewer
      role: QA Reviewer
    - id: frontend-reviewer
      role: Frontend Reviewer
    - id: backend-reviewer
      role: Backend Reviewer
    - id: design-review-lead
      role: Design Review Lead
    - id: runtime-gatekeeper
      role: Runtime Gatekeeper
    - id: devils-advocate
      role: Devil's Advocate
    - id: pattern-doubler
      role: Pattern Doubler

# extended_reviewers is currently advisory metadata for orchestration/docs.
# Machine-enforced gate membership is driven by reviewers.minimum + reviewers.required above.
extended_reviewers:
  devils-advocate:
    execution_order: 11
    can_be_na: false
    fail_rules:
      - alternative_required: true
      - bare_negation_invalid: true
    escalation:
      consecutive_fail_limit: 3
      action: advisory_demotion
      scope: current_review_cycle
      effect: non_blocking_feedback_only
  pattern-doubler:
    execution_order: 12
    can_be_na: true
    na_rule: "Allowed only if target artifact has no ID-bearing spec items (US/AC/BR/EX/TC)."
    fail_rules:
      - rationale_required: true
      - count_target: "2x current ID-bearing items"
      - count_scope: "US, AC, BR, EX, TC prefixed sequential IDs only"
