# Downstream design-system contract generated by /qfai-prototyping
checklist:
  color:
    - Use semantic colors derived from the selected direction.
  typography:
    - Use non-default type scale and rhythm aligned to brand-design.yaml.
  spacing:
    - Keep spacing consistent with the selected density.
  border_radius:
    - Avoid unmodified template radius defaults.
  shadow:
    - Use elevation only for functional layering.
  dos_and_donts:
    - Do preserve domain-specific visual signals.
    - Do not recreate a generic SaaS dashboard.
  component_tone:
    - Components should feel product-specific, not template-default.
  motion_rules:
    - Use motion only to clarify state changes.
