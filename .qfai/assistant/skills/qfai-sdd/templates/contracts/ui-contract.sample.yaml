# QFAI-CONTRACT-ID: CON-UI-0001
prototype:
  mode: interactive
  mockPaths:
    - id: mp_create_to_list
      flow: create -> list reflects
  markers:
    - id: mk_order_form
      selector: "[data-qfai='order-form']"
      purpose: order create form root
screens:
  - id: order_create
    title: Create Order
    route: /orders/new
    # primary_tasks: at least one entry required per screen (QFAI-AUD-001).
    # Recommended count band: 3..7 entries per screen (QFAI-AUD-020).
    # Counts outside the 3..7 band warn at validate time; tune the list
    # so it covers the screen's core user actions without over-loading
    # the surface. See references/ui-contract-guide.md for the rationale.
    # Each entry may be either a plain string (legacy) or a structured
    # `{id, label, acceptance}` object (closed schema — no other keys).
    primary_tasks:
      - submit a new order
    elements:
      - id: customer_id_input
        label: Customer ID
        type: input
        required: true
        validations:
          - must be non-empty
      - id: item_code_input
        label: Item Code
        type: input
        required: true
        validations:
          - must be non-empty
      - id: submit_button
        label: Submit
        type: button
        required: true
        validations: []
    actions:
      - id: submit_order
        label: Submit order
        kind: submit
        effect: navigates to /orders and shows the created row
