schema_version: "1.0"

profiles:
  default:
    always_required: [completion-reviewer]
    conditional_required: []
  requirements-heavy:
    always_required: [completion-reviewer, requirements-reviewer]
    conditional_required: []
  architecture-heavy:
    always_required: [completion-reviewer, architecture-reviewer]
    conditional_required: []
  ui-bearing:
    always_required: [completion-reviewer, product-surface-reviewer]
    conditional_required: []
  runtime-heavy:
    always_required: [completion-reviewer, qa-gatekeeper]
    conditional_required: [implementation-reviewer]
  # `qfai-implement` makes `implementation-reviewer` PASS item 8 of its
  # unconditional 12-point gate, so for that skill the code-quality review is
  # always required and always blocking. It shares `runtime-heavy` with
  # qfai-atdd / qfai-configure / qfai-verify, where the same reviewer is
  # genuinely conditional — hence a profile of its own rather than widening
  # runtime-heavy for all four.
  implementation-heavy:
    always_required: [completion-reviewer, qa-gatekeeper, implementation-reviewer]
    conditional_required: []

optional_modes:
  devils-advocate:
    kind: advisory
    description: Challenge assumptions aggressively, but do not block completion by default.
    alternative_required: true
    bare_negation_invalid: true
  pattern-doubler:
    kind: advisory
    description: Demand additional ID-bearing patterns with rationale when pattern coverage is thin.
    rationale_required: true
    default_target: "2x current ID-bearing items"
