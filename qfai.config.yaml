paths:
  specsDir: .qfai/specs
  contractsDir: .qfai/contracts
  discussionDir: .qfai/discussion
  outDir: .qfai/report
  skillsDir: .qfai/assistant/skills
  srcDir: src
  testsDir: tests
validation:
  failOn: error
  require:
    specSections: []
  testStrategy:
    requireLayerTags: false
    requireSizeTags: false
    maxE2eScenarioRatio: null
    maxE2eScenarioCount: null
  traceability:
    brMustHaveSc: true
    scMustHaveTest: true
    testFileGlobs:
      - tests/**/*.test.ts
      - tests/**/*.spec.ts
      - packages/*/tests/**/*.test.ts
      - packages/*/tests/**/*.spec.ts
      - src/**/*.test.ts
      - src/**/*.spec.ts
      - packages/*/src/**/*.test.ts
      - packages/*/src/**/*.spec.ts
      - features/**/*.feature
      - packages/*/features/**/*.feature
    testFileExcludeGlobs:
      # Meta-test: the test-todo-stub validator's own fixture builder contains
      # `it.todo(...)` / `test.todo(...)` / `describe.todo(...)` as strings to
      # feed into the validator. Excluding avoids self-referential false
      # positives from spec-0017 REQ-0009 (QFAI-TEST-0001).
      - "packages/qfai/tests/validators/testTodoStubs.test.ts"
    scNoTestSeverity: error
    orphanContractsPolicy: error
    unknownContractIdSeverity: error
output:
  validateJsonPath: .qfai/report/validate.json
prototyping:
  calibration:
    packPath: .qfai/evidence/calibration.yaml
  execution:
    targetUrl: null
    browserTool: playwright-cli
