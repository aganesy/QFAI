paths:
  specsDir: .qfai/specs
  contractsDir: .qfai/contracts
  discussionDir: .qfai/discussion
  outDir: .qfai/report
  skillsDir: .qfai/assistant/skills
  srcDir: src
  testsDir: tests
validation:
  failOn: error
  require:
    specSections: []
  testStrategy:
    maxE2eScenarioRatio: null
    maxE2eScenarioCount: null
    # `qfai validate` rejects `it.todo` / `test.todo` / `describe.todo` stubs in
    # files matched by traceability.testFileGlobs (QFAI-TEST-001). Setting this
    # to false is the documented opt-out, and it is not machine-checked: the
    # stub check then returns nothing at all, and no field here associates a
    # waiver with it. Recording a waiver DR-ID is a governance step we take and
    # review ourselves; `qfai validate` will not ask for one.
    forbidTestTodoStubs: true
  traceability:
    brMustHaveSc: true
    scMustHaveTest: true
    testFileGlobs:
      - tests/**/*.test.ts
      - tests/**/*.spec.ts
      - packages/*/tests/**/*.test.ts
      - packages/*/tests/**/*.spec.ts
      - src/**/*.test.ts
      - src/**/*.spec.ts
      - packages/*/src/**/*.test.ts
      - packages/*/src/**/*.spec.ts
      - features/**/*.feature
      - packages/*/features/**/*.feature
    testFileExcludeGlobs: []
    scNoTestSeverity: error
    orphanContractsPolicy: error
    unknownContractIdSeverity: error
output:
  validateJsonPath: .qfai/report/validate.json
prototyping:
  calibration:
    packPath: .qfai/evidence/calibration.yaml
  execution:
    targetUrl: null
    browserTool: playwright
